<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Formula Vault — JEE Formula Reference</title>
<style>
  :root{
    --bg-0:#060a13;
    --bg-1:#0b1424;
    --glass-fill: rgba(186,209,255,0.055);
    --glass-fill-strong: rgba(186,209,255,0.10);
    --glass-border: rgba(198,218,255,0.14);
    --glass-border-strong: rgba(198,218,255,0.28);
    --text-hi: rgba(240,246,255,0.97);
    --text-mid: rgba(210,224,250,0.68);
    --text-low: rgba(196,213,245,0.44);
    --shadow-panel: 0 8px 32px rgba(0,0,0,0.38), inset 0 1px 0 rgba(255,255,255,0.07);
    --shadow-header: 0 12px 32px rgba(0,0,0,0.42);
    --header-bg: rgba(6,10,20,0.55);
    --input-bg: rgba(186,209,255,0.055);
    --input-bg-focus: rgba(186,209,255,0.10);
    --soft-fill: rgba(186,209,255,0.05);
    --soft-fill-hover: rgba(186,209,255,0.09);
    --soft-border: rgba(198,218,255,0.10);
    --pill-bg: rgba(186,209,255,0.05);
    --blob1:#15306B;
    --blob2:#0B5E82;
    --blob3:#3A3DAE;
    --blob-opacity:0.55;

    --blue:#1D64D8;
    --blue-rgb:29,100,216;
    --cyan:#0E93AE;
    --cyan-rgb:14,147,174;
    --indigo:#5457D9;
    --indigo-rgb:84,87,217;
    --amber:#FF9F0A;

    --radius-l: 26px;
    --radius-m: 18px;
    --radius-s: 12px;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }

  html[data-theme="light"]{
    --bg-0:#f1f6fd;
    --bg-1:#dfeafc;
    --glass-fill: rgba(255,255,255,0.55);
    --glass-fill-strong: rgba(255,255,255,0.72);
    --glass-border: rgba(60,110,190,0.16);
    --glass-border-strong: rgba(60,110,190,0.32);
    --text-hi: #0B1E3D;
    --text-mid: rgba(11,30,61,0.66);
    --text-low: rgba(11,30,61,0.44);
    --shadow-panel: 0 8px 28px rgba(30,64,120,0.14), inset 0 1px 0 rgba(255,255,255,0.65);
    --shadow-header: 0 10px 26px rgba(30,64,120,0.12);
    --header-bg: rgba(238,244,252,0.68);
    --input-bg: rgba(255,255,255,0.55);
    --input-bg-focus: rgba(255,255,255,0.75);
    --soft-fill: rgba(30,64,120,0.045);
    --soft-fill-hover: rgba(30,64,120,0.08);
    --soft-border: rgba(30,64,120,0.10);
    --pill-bg: rgba(255,255,255,0.55);
    --blob1:#BFDBFE;
    --blob2:#A6E6F2;
    --blob3:#D2D4FB;
    --blob-opacity:0.75;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    background: var(--bg-0);
    color: var(--text-hi);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x:hidden;
    transition: background-color .4s var(--ease), color .4s var(--ease);
  }

  /* ---------- animated ambient background ---------- */
  .bg{
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    background: radial-gradient(130% 95% at 50% -10%, var(--bg-1) 0%, var(--bg-0) 55%);
    transition: background .4s var(--ease);
  }
  .blob{
    position:absolute;
    border-radius:50%;
    filter: blur(110px);
    opacity: var(--blob-opacity);
    will-change: transform;
    transition: background .5s var(--ease), opacity .5s var(--ease);
  }
  .blob-1{
    width:52vw; height:52vw; max-width:760px; max-height:760px;
    background: radial-gradient(circle at 30% 30%, var(--blob1), transparent 70%);
    top:-14vw; left:-10vw;
    animation: drift1 26s var(--ease) infinite alternate;
  }
  .blob-2{
    width:46vw; height:46vw; max-width:680px; max-height:680px;
    background: radial-gradient(circle at 60% 40%, var(--blob2), transparent 70%);
    bottom:-16vw; right:-8vw;
    animation: drift2 32s var(--ease) infinite alternate;
  }
  .blob-3{
    width:36vw; height:36vw; max-width:560px; max-height:560px;
    background: radial-gradient(circle at 50% 50%, var(--blob3), transparent 72%);
    top:38vh; left:38vw;
    opacity: calc(var(--blob-opacity) - 0.15);
    animation: drift3 38s var(--ease) infinite alternate;
  }
  @keyframes drift1{ 0%{transform:translate(0,0) scale(1);} 100%{transform:translate(6vw,8vh) scale(1.12);} }
  @keyframes drift2{ 0%{transform:translate(0,0) scale(1);} 100%{transform:translate(-7vw,-6vh) scale(1.08);} }
  @keyframes drift3{ 0%{transform:translate(0,0) scale(1);} 100%{transform:translate(-5vw,7vh) scale(1.18);} }
  @media (prefers-reduced-motion: reduce){
    .blob{ animation: none !important; }
  }

  /* ---------- glass base ---------- */
  .glass{
    background: var(--glass-fill);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid var(--glass-border);
    box-shadow: var(--shadow-panel);
    transition: background-color .4s var(--ease), border-color .4s var(--ease), box-shadow .4s var(--ease);
  }

  /* ---------- layout ---------- */
  .shell{
    max-width: 1180px;
    margin: 0 auto;
    padding: 20px 20px 64px;
  }

  header.top{
    position: sticky;
    top: 0;
    z-index: 40;
    padding: 14px 16px;
    margin: 0 0 18px 0;
    border-radius: 0 0 var(--radius-l) var(--radius-l);
    background: var(--header-bg);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    backdrop-filter: blur(24px) saturate(180%);
    border-bottom: 1px solid var(--glass-border);
    box-shadow: var(--shadow-header);
    transition: background-color .4s var(--ease), box-shadow .4s var(--ease), border-color .4s var(--ease);
  }
  .top-row{
    display:flex;
    align-items:center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    flex-shrink:0;
  }
  .brand-mark{
    width: 38px; height: 38px;
    border-radius: 11px;
    display:flex; align-items:center; justify-content:center;
    background: linear-gradient(135deg, var(--blue), var(--indigo));
    box-shadow: 0 4px 18px rgba(var(--blue-rgb),0.45);
    flex-shrink:0;
  }
  .brand-text h1{
    font-size: 17px;
    font-weight: 700;
    margin:0;
    letter-spacing: -0.01em;
  }
  .brand-text p{
    font-size: 11.5px;
    margin:0;
    color: var(--text-low);
    font-weight:500;
  }

  .search-wrap{
    flex: 1 1 220px;
    min-width: 180px;
    position: relative;
    display:flex;
    align-items:center;
  }
  .search-wrap svg{
    position:absolute;
    left:14px;
    width:16px; height:16px;
    color: var(--text-low);
    pointer-events:none;
  }
  #search{
    width:100%;
    padding: 10px 14px 10px 38px;
    border-radius: 999px;
    border: 1px solid var(--glass-border);
    background: var(--input-bg);
    color: var(--text-hi);
    font-size: 14.5px;
    font-family: inherit;
    outline:none;
    transition: border-color .3s var(--ease), background .3s var(--ease), box-shadow .3s var(--ease);
  }
  #search::placeholder{ color: var(--text-low); }
  #search:focus{
    border-color: rgba(var(--blue-rgb),0.6);
    background: var(--input-bg-focus);
    box-shadow: 0 0 0 4px rgba(var(--blue-rgb),0.18);
  }
  #clearSearch{
    position:absolute;
    right:10px;
    width:20px; height:20px;
    border-radius:50%;
    border:none;
    background: var(--soft-fill-hover);
    color: var(--text-hi);
    display:none;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:12px;
    line-height:1;
  }
  #clearSearch.show{ display:flex; }

  .count-pill{
    flex-shrink:0;
    font-size: 12px;
    font-weight:600;
    color: var(--text-mid);
    padding: 7px 12px;
    border-radius:999px;
    border:1px solid var(--glass-border);
    background: var(--pill-bg);
    white-space:nowrap;
    transition: background-color .4s var(--ease), border-color .4s var(--ease), color .4s var(--ease);
  }

  .theme-toggle{
    flex-shrink:0;
    width:38px; height:38px;
    border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    color: var(--text-hi);
    cursor:pointer;
    padding:0;
    transition: transform .3s var(--ease), background-color .4s var(--ease), border-color .4s var(--ease);
  }
  .theme-toggle:hover{ transform: scale(1.07); }
  .theme-toggle:active{ transform: scale(0.94); }
  .theme-toggle svg{ width:18px; height:18px; }
  .theme-toggle .icon-moon{ display:none; }
  html[data-theme="light"] .theme-toggle .icon-sun{ display:none; }
  html[data-theme="light"] .theme-toggle .icon-moon{ display:block; }

  /* ---------- segmented controls ---------- */
  .controls{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin: 16px 0 22px;
    transition: opacity .3s var(--ease);
  }
  .seg{
    display:inline-flex;
    padding:4px;
    border-radius: 999px;
    gap:2px;
    width:max-content;
    max-width:100%;
  }
  .seg button{
    border:none;
    background: transparent;
    color: var(--text-mid);
    font-family:inherit;
    font-size: 13.5px;
    font-weight:600;
    padding: 8px 18px;
    border-radius:999px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:7px;
    transition: color .3s var(--ease), background .35s var(--ease), box-shadow .35s var(--ease);
    white-space:nowrap;
  }
  .seg button svg{ width:15px; height:15px; opacity:0.85; }
  .seg button.active{
    color:#fff;
    background: var(--soft-fill-hover);
    box-shadow: inset 0 0 0 1px var(--glass-border-strong), 0 3px 10px rgba(0,0,0,0.18);
  }
  .seg.class-seg button.active{
    background: linear-gradient(135deg, rgba(var(--blue-rgb),0.92), rgba(var(--blue-rgb),0.55));
    box-shadow: 0 3px 14px rgba(var(--blue-rgb),0.5), inset 0 0 0 1px rgba(255,255,255,0.25);
  }
  .seg.subject-seg button[data-subject="physics"].active{
    background: linear-gradient(135deg, rgba(var(--blue-rgb),0.92), rgba(var(--blue-rgb),0.5));
    box-shadow: 0 3px 14px rgba(var(--blue-rgb),0.45), inset 0 0 0 1px rgba(255,255,255,0.25);
  }
  .seg.subject-seg button[data-subject="chemistry"].active{
    background: linear-gradient(135deg, rgba(var(--cyan-rgb),0.92), rgba(var(--cyan-rgb),0.5));
    box-shadow: 0 3px 14px rgba(var(--cyan-rgb),0.4), inset 0 0 0 1px rgba(255,255,255,0.25);
  }
  .seg.subject-seg button[data-subject="math"].active{
    background: linear-gradient(135deg, rgba(var(--indigo-rgb),0.92), rgba(var(--indigo-rgb),0.5));
    box-shadow: 0 3px 14px rgba(var(--indigo-rgb),0.4), inset 0 0 0 1px rgba(255,255,255,0.25);
  }

  .chips{
    display:flex;
    gap:9px;
    overflow-x:auto;
    padding: 2px 2px 8px;
    scrollbar-width: none;
  }
  .chips::-webkit-scrollbar{ display:none; }
  .chip{
    flex-shrink:0;
    border:1px solid var(--glass-border);
    background: var(--soft-fill);
    color: var(--text-mid);
    font-family:inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 15px;
    border-radius: 999px;
    cursor:pointer;
    transition: all .3s var(--ease);
    white-space:nowrap;
  }
  .chip:hover{ color: var(--text-hi); border-color: var(--glass-border-strong); background: var(--soft-fill-hover); }
  .chip.active{
    color:#fff;
    border-color: rgba(var(--blue-rgb),0.7);
    background: linear-gradient(135deg, rgba(var(--blue-rgb),0.92), rgba(var(--blue-rgb),0.65));
    box-shadow: 0 0 0 1px rgba(var(--blue-rgb),0.4), 0 4px 14px rgba(var(--blue-rgb),0.3);
  }

  /* ---------- grid ---------- */
  #grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(268px, 1fr));
    gap: 18px;
  }

  .chapter-heading{
    grid-column: 1 / -1;
    display:flex;
    align-items:baseline;
    gap:10px;
    margin: 22px 0 2px;
    padding-bottom:8px;
    border-bottom: 1px solid var(--soft-border);
  }
  .chapter-heading:first-child{ margin-top:4px; }
  .chapter-heading h2{
    font-size: 15px;
    font-weight:700;
    margin:0;
    color: var(--text-hi);
  }
  .chapter-heading span{
    font-size:11.5px;
    color: var(--text-low);
    font-weight:600;
  }
  mark{
    background: rgba(var(--acc-rgb),0.18);
    color: inherit;
    border-radius:3px;
    padding:0 2px;
  }
  .fv-ai-note{ font-size:12.5px; color:var(--text-low); line-height:1.55; margin:0 0 14px; }
  .ai-key-row{ border:1px solid var(--glass-border); border-radius:12px; padding:12px; margin-bottom:12px; background:var(--glass-fill);
    box-shadow:0 6px 18px rgba(0,0,0,.06); }
  .ai-key-head{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .ai-key-head b{ font-size:13.5px; }
  .ai-key-head a{ font-size:12px; color:var(--acc); text-decoration:none; font-weight:600; }
  .ai-key-head .ai-ok{ margin-left:auto; font-size:11.5px; font-weight:700; color:#2fbf71; }
  .ai-key-in{ display:flex; gap:8px; }
  .ai-key-in input{ flex:1; min-width:0; background:var(--glass-fill-strong); border:1px solid var(--glass-border); color:var(--text-hi);
    border-radius:10px; padding:9px 11px; font-size:13px; font-family:ui-monospace,SFMono-Regular,Consolas,monospace; outline:none; }
  .ai-key-in input:focus{ border-color:rgba(var(--acc-rgb),.6); box-shadow:0 0 0 3px rgba(var(--acc-rgb),.15); }
  .ai-key-in .fv-btn{ white-space:nowrap; }
  .ai-state{ font-size:12px; margin-top:8px; min-height:15px; }
  .ai-state .ai-ok{ color:#2fbf71; font-weight:600; }
  .ai-state .ai-err{ color:#FF375F; font-weight:600; }
  .ai-state .ai-wait{ color:var(--text-low); }
  .fv-err .fv-btn{ display:block; }

  .empty-state{
    grid-column: 1/-1;
    text-align:center;
    padding: 70px 20px;
    color: var(--text-mid);
  }
  .empty-state h3{ margin:0 0 6px; font-size:16px; color:var(--text-hi); }
  .empty-state p{ margin:0; font-size:13.5px; color: var(--text-low); }

  /* ---------- flip card ---------- */
  .card-outer{
    perspective: 1400px;
    height: 250px;
    cursor:pointer;
    outline:none;
  }
  .card-inner{
    position:relative;
    width:100%; height:100%;
    transition: transform .55s var(--ease);
    transform-style: preserve-3d;
  }
  .card-outer:hover .card-inner{
    transform: rotateX(3deg) rotateY(-4deg) translateY(-4px) scale(1.015);
  }
  .card-outer.flipped .card-inner{ transform: rotateY(180deg); }
  .card-outer.flipped:hover .card-inner{ transform: rotateY(180deg) translateY(-4px) scale(1.015); }

  .face{
    position:absolute; inset:0;
    -webkit-backface-visibility:hidden;
    backface-visibility:hidden;
    border-radius: var(--radius-m);
    padding: 18px 18px 14px;
    display:flex;
    flex-direction:column;
    background: var(--glass-fill);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid var(--glass-border);
    box-shadow: var(--shadow-panel);
    transition: border-color .3s var(--ease), box-shadow .3s var(--ease), background-color .4s var(--ease);
  }
  .card-outer:hover .face{ border-color: var(--glass-border-strong); }
  .face-back{ transform: rotateY(180deg); overflow-y:auto; }
  .face-back::-webkit-scrollbar{ width:5px; }
  .face-back::-webkit-scrollbar-thumb{ background: var(--soft-fill-hover); border-radius:10px; }

  .card-tag{
    font-size: 10.5px;
    font-weight:700;
    letter-spacing:.01em;
    color: var(--text-low);
    margin-bottom: 8px;
  }
  .card-tag b{ color: var(--accent-c, var(--blue)); font-weight:700; }
  .card-title{
    font-size: 14.5px;
    font-weight: 700;
    color: var(--text-hi);
    margin: 0 0 auto;
    line-height:1.3;
  }
  .card-eq{
    font-size: 19px;
    text-align:center;
    color: var(--text-hi);
    font-family: "New York", ui-serif, Georgia, "SF Pro Display", serif;
    font-style: italic;
    letter-spacing: 0.01em;
    padding: 10px 4px;
    line-height:1.5;
  }
  .card-eq sup{ font-size:0.62em; font-style:normal; }
  .card-eq sub{ font-size:0.62em; font-style:normal; }
  .frac{ display:inline-flex; flex-direction:column; vertical-align:middle; text-align:center; margin:0 5px; line-height:1.15; }
  .frac .num{ border-bottom:1.4px solid currentColor; padding:0 3px 3px; }
  .frac .den{ padding:3px 3px 0; }

  .card-hint{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    font-size: 10.5px;
    font-weight:600;
    color: var(--text-low);
    margin-top:auto;
    padding-top:6px;
  }
  .card-hint svg{ width:11px; height:11px; }

  .back-chapter{
    font-size: 10.5px;
    font-weight:700;
    color: var(--accent-c, var(--blue));
    margin-bottom:8px;
    text-transform:none;
  }
  .sym-list{
    list-style:none;
    margin:0 0 8px;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  .sym-list li{
    font-size: 12px;
    color: var(--text-mid);
    line-height:1.4;
    display:flex;
    gap:6px;
  }
  .sym-list b{
    color: var(--text-hi);
    font-style:italic;
    font-family: "New York", ui-serif, Georgia, serif;
    flex-shrink:0;
    min-width: 20px;
  }
  .const-box{
    font-size: 11px;
    color: var(--text-mid);
    background: var(--soft-fill);
    border: 1px solid var(--soft-border);
    border-radius: 10px;
    padding: 7px 9px;
    margin-bottom: 8px;
    line-height:1.55;
  }
  .case-box{
    font-size: 11px;
    color: var(--text-mid);
    background: var(--soft-fill);
    border-left: 2px solid var(--accent-c, var(--blue));
    border-radius: 8px;
    padding: 7px 9px;
    margin-bottom: 8px;
    line-height:1.5;
  }
  .case-box .case-label{
    font-size: 10px;
    font-weight:700;
    color: var(--accent-c, var(--blue));
    display:block;
    margin-bottom:3px;
  }
  .case-box ul{ margin:0; padding-left:14px; }
  .case-box li{ margin-bottom:2px; }
  .tip-box{
    font-size: 11.5px;
    color: var(--text-hi);
    background: linear-gradient(135deg, rgba(255,159,10,0.16), rgba(255,159,10,0.05));
    border: 1px solid rgba(255,159,10,0.3);
    border-radius: 10px;
    padding: 8px 10px;
    line-height:1.45;
    margin-top:auto;
  }
  .tip-box b{ color: var(--amber); }

  footer.foot{
    text-align:center;
    margin-top: 40px;
    color: var(--text-low);
    font-size: 11.5px;
  }

  /* ---------- derivations ---------- */
  .mode-seg{ margin-bottom: 2px; }
  .mode-seg button svg{ width:14px; height:14px; }
  html[data-theme="light"] .mode-seg button.active{ color: var(--text-hi); }

  .deriv-note{
    grid-column: 1/-1;
    font-size: 12px;
    color: var(--text-low);
    background: var(--soft-fill);
    border: 1px solid var(--soft-border);
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 4px;
    line-height: 1.5;
  }

  .deriv-card{
    grid-column: 1/-1;
    background: var(--glass-fill);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-m);
    box-shadow: var(--shadow-panel);
    padding: 16px 18px;
    transition: border-color .3s var(--ease), background-color .4s var(--ease);
  }
  .deriv-card:hover{ border-color: var(--glass-border-strong); }
  .deriv-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 12px;
    cursor: pointer;
  }
  .deriv-head-text{ display:flex; flex-direction:column; gap:4px; }
  .deriv-tag{
    font-size: 10.5px;
    font-weight: 700;
    color: var(--accent-c, var(--blue));
  }
  .deriv-title{
    font-size: 14.5px;
    font-weight: 700;
    color: var(--text-hi);
    line-height:1.3;
  }
  .deriv-chevron{
    flex-shrink:0;

     tip:"μₛ > μₖ always. Use μₛN as the maximum possible static friction, not a fixed value."},
    {t:"Centripetal Force", eq:"F<sub>c</sub> = " + frac("mv²","r") + " = mω²r",
     sym:[["v","Tangential speed"],["r","Radius of circular path"],["ω","Angular velocity"]],
     cases:["Conical pendulum time period: T = 2π√(L cosθ/g), θ = angle string makes with the vertical"],
     tip:"Centripetal force is not a new force — it's the net radial component of real forces (tension, gravity, friction, normal)."},
    {t:"Apparent Weight in a Lift", eq:"N = m(g ± a)",
     sym:[["N","Normal reaction (apparent weight)"],["a","Lift's acceleration"]],
     cases:["Accelerating upward: N = m(g + a)","Accelerating downward: N = m(g − a)","Free fall (a = g): N = 0 (weightlessness)"],
     tip:"Apparent weight is what a weighing scale in the lift would read — not the true gravitational weight mg."},
    {t:"Banking of Roads", eq:"Frictionless: tanθ = " + frac("v²","rg"),
     sym:[["θ","Banking angle"],["v","Safe speed at that angle"]],
     cases:["Maximum safe speed (with friction): v_max = √[rg(tanθ+μ)/(1−μtanθ)]","Minimum safe speed (with friction): v_min = √[rg(tanθ−μ)/(1+μtanθ)]"],
     tip:"This is the ideal speed for zero reliance on friction — real safe-speed range extends both below and above this using friction."},
    {t:"Lami's Theorem (Equilibrium of Concurrent Forces)", eq:frac("F<sub>1</sub>","sinα") + " = " + frac("F<sub>2</sub>","sinβ") + " = " + frac("F<sub>3</sub>","sinγ"),
     sym:[["F1, F2, F3","Three concurrent, coplanar forces in equilibrium"],["α, β, γ","Angle opposite each force (between the other two)"]], tip:"Only valid for exactly three concurrent forces in equilibrium — for more than three, resolve into components instead."},
    {t:"Variable Mass System — Rocket Propulsion", eq:"v = u ln(m<sub>0</sub>/m)",
     sym:[["u","Exhaust speed relative to the rocket"],["m0","Initial mass"],["m","Mass at time t"]], tip:"This assumes no external force (like gravity) acts — include a −gt term separately if the rocket is launched against gravity."}
  ]},

  {cls:"11", subject:"physics", chapter:"Work, Energy & Power", formulas:[
    {t:"Work Done by a Force", eq:"W = F·s·cosθ",
     sym:[["F","Applied force"],["s","Displacement"],["θ","Angle between F and s"]], tip:"Work is zero when force is perpendicular to displacement — e.g. tension in circular motion, normal force on a flat surface."},
    {t:"Kinetic Energy", eq:"KE = " + frac("1","2") + "mv²",
     sym:[["m","Mass"],["v","Speed"]], tip:"KE is always positive and frame-dependent — it changes if you switch reference frames."},
    {t:"Gravitational Potential Energy", eq:"PE = mgh",
     sym:[["h","Height above reference level"]], tip:"Only valid near Earth's surface where g is constant; use −GMm/r for large distances."},
    {t:"Elastic PE in a Spring", eq:"U = " + frac("1","2") + "kx²",
     sym:[["k","Spring constant"],["x","Compression or extension"]], tip:"Always positive regardless of whether the spring is stretched or compressed — x is squared."},
    {t:"Work–Energy Theorem", eq:"W<sub>net</sub> = ΔKE",
     sym:[], tip:"Bypasses the need to know the acceleration profile in detail — extremely fast for variable-force problems."},
    {t:"Average Power", eq:"P = " + frac("W","t") + " = F·v",
     sym:[["P","Power (Watt)"],["v","Instantaneous velocity"]], tip:"P = F·v (dot product) is the instantaneous form — use it directly when force and velocity vary with time."},
    {t:"Coefficient of Restitution", eq:"e = " + frac("v<sub>2</sub> − v<sub>1</sub>","u<sub>1</sub> − u<sub>2</sub>"),
     sym:[["u1, u2","Velocities of approach"],["v1, v2","Velocities of separation"]],
     cases:["e = 1: perfectly elastic collision","e = 0: perfectly inelastic (bodies stick together)","0 < e < 1: inelastic collision"],
     tip:"Velocity of separation divided by velocity of approach — always between 0 and 1 for real collisions."},
    {t:"Elastic Collision Velocities (1D, two bodies)", eq:"v<sub>1</sub>′ = " + frac("(m<sub>1</sub>−m<sub>2</sub>)u<sub>1</sub> + 2m<sub>2</sub>u<sub>2</sub>","m<sub>1</sub>+m<sub>2</sub>"),
     sym:[["v1′","Velocity of mass 1 after collision"]],
     cases:["v2′ = [(m2−m1)u2 + 2m1u1] / (m1+m2)","Equal masses (m1=m2): velocities simply exchange — v1′=u2, v2′=u1","Oblique elastic collision of equal masses: the two bodies move off at 90° to each other"],
     tip:"Derived from simultaneously conserving momentum and kinetic energy — for equal masses the two bodies literally swap velocities."},
    {t:"Relation Between Conservative Force and Potential Energy", eq:"F = −" + frac("dU","dx"),
     sym:[["U","Potential energy function"]],
     cases:["In 3D: F = −∇U (the negative gradient of U)"],
     tip:"Force always points 'downhill' on the potential energy curve — equilibrium occurs where dU/dx=0, and it's stable when d²U/dx² > 0."},
    {t:"Vertical Circular Motion — Critical Speeds", eq:"v<sub>top</sub> = √(gr)",
     sym:[["v_top","Minimum speed at the top of the loop"]],
     cases:["Minimum speed at the bottom to complete the loop: v_bottom = √(5gr)","Tension at angle θ from the lowest point: T = (mv²/r) + mg cosθ","Rod or tube (rigid support): minimum speed at the top is 0, not √(gr), since the support can push inward"],
     tip:"At the top, gravity alone must supply the centripetal force at minimum speed — any slower and the object leaves the circular path before reaching the top."}
  ]},

  {cls:"11", subject:"physics", chapter:"Centre of Mass", formulas:[
    {t:"Centre of Mass — Two-Particle System", eq:"x<sub>cm</sub> = " + frac("m<sub>1</sub>x<sub>1</sub> + m<sub>2</sub>x<sub>2</sub>","m<sub>1</sub> + m<sub>2</sub>"),
     sym:[["m1, m2","Masses of the two particles"],["x1, x2","Their positions"]],
     cases:["Continuous rigid body: x_cm = (1/M)∫x dm"],
     tip:"The centre of mass moves as if all external force acts on it directly — internal forces between particles never affect its motion."},
    {t:"Centre of Mass — System of n Particles", eq:"R<sub>cm</sub> = " + frac("Σm<sub>i</sub>r<sub>i</sub>","Σm<sub>i</sub>") + " = " + frac("Σm<sub>i</sub>r<sub>i</sub>","M"),
     sym:[["ri","Position vector of the ith particle"],["M","Total mass"]], tip:"This is a vector equation — apply it separately to x, y, and z components when particles are scattered in space."},
    {t:"Centre of Mass of a Uniform Rod", eq:"At the midpoint, L/2 from either end",
     sym:[["L","Length of the rod"]], tip:"The base case for every 1D symmetric body — uniform mass distribution always puts the COM at the geometric centre."},
    {t:"Centre of Mass — Semicircular Ring & Disc", eq:"Semicircular ring (arc): 2R/π from the centre",
     sym:[["R","Radius"]],
     cases:["Semicircular disc (lamina): 4R/3π from the centre"],
     tip:"The disc's COM sits closer to the centre than the ring's (4/3π ≈ 0.424R vs 2/π ≈ 0.637R) — the disc has extra mass filled in near the centre, pulling the COM inward."},
    {t:"Centre of Mass — Quarter Circular Arc & Disc", eq:"Quarter arc: COM at (2R/π, 2R/π) from the centre",
     sym:[["R","Radius"]],
     cases:["Quarter disc: COM at (4R/3π, 4R/3π) from the corner (right-angle vertex)"],
     tip:"Each Cartesian coordinate for the quarter arc equals the full semicircular ring's COM distance — a neat, frequently-used shortcut."},
    {t:"Centre of Mass of a Triangular Lamina", eq:"At the centroid: h/3 from the base, along the median",
     sym:[["h","Height (median length) from that base"]],
     cases:["In coordinates: ((x1+x2+x3)/3, (y1+y2+y3)/3), using the three vertices"],
     tip:"The centroid is where all three medians intersect — true for ANY triangle, not just symmetric ones."},
    {t:"Centre of Mass — Solid Hemisphere & Hemispherical Shell", eq:"Solid hemisphere: 3R/8 from the flat face",
     sym:[["R","Radius"]],
     cases:["Hemispherical shell (hollow, curved surface only): R/2 from the flat face"],
     tip:"Both are measured along the axis of symmetry from the centre of the flat circular face — the shell's COM sits further out since all its mass is on the curved surface."},
    {t:"Centre of Mass — Solid Cone & Hollow Cone", eq:"Solid cone: h/4 from the base, along the axis",
     sym:[["h","Height of the cone"]],
     cases:["Hollow cone (lateral surface only, no base): h/3 from the base"],
     tip:"More of a solid cone's mass sits near the wide base, pulling its COM closer to the base than the hollow cone's."},
    {t:"Centre of Mass of a Body with a Removed Portion", eq:"x<sub>cm</sub> = " + frac("m<sub>1</sub>x<sub>1</sub> − m<sub>2</sub>x<sub>2</sub>","m<sub>1</sub> − m<sub>2</sub>"),
     sym:[["m1, x1","Mass and COM of the original (complete) body"],["m2, x2","Mass and COM of the removed portion"]], tip:"Treat the cavity as 'negative mass' at its own COM location — this trick handles discs-with-holes, cut plates, and similar composite-body problems in one line."}
  ]},

  {cls:"11", subject:"physics", chapter:"Moment of Inertia", formulas:[
    {t:"Moment of Inertia — Definition", eq:"I = mr² &nbsp;(point mass)",
     sym:[["m","Mass of particle"],["r","Perpendicular distance from axis"]],
     cases:["System of particles: I = Σmᵢrᵢ²"],
     tip:"I depends on the choice of axis, not just the shape — always state which axis a moment of inertia is calculated about."},
    {t:"Radius of Gyration", eq:"I = Mk² &nbsp;⇒&nbsp; k = √(I/M)",
     sym:[["k","Radius of gyration"]], tip:"k is the distance from the axis at which the entire mass could be concentrated to give the same I."},
    {t:"Parallel Axis Theorem", eq:"I = I<sub>cm</sub> + Md²",
     sym:[["I_cm","MI about axis through centre of mass"],["d","Distance between the two parallel axes"]], tip:"Only applies between a centroidal axis and a parallel axis — not between two arbitrary parallel axes. Used repeatedly below to reach tangent-axis results."},
    {t:"Perpendicular Axis Theorem", eq:"I<sub>z</sub> = I<sub>x</sub> + I<sub>y</sub>",
     sym:[["I_z","MI about axis ⊥ to lamina"],["I_x, I_y","MI about two mutually ⊥ axes in the plane"]], tip:"Only valid for a planar (2D) lamina — never apply to 3D bodies like spheres or cylinders. Used below to get each ring/disc's diameter MI from its central-axis MI."},
    {t:"MOI of a Ring (Circular Hoop)", eq:"About central axis (⊥ to plane): I = MR²",
     sym:[["M","Total mass"],["R","Radius"]],
     cases:["About a diameter (in-plane): I = MR²/2","About a tangent, in the plane of the ring: I = 3MR²/2","About a tangent, ⊥ to the plane: I = 2MR²"],
     tip:"All mass sits at the same distance R from the centre — this is why a ring has the largest MOI of any shape with the same mass and radius."},
    {t:"MOI of a Disc", eq:"About central axis (⊥ to plane): I = MR²/2",
     sym:[["M","Total mass"],["R","Radius"]],
     cases:["About a diameter (in-plane): I = MR²/4","About a tangent, in the plane of the disc: I = 5MR²/4","About a tangent, ⊥ to the plane: I = 3MR²/2"],
     tip:"Exactly half the ring's MOI about the same central axis — the disc's mass is spread inward, much of it closer to the axis."},
    {t:"MOI of an Annular Disc (Ring with Inner & Outer Radius)", eq:"I = " + frac("1","2") + "M(R<sub>1</sub>² + R<sub>2</sub>²)",
     sym:[["R1","Inner radius"],["R2","Outer radius"]], tip:"Set R1=0 and this correctly reduces to the plain disc formula — a good way to check you've remembered it right."},
    {t:"MOI of a Thin Rod", eq:"About centre, ⊥ to length: I = ML²/12",
     sym:[["M","Mass"],["L","Length"]],
     cases:["About one end, ⊥ to length: I = ML²/3","About its own length axis (thin rod): I ≈ 0"],
     tip:"The end-axis value is exactly 4× the centre-axis value — a quick way to sanity-check you've applied the parallel axis theorem correctly (Md² = M(L/2)² = ML²/4, plus ML²/12 = ML²/3)."},
    {t:"MOI of a Rectangular Plate", eq:"About centre, ⊥ to plane: I = M(l² + b²)/12",
     sym:[["l, b","Length and breadth"]],
     cases:["About centre, in-plane, parallel to breadth: I = Ml²/12","About centre, in-plane, parallel to length: I = Mb²/12"],
     tip:"The perpendicular-axis value is just the sum of the two in-plane values — exactly as the perpendicular axis theorem predicts."},
    {t:"MOI of a Square Plate", eq:"About centre, ⊥ to plane: I = Ma²/6",
     sym:[["a","Side length"]],
     cases:["About centre, in-plane (through midpoints of opposite sides): I = Ma²/12"],
     tip:"Just the rectangular plate formula with l = b = a — a useful special case to recognise instantly."},
    {t:"MOI of a Solid Cylinder", eq:"About its own (longitudinal) axis: I = MR²/2",
     sym:[["M","Mass"],["R","Radius"],["L","Length"]],
     cases:["About a central diameter, ⊥ to its length: I = M(R²/4 + L²/12)","About a tangent parallel to its own axis: I = 3MR²/2"],
     tip:"About its own axis, a solid cylinder behaves exactly like a disc — length doesn't matter at all for that particular axis."},
    {t:"MOI of a Hollow Cylinder (Thin-Walled Tube)", eq:"About its own (longitudinal) axis: I = MR²",
     sym:[["M","Mass"],["R","Radius"],["L","Length"]],
     cases:["About a central diameter, ⊥ to its length: I = M(R²/2 + L²/12)"],
     tip:"About its own axis, a hollow cylinder behaves exactly like a ring — same logic as the solid cylinder/disc pairing above."},
    {t:"MOI of a Solid Sphere", eq:"About a diameter: I = " + frac("2","5") + "MR²",
     sym:[["M","Mass"],["R","Radius"]],
     cases:["About a tangent: I = 7MR²/5"],
     tip:"The lowest MOI coefficient of any standard shape — a solid sphere packs its mass closest to the axis on average."},
    {t:"MOI of a Hollow Sphere (Thin Shell)", eq:"About a diameter: I = " + frac("2","3") + "MR²",
     sym:[["M","Mass"],["R","Radius"]],
     cases:["About a tangent: I = 5MR²/3"],
     tip:"Larger than the solid sphere's coefficient (⅔ vs ⅖) since every bit of mass sits out at the full radius R, none closer in."}
  ]},

  {cls:"11", subject:"physics", chapter:"Rotational Motion", formulas:[
    {t:"Angular Velocity & Angular Acceleration", eq:"ω = " + frac("dθ","dt"),
     sym:[["ω","Angular velocity (rad/s)"],["θ","Angular displacement"]],
     cases:["Angular acceleration: α = dω/dt", "Relation to frequency/period: ω = 2πf = 2π/T"],
     tip:"Exactly the rotational analogues of velocity (v=dx/dt) and acceleration (a=dv/dt) — the whole rotational kinematics toolkit mirrors the linear one axis-for-axis."},
    {t:"Equations of Rotational Motion", eq:"ω = ω<sub>0</sub> + αt",
     sym:[["ω0","Initial angular velocity"],["α","Constant angular acceleration"]],
     cases:["θ = ω0t + ½αt²","ω² = ω0² + 2αθ"],
     tip:"Identical in structure to the three linear equations of motion — just swap x→θ, v→ω, a→α throughout."},
    {t:"Relation Between Linear and Angular Quantities", eq:"v = ωr",
     sym:[["r","Distance from the rotation axis"]],
     cases:["Tangential acceleration: at = αr", "Centripetal acceleration: ac = ω²r = v²/r"],
     tip:"v=ωr converts angular speed to the actual speed of a point at radius r — essential whenever a problem mixes rotational and translational quantities (like rolling)."},
    {t:"Torque", eq:"τ = r × F = Iα",
     sym:[["τ","Torque (N·m)"],["α","Angular acceleration"]], tip:"τ = Iα is the rotational analogue of F = ma — always identify the axis before computing I."},
    {t:"Angular Momentum", eq:"L = Iω = r × p",
     sym:[["L","Angular momentum (kg·m²/s)"],["ω","Angular velocity"]], tip:"L is conserved when net external torque is zero — classic setup: ice-skater pulling arms in, or a person on a rotating stool."},
    {t:"Conservation of Angular Momentum", eq:"I<sub>1</sub>ω<sub>1</sub> = I<sub>2</sub>ω<sub>2</sub>",
     sym:[], tip:"Applies only when net external torque is zero — I decreasing forces ω to increase, and vice versa."},
    {t:"Rotational Kinetic Energy", eq:"KE<sub>rot</sub> = " + frac("1","2") + "Iω²",
     sym:[],
     cases:["Rolling without slipping: v = Rω, and total KE = ½mv²(1 + k²/R²)"],
     tip:"For rolling without slipping, total KE = ½mv² + ½Iω² — don't forget the translational part."},
    {t:"Pure Rolling on an Inclined Plane", eq:"a = " + frac("g sinθ","1 + k²/R²"),
     sym:[["k","Radius of gyration"],["R","Radius of the rolling body"],["θ","Angle of inclination"]],
     cases:["Minimum friction required for pure rolling: μ ≥ tanθ / (1 + R²/k²)","Ring/hollow cylinder (k²/R²=1): a = g sinθ/2 — the slowest roller","Solid sphere (k²/R²=2/5): a = 5g sinθ/7 — the fastest roller"],
     tip:"Acceleration depends only on the SHAPE (through k²/R²), never on mass or radius — which is why a solid sphere always beats a ring down the same incline, regardless of their sizes."},
    {t:"Toppling vs Sliding Condition", eq:"Topples first if: " + frac("b","2h") + " &lt; μ",
     sym:[["b","Width of the base"],["h","Height at which force is applied (or of the centre of mass)"],["μ","Coefficient of friction"]], tip:"A tall, narrow block topples before it slides; a short, wide one slides before it topples — compare b/2h against μ to decide which happens first."},
    {t:"Equilibrium of a Rigid Body", eq:"ΣF = 0 &nbsp;(translational equilibrium)",
     sym:[],
     cases:["Στ = 0 (rotational equilibrium), about any point"],
     tip:"Both conditions must hold simultaneously for a rigid body to be in complete equilibrium — satisfying only one is not enough (a body can have zero net force but still spin up under a net torque)."}
  ]},

  {cls:"11", subject:"physics", chapter:"Gravitation", formulas:[
    {t:"Newton's Law of Gravitation", eq:"F = " + frac("Gm<sub>1</sub>m<sub>2</sub>","r²"),
     sym:[["G","Universal gravitational constant"],["r","Distance between the two masses"]],
     consts:["G = 6.674 × 10⁻¹¹ N·m²/kg²"],
     tip:"Always acts along the line joining the two masses and is always attractive."},
    {t:"Acceleration due to Gravity", eq:"g = " + frac("GM","R²"),
     sym:[["M","Mass of Earth"],["R","Radius of Earth"]],
     consts:["g ≈ 9.8 m/s² at Earth's surface"],
     tip:"g decreases both above the surface (height) and below it (depth), but by different formulas — don't mix them up."},
    {t:"Variation of g with Height & Depth", eq:"g<sub>h</sub> = g(1 − 2h/R) &nbsp; (h ≪ R)",
     sym:[["h","Height above surface"]],
     cases:["Below surface at depth d: g_d = g(1 − d/R)","At the centre (d = R): g = 0","Due to Earth's rotation at latitude λ: g' = g − ω²R cos²λ"],
     tip:"This is the approximate form for h ≪ R; use g(R/(R+h))² for the exact value at large heights."},
    {t:"Gravitational Field and Potential — Standard Bodies", eq:"Ring (on axis, distance x): E = " + frac("GMx","(R²+x²)<sup>3/2</sup>"),
     sym:[["E","Gravitational field intensity"],["V","Gravitational potential"]],
     cases:["Ring (on axis): V = −GM/√(R²+x²)","Solid sphere, outside (r≥R): E = GM/r², V = −GM/r","Solid sphere, inside (r<R): E = GMr/R³, V = −GM(3R²−r²)/2R³","Spherical shell, inside: E = 0, V = −GM/R (constant)"],
     tip:"Inside a spherical SHELL the field is exactly zero everywhere, but the potential is NOT zero — it stays constant at its surface value, which is a very common exam trap."},
    {t:"Self-Energy of a Sphere and Shell", eq:"Solid sphere: U = −" + frac("3GM²","5R"),
     sym:[["U","Self (binding) energy — work needed to assemble the body from infinitely dispersed matter"]],
     cases:["Hollow spherical shell: U = −GM²/2R"],
     tip:"The solid sphere's magnitude (3/5) exceeds the shell's (1/2) because its mass is packed closer together on average, making it more tightly bound."},
    {t:"Gravitational Potential Energy", eq:"U = −" + frac("GMm","r"),
     sym:[["U","PE with zero reference at infinity"]], tip:"Always negative — the system is bound; U → 0 only as r → ∞."},
    {t:"Orbital Velocity", eq:"v<sub>o</sub> = √(GM/r)",
     sym:[["r","Orbital radius from Earth's centre"]], tip:"Orbital velocity is independent of the satellite's own mass — only depends on M and r."},
    {t:"Escape Velocity", eq:"v<sub>e</sub> = √(2GM/R)",
     sym:[],
     cases:["From height h above surface: v_e = √(2GM/(R + h))"],
     tip:"v_e = √2 × v_o (orbital velocity at the surface) — a frequently tested ratio in JEE."},
    {t:"Time Period of a Satellite", eq:"T = 2π√(r³/GM)",
     sym:[],
     cases:["Geostationary orbit: T = 24 h, r ≈ 42,164 km"],
     tip:"Kepler's third law in disguise: T² ∝ r³ — same relation governs planetary orbits around the Sun."},
    {t:"Binding Energy of a Satellite", eq:"BE = " + frac("GMm","2r"),
     sym:[], tip:"Total mechanical energy of an orbiting satellite is −GMm/2r; binding energy is the magnitude needed to send it to infinity."},
    {t:"Kepler's Second Law (Law of Areas)", eq:"" + frac("dA","dt") + " = " + frac("L","2m") + " = constant",
     sym:[["dA/dt","Areal velocity"],["L","Angular momentum of the planet"]], tip:"A direct consequence of conservation of angular momentum — planets sweep out equal areas in equal times, moving fastest near the Sun."},
    {t:"Kepler's Third Law (Law of Periods)", eq:"" + frac("T²","r³") + " = " + frac("4π²","GM") + " = constant",
     sym:[["T","Orbital period"],["r","Semi-major axis (orbital radius)"]], tip:"Applies to every planet orbiting the same central body — the ratio T²/r³ is the same for all of them."},
    {t:"Binary (Two-Star) System", eq:"T = 2π√(" + frac("r³","G(m<sub>1</sub>+m<sub>2</sub>)") + ")",
     sym:[["r","Separation between the two stars"],["m1, m2","Their masses"]], tip:"Both stars orbit their common centre of mass with the SAME period T — their individual orbital radii are inversely proportional to their masses."}
  ]},

  {cls:"11", subject:"physics", chapter:"Mechanical Properties of Solids", formulas:[
    {t:"Stress", eq:"σ = F/A",
     sym:[["F","Restoring/applied force"],["A","Cross-sectional area"]], tip:"Units are the same as pressure (N/m² or Pa) since it's force per unit area."},
    {t:"Strain", eq:"ε = ΔL/L",
     sym:[["ΔL","Change in length"],["L","Original length"]], tip:"Strain is dimensionless — a pure ratio, so it carries no units."},
    {t:"Young's Modulus", eq:"Y = " + frac("FL","AΔL"),
     sym:[["Y","Young's modulus (Pa)"]], tip:"Measures stiffness under tension/compression — steel has a much higher Y than rubber."},
    {t:"Bulk Modulus", eq:"B = −V" + frac("ΔP","ΔV"),
     sym:[["ΔP","Change in pressure"],["ΔV","Change in volume"]], tip:"The negative sign keeps B positive, since volume decreases (ΔV < 0) when pressure increases."},
    {t:"Modulus of Rigidity", eq:"η = " + frac("F/A","θ"),
     sym:[["θ","Shear angle (radians)"]], tip:"Applies only to solids — fluids can't sustain shear stress at rest, so they have no rigidity modulus."},
    {t:"Poisson's Ratio", eq:"σ<sub>p</sub> = " + frac("Lateral strain","Longitudinal strain"),
     sym:[], tip:"For most materials σp lies between 0 and 0.5 — a value near 0.5 indicates near-incompressibility (like rubber)."},
    {t:"Elastic Potential Energy Density", eq:"u = " + frac("1","2") + " × stress × strain",
     sym:[["u","Elastic PE stored per unit volume"]],
     cases:["Total elastic PE = ½ × stress × strain × volume","Equivalently: u = ½Y(strain)² = (stress)²/2Y"],
     tip:"Exactly analogous to ½kx² for a spring — 'stress' plays the role of force and 'strain' the role of displacement."}
  ]},

  {cls:"11", subject:"physics", chapter:"Mechanical Properties of Fluids", formulas:[
    {t:"Pressure due to a Fluid Column", eq:"P = hρg",
     sym:[["h","Height/depth of column"],["ρ","Density of fluid"]], tip:"This is gauge pressure — add atmospheric pressure P₀ for the absolute pressure at that depth."},
    {t:"Pascal's Law (Hydraulic Lift)", eq:frac("F<sub>1</sub>","A<sub>1</sub>") + " = " + frac("F<sub>2</sub>","A<sub>2</sub>"),
     sym:[["F1, A1","Force and area at the small piston"],["F2, A2","Force and area at the large piston"]], tip:"Pressure transmits equally throughout — this is why a small input force can lift a huge load."},
    {t:"Archimedes' Principle (Buoyant Force)", eq:"F<sub>b</sub> = ρ<sub>fluid</sub>·V<sub>displaced</sub>·g",
     sym:[["V_displaced","Volume of fluid displaced by the body"]],
     cases:["Floating body: weight of body = weight of fluid displaced","Apparent weight when submerged = true weight − buoyant force"],
     tip:"A floating body displaces exactly its own WEIGHT in fluid; a fully submerged one displaces exactly its own VOLUME — keeping these distinct is key to float-vs-sink problems."},
    {t:"Equation of Continuity", eq:"A<sub>1</sub>v<sub>1</sub> = A<sub>2</sub>v<sub>2</sub>",
     sym:[["A","Cross-sectional area"],["v","Fluid speed"]], tip:"Conservation of mass for incompressible flow — narrower sections mean faster flow."},
    {t:"Bernoulli's Theorem", eq:"P + " + frac("1","2") + "ρv² + ρgh = constant",
     sym:[], tip:"Energy conservation for flowing fluids — where speed is high, pressure is low, and vice versa."},
    {t:"Torricelli's Law (Efflux Speed)", eq:"v = √(2gh)",
     sym:[["h","Depth of the orifice below the liquid's free surface"]], tip:"Identical to the speed of a body freely falling through height h — a direct special case of Bernoulli's theorem."},
    {t:"Stokes' Law", eq:"F = 6πηrv",
     sym:[["η","Coefficient of viscosity"],["r","Radius of the sphere"]], tip:"Gives the viscous drag on a small sphere moving through a fluid — the basis for terminal velocity."},
    {t:"Terminal Velocity", eq:"v<sub>t</sub> = " + frac("2r²(ρ − σ)g","9η"),
     sym:[["ρ","Density of the sphere"],["σ","Density of the fluid"]], tip:"Reached when viscous drag balances the net downward force — velocity becomes constant beyond this point."},
    {t:"Poiseuille's Formula (Volume Flow Rate)", eq:"Q = " + frac("πPr⁴","8ηl"),
     sym:[["Q","Volume of liquid flowing per second"],["P","Pressure difference across the tube"],["r","Radius of the tube"],["l","Length of the tube"]], tip:"Flow rate depends on the FOURTH power of radius — halving a pipe's radius cuts the flow to just 1/16th, which is why small arterial narrowing matters so much medically."},
    {t:"Reynolds Number (Critical Velocity)", eq:"R<sub>e</sub> = " + frac("ρvD","η"),
     sym:[["D","Diameter of the tube"]],
     cases:["Re < 2000: streamlined (laminar) flow","Re > 3000: turbulent flow"],
     tip:"A dimensionless number — it's the ratio of inertial forces to viscous forces, which is why it alone predicts the flow regime regardless of the specific fluid."},
    {t:"Surface Energy and Excess Pressure", eq:"Surface energy = T × ΔA",
     sym:[["T","Surface tension"],["ΔA","Increase in surface area"]],
     cases:["Liquid drop (one surface): ΔP = 2T/r","Soap bubble (two surfaces): ΔP = 4T/r","Air bubble inside a liquid (one surface): ΔP = 2T/r"],
     tip:"Count the number of liquid–air surfaces to get the factor right — a soap bubble has two films, so it doubles; an air bubble submerged in liquid has only one."},
    {t:"Capillary Rise (Ascent Formula)", eq:"h = " + frac("2T cosθ","rρg"),
     sym:[["θ","Angle of contact"],["r","Radius of the capillary tube"]],
     cases:["For water in glass, θ≈0°, so h ≈ 2T/rρg","If θ > 90° (e.g. mercury in glass), cosθ is negative and the liquid is DEPRESSED instead of rising"],
     tip:"Rise is inversely proportional to tube radius — narrower tubes lift liquid noticeably higher, which is exactly what makes the effect visible in fine capillaries."}
  ]},

  {cls:"11", subject:"physics", chapter:"Thermal Properties of Matter", formulas:[
    {t:"Linear Thermal Expansion", eq:"L = L<sub>0</sub>(1 + αΔT)",
     sym:[["α","Coefficient of linear expansion"],["ΔT","Change in temperature"]],
     cases:["Area expansion: A = A0(1 + βΔT), β ≈ 2α","Volume expansion: V = V0(1 + γΔT), γ ≈ 3α"],
     tip:"Area expansion coefficient ≈ 2α and volume expansion coefficient ≈ 3α for isotropic solids."},
    {t:"Specific Heat Capacity", eq:"Q = mcΔT",
     sym:[["c","Specific heat capacity"]], tip:"Heat required per unit mass per degree rise — water's unusually high c is why it resists temperature change."},
    {t:"Principle of Calorimetry", eq:"Heat lost = Heat gained",
     sym:[],
     cases:["m1c1(T1 − T) = m2c2(T − T2), T = final equilibrium temperature"],
     tip:"Assumes no heat is exchanged with the surroundings — always check the problem specifies an insulated/ideal calorimeter before applying this directly."},
    {t:"Latent Heat", eq:"Q = mL",
     sym:[["L","Latent heat of fusion or vaporisation"]], tip:"Temperature stays constant during a phase change — all the heat goes into breaking/forming bonds, not raising T."},
    {t:"Stefan–Boltzmann Law", eq:"E = σT⁴",
     sym:[["E","Power radiated per unit area"]],
     consts:["σ = 5.67 × 10⁻⁸ W/m²K⁴"],
     tip:"Radiated power depends on the FOURTH power of absolute temperature — small T changes cause huge changes in E."},
    {t:"Wien's Displacement Law", eq:"λ<sub>m</sub>T = b",
     sym:[["λ_m","Wavelength of peak emission"]],
     consts:["b = 2.898 × 10⁻³ m·K"],
     tip:"Hotter objects emit peak radiation at shorter wavelengths — this is why very hot stars appear blue, cooler ones red."},
    {t:"Newton's Law of Cooling", eq:"" + frac("dT","dt") + " = −k(T − T<sub>s</sub>)",
     sym:[["T_s","Surrounding temperature"]], tip:"Only valid for small temperature differences with the surroundings — a common approximation, not exact physics."},
    {t:"Rate of Heat Conduction", eq:"" + frac("dQ","dt") + " = " + frac("kAΔT","L"),
     sym:[["k","Thermal conductivity"],["A","Cross-sectional area"],["L","Length/thickness of the conductor"]], tip:"For conductors in series, the same dQ/dt flows through each — use this to find the junction temperature between two different materials."}
  ]},

  {cls:"11", subject:"physics", chapter:"Thermodynamics", formulas:[
    {t:"First Law of Thermodynamics", eq:"ΔQ = ΔU + ΔW",
     sym:[["ΔQ","Heat supplied to the gas"],["ΔU","Change in internal energy"],["ΔW","Work done BY the gas"]], tip:"Physics uses the 'work done by the gas' convention — double-check which convention a question follows before substituting."},
    {t:"Work Done — Isothermal Process", eq:"W = nRT ln" + frac("V<sub>2</sub>","V<sub>1</sub>"),
     sym:[["n","Moles of gas"],["T","Constant temperature"]], tip:"Internal energy doesn't change in an isothermal process (ΔU = 0) — all supplied heat converts entirely to work."},
    {t:"Work Done — Adiabatic Process", eq:frac("P<sub>1</sub>V<sub>1</sub> − P<sub>2</sub>V<sub>2</sub>","γ − 1"),
     sym:[["γ","Ratio of specific heats, Cp/Cv"]],
     cases:["Adiabatic relations: PVᵞ = constant, TV^(γ−1) = constant, P^(1−γ)Tᵞ = constant"],
     tip:"No heat exchange occurs (ΔQ = 0) — all work done comes at the expense of internal energy."},
    {t:"Polytropic Process — Specific Heat", eq:"C = C<sub>v</sub> + " + frac("R","1 − n"),
     sym:[["n","Polytropic index, from PVⁿ = constant"]],
     cases:["n=0 (isobaric): C = Cp","n=1 (isothermal): C = ∞","n=γ (adiabatic): C = 0"],
     tip:"A single formula covering every standard process — check it against the special cases to confirm you've identified n correctly."},
    {t:"Carnot Engine Efficiency", eq:"η = 1 − " + frac("T<sub>2</sub>","T<sub>1</sub>"),
     sym:[["T1","Source (hot reservoir) temperature"],["T2","Sink (cold reservoir) temperature"]], tip:"Temperatures must be in Kelvin — this is the maximum possible efficiency for any engine operating between T1 and T2."},
    {t:"Coefficient of Performance", eq:"COP = " + frac("T<sub>2</sub>","T<sub>1</sub> − T<sub>2</sub>"),
     sym:[], tip:"For a refrigerator, COP can exceed 1 — unlike engine efficiency, which is always less than 1."},
    {t:"Mayer's Relation", eq:"C<sub>p</sub> − C<sub>v</sub> = R",
     sym:[["Cp, Cv","Molar specific heats at constant P and V"]], tip:"Cp is always greater than Cv — extra heat is needed at constant pressure to also do expansion work."}
  ]},

  {cls:"11", subject:"physics", chapter:"Kinetic Theory of Gases", formulas:[
    {t:"Pressure of an Ideal Gas", eq:"P = " + frac("1","3") + "ρ⟨v²⟩",
     sym:[["ρ","Density of the gas"],["⟨v²⟩","Mean square speed"]], tip:"Derived purely from momentum transfer of molecules on the container walls — no assumption of temperature needed."},
    {t:"Average KE per Molecule", eq:"KE = " + frac("3","2") + "k<sub>B</sub>T",
     sym:[["k_B","Boltzmann constant"]],
     consts:["k_B = 1.38 × 10⁻²³ J/K"],
     tip:"Depends only on absolute temperature — not on the gas's molar mass or pressure."},
    {t:"RMS Speed of Gas Molecules", eq:"v<sub>rms</sub> = √(3RT/M)",
     sym:[["M","Molar mass"]],
     cases:["Average speed: v_avg = √(8RT/πM)","Most probable speed: v_mp = √(2RT/M)","Ratio: v_rms : v_avg : v_mp = 1.73 : 1.60 : 1.41"],
     tip:"Speed order is always v_rms > v_avg > v_mp for the same gas at the same temperature."},
    {t:"Specific Heat of a Gas Mixture", eq:"C<sub>v(mix)</sub> = " + frac("n<sub>1</sub>C<sub>v1</sub> + n<sub>2</sub>C<sub>v2</sub>","n<sub>1</sub> + n<sub>2</sub>"),
     sym:[["n1, n2","Moles of each gas in the mixture"]],
     cases:["γ_mix = Cp(mix)/Cv(mix), where Cp(mix) is found the same mole-weighted way"],
     tip:"Always mole-weight the specific heats FIRST, then take the ratio for γ_mix — averaging the individual γ values directly gives the wrong answer."},
    {t:"Molar Specific Heats & Degrees of Freedom", eq:"C<sub>v</sub> = " + frac("f","2") + "R &nbsp;&nbsp; C<sub>p</sub> = (" + frac("f","2") + " + 1)R",
     sym:[["f","Degrees of freedom (3 monatomic, 5 diatomic)"]], tip:"For diatomic gases at moderate temperature, f = 5 (3 translational + 2 rotational) — vibrational modes activate only at high T."},
    {t:"Mean Free Path", eq:"λ = " + frac("1","√2 π d² n"),
     sym:[["d","Molecular diameter"],["n","Number density of molecules"]], tip:"Average distance a molecule travels between successive collisions — inversely related to both size and density of molecules."},
    {t:"Equation of State of an Ideal Gas", eq:"PV = nRT",
     sym:[["P","Pressure"],["V","Volume"],["n","Moles"],["R","Universal gas constant"]], tip:"The kinetic theory result P = ⅓ρ⟨v²⟩ combines with this equation of state to derive the RMS speed formula."}
  ]},

  {cls:"11", subject:"physics", chapter:"Oscillations", formulas:[
    {t:"Displacement in SHM", eq:"x = A sin(ωt + φ)",
     sym:[["A","Amplitude"],["ω","Angular frequency"],["φ","Initial phase"]], tip:"φ is fixed by initial conditions (position and velocity at t = 0) — always identify it before writing the full equation."},
    {t:"Time Period — Spring–Mass System", eq:"T = 2π√(m/k)",
     sym:[["k","Spring constant"]], tip:"Independent of amplitude and independent of g — works the same on Earth or the Moon."},
    {t:"Time Period — Simple Pendulum", eq:"T = 2π√(L/g)",
     sym:[["L","Length of pendulum"]], tip:"Valid only for small angular amplitude (θ < ~10°) where sinθ ≈ θ."},
    {t:"Velocity in SHM", eq:"v = ω√(A² − x²)",
     sym:[], tip:"Velocity is maximum (= ωA) at the mean position and zero at the extremes."},
    {t:"Acceleration in SHM", eq:"a = −ω²x",
     sym:[], tip:"Always directed toward the mean position — this restoring-force pattern is the defining feature of SHM."},
    {t:"Total Energy in SHM", eq:"E = " + frac("1","2") + "mω²A²",
     sym:[],
     cases:["Kinetic energy at displacement x: KE = ½mω²(A²−x²)","Potential energy at displacement x: PE = ½mω²x²"],
     tip:"Total mechanical energy stays constant throughout the motion — it just keeps converting between KE and PE."},
    {t:"Compound (Physical) Pendulum", eq:"T = 2π√(" + frac("I","mgd") + ")",
     sym:[["I","Moment of inertia about the pivot"],["d","Distance from pivot to centre of mass"]], tip:"Reduces to the simple pendulum formula when all the mass is concentrated at distance L from the pivot (I=mL², d=L)."},
    {t:"Torsional Pendulum", eq:"T = 2π√(" + frac("I","C") + ")",
     sym:[["I","Moment of inertia of the suspended body"],["C","Torsional constant of the wire"]], tip:"The rotational analogue of a spring-mass system — C plays exactly the role that the spring constant k does."}
  ]},

  {cls:"11", subject:"physics", chapter:"Waves", formulas:[
    {t:"Displacement Relation for a Progressive Wave", eq:"y(x,t) = A sin(ωt − kx)",
     sym:[["A","Amplitude"],["ω","Angular frequency"],["k","Wave number, k = 2π/λ"]], tip:"The minus sign describes a wave travelling in the +x direction; use a plus sign for a wave travelling in −x."},
    {t:"Wave Speed", eq:"v = fλ",
     sym:[["f","Frequency"],["λ","Wavelength"]], tip:"Frequency is set by the source and stays constant; wavelength changes if wave speed changes between media."},
    {t:"Speed of a Transverse Wave on a String", eq:"v = √(T/μ)",
     sym:[["T","Tension in the string"],["μ","Linear mass density"]], tip:"Higher tension gives faster waves; a heavier (denser) string slows them down."},
    {t:"Speed of Sound (Newton–Laplace)", eq:"v = √(γP/ρ)",
     sym:[["γ","Ratio of specific heats"]], tip:"Laplace's correction (using γP instead of just P) accounts for the adiabatic nature of sound propagation."},
    {t:"Beat Frequency", eq:"Δf = |f<sub>1</sub> − f<sub>2</sub>|",
     sym:[], tip:"Beats arise from superposition of two close frequencies — used practically to tune musical instruments."},
    {t:"Doppler Effect (source approaching observer)", eq:"f′ = f" + frac("v","v − v<sub>s</sub>"),
     sym:[["v","Speed of sound"],["vs","Speed of the source"]],
     cases:["General formula: f′ = f(v ± vo)/(v ∓ vs)","Observer moving toward source: use +vo; away: use −vo","Source moving toward observer: use −vs; away: use +vs"],
     tip:"Sign of vs flips depending on whether the source approaches (denominator decreases → f′ increases) or recedes."},
    {t:"Intensity of a Wave", eq:"I = " + frac("1","2") + "ρω²A²v",
     sym:[["ρ","Density of the medium"],["A","Amplitude"],["v","Wave speed"]], tip:"Intensity goes as the SQUARE of amplitude — doubling the amplitude quadruples the energy carried per second."},
    {t:"Standing Waves on a String (both ends fixed)", eq:"f<sub>n</sub> = " + frac("nv","2L"),
     sym:[["n","Harmonic number (1, 2, 3…)"],["L","Length of string"]], tip:"Only certain discrete frequencies (harmonics) are allowed — set by the boundary condition of fixed ends."},
    {t:"Organ Pipes — Resonant Frequencies", eq:"Open pipe: f<sub>n</sub> = " + frac("nv","2L"),
     sym:[["L","Length of the air column"]],
     cases:["Closed pipe (one end closed): f_n = (2n − 1)v/4L — only odd harmonics","End correction: e = 0.6R per open end (R = pipe radius); effective length L_eff = L + e (closed pipe) or L + 2e (open pipe)"],
     tip:"A closed pipe skips every even harmonic — this is why closed and open pipes of the same length sound so different (different timbre)."}
  ]},

  /* =========================================================
     CLASS 11 :: CHEMISTRY  (8 chapters)
     ========================================================= */
  {cls:"11", subject:"chemistry", chapter:"Basic Concepts of Chemistry", formulas:[
    {t:"Number of Moles", eq:"n = " + frac("Given mass (w)","Molar mass (M)"),
     sym:[["n","Number of moles"],["w","Mass of substance in grams"],["M","Molar mass (g/mol)"]], tip:"For gases, n also equals V/22.4 at STP or PV/RT under any conditions — pick whichever the question gives you."},
    {t:"Molarity", eq:"M = " + frac("Moles of solute","Volume of solution (L)"),
     sym:[["M","Molarity (mol/L)"]], tip:"Molarity is temperature-dependent since it uses volume, unlike molality which uses mass."},
    {t:"Molality", eq:"m = " + frac("Moles of solute","Mass of solvent (kg)"),
     sym:[["m","Molality (mol/kg)"]], tip:"Preferred over molarity for colligative property problems precisely because it's temperature-independent."},
    {t:"Mole Fraction", eq:"x<sub>1</sub> = " + frac("n<sub>1</sub>","n<sub>1</sub> + n<sub>2</sub>"),
     sym:[["n1, n2","Moles of components 1 and 2"]], tip:"Sum of mole fractions of all components in a mixture is always exactly 1."},
    {t:"Percentage Composition", eq:"%element = " + frac("Mass of element in compound","Molar mass") + " × 100",
     sym:[], tip:"Sum of percentage composition of all elements in a compound always adds up to 100%."},
    {t:"Empirical to Molecular Formula", eq:"n = " + frac("Molecular mass","Empirical formula mass"),
     sym:[["n","Whole-number multiplier"]], tip:"Molecular formula = n × (empirical formula) — n must always come out to a whole number; round only if experimental error explains a small deviation."},
    {t:"Normality", eq:"N = M × n<sub>f</sub>",
     sym:[["M","Molarity"],["nf","n-factor (valency factor)"]],
     cases:["Normality = equivalents of solute per litre of solution","Titration: N1V1 = N2V2"],
     tip:"Normality is reaction-dependent — the SAME solution can have different N values in different reactions, because nf changes."},
    {t:"Average Atomic Mass", eq:"M<sub>avg</sub> = " + frac("Σ(isotopic mass × % abundance)","100"),
     sym:[], tip:"This is why periodic-table atomic masses are rarely whole numbers — chlorine's 35.5 comes from roughly a 3:1 mix of Cl-35 and Cl-37."},
    {t:"Vapour Density", eq:"V.D. = " + frac("Molar mass","2"),
     sym:[["V.D.","Vapour density, relative to hydrogen"]],
     cases:["Molar mass = 2 × V.D."],
     tip:"Defined relative to H2 (molar mass 2), which is exactly where the factor of 2 comes from."},
    {t:"Volumetric Strength of H₂O₂", eq:"Volume strength = 11.2 × Molarity",
     sym:[],
     cases:["Also: Volume strength = 5.6 × Normality","10 V solution ≈ 3.03% (w/v) ≈ 0.89 M"],
     tip:"'10 volume' means 1 litre of the solution releases 10 litres of O2 gas at STP on complete decomposition."},
    {t:"Oleum Labelling (% Labelling)", eq:"% labelling = " + frac("Mass of H<sub>2</sub>SO<sub>4</sub> obtained","Mass of oleum taken") + " × 100",
     sym:[], tip:"Always exceeds 100% (e.g. '109% oleum') because added water is absorbed by free SO3, producing more H2SO4 than the original oleum mass."}
  ]},

  {cls:"11", subject:"chemistry", chapter:"Structure of Atom", formulas:[
    {t:"Energy of a Photon", eq:"E = hν = " + frac("hc","λ"),
     sym:[["h","Planck's constant"],["ν","Frequency"],["λ","Wavelength"]],
     consts:["h = 6.626 × 10⁻³⁴ J·s", "c = 3 × 10⁸ m/s"],
     tip:"Higher frequency (shorter wavelength) light carries more energy per photon — the basis of the photoelectric effect."},
    {t:"Bohr's Angular Momentum Postulate", eq:"mvr = " + frac("nh","2π"),
     sym:[["n","Principal quantum number"]], tip:"This quantisation condition is what restricts electrons to only certain allowed orbits in Bohr's model."},
    {t:"Bohr Radius", eq:"r<sub>n</sub> = 0.529 × " + frac("n²","Z") + " Å",
     sym:[["n","Principal quantum number"],["Z","Atomic number"]],
     cases:["Velocity of electron: vn = 2.18×10⁶ (Z/n) m/s"],
     tip:"Radius grows as n² — the reason outer shells are so much larger than inner ones."},
    {t:"Energy of Electron (Bohr Model)", eq:"E<sub>n</sub> = −13.6 × " + frac("Z²","n²") + " eV",
     sym:[], tip:"Negative sign shows the electron is bound; ionisation energy = |E_n| needed to remove it to n = ∞."},
    {t:"de Broglie Wavelength", eq:"λ = h/mv = h/p",
     sym:[["p","Momentum of particle"]],
     cases:["Electron accelerated through potential V: λ = h/√(2meV) = 12.27/√V Å"],
     tip:"Applies to all matter, not just electrons — the wave nature becomes significant only at very small mass or momentum."},
    {t:"Heisenberg Uncertainty Principle", eq:"Δx·Δp ≥ h/4π",
     sym:[["Δx","Uncertainty in position"],["Δp","Uncertainty in momentum"]], tip:"Explains why Bohr's fixed circular orbits are conceptually flawed — you can't know both position and momentum exactly."},
    {t:"Rydberg Formula", eq:"1/λ = RZ²(" + frac("1","n<sub>1</sub>²") + " − " + frac("1","n<sub>2</sub>²") + ")",
     sym:[["R","Rydberg constant"],["n1, n2","Lower and higher energy levels (n2 > n1)"]],
     consts:["R = 1.097 × 10⁷ m⁻¹"],
     cases:["Lyman series: n1 = 1 (UV region)","Balmer series: n1 = 2 (visible region)","Paschen series: n1 = 3 (IR region)"],
     tip:"Set n1 = 1, 2, 3 for Lyman, Balmer, Paschen series respectively — a high-frequency JEE ask."},
    {t:"Quantum Number Rules", eq:"Azimuthal (l): 0 to (n − 1)",
     sym:[["n","Principal quantum number"]],
     cases:["Magnetic (m): −l to +l (including 0)","Spin (s): +½ or −½ only", "Max electrons in a shell: 2n²","Max electrons in a subshell: 2(2l+1)"],
     tip:"l tells you the subshell (0=s, 1=p, 2=d, 3=f); for a given l there are exactly (2l+1) values of m, i.e. (2l+1) orbitals in that subshell."},
    {t:"Number of Nodes in an Orbital", eq:"Radial (spherical) nodes = n − l − 1",
     sym:[["n","Principal quantum number"],["l","Azimuthal quantum number"]],
     cases:["Angular (planar) nodes = l","Total nodes = n − 1"],
     tip:"A 3p orbital (n=3, l=1) has 1 radial node and 1 angular node, totalling 2 — always check your two components sum to (n−1)."},
    {t:"Series Limit of a Spectral Series", eq:"" + frac("1","λ") + " = RZ²(" + frac("1","n<sub>1</sub>²") + ")",
     sym:[["n1","Lower level of the series"]],
     cases:["Series limit corresponds to the n2 → ∞ transition (shortest wavelength of that series)","Lyman n1=1, Balmer n1=2, Paschen n1=3, Brackett n1=4, Pfund n1=5"],
     tip:"The series limit is the highest-energy (shortest-wavelength) line of a series — it marks the ionisation edge from that level."}
  ]},

  {cls:"11", subject:"chemistry", chapter:"Chemical Bonding", formulas:[
    {t:"Formal Charge", eq:"FC = V − N − " + frac("B","2"),
     sym:[["V","Valence electrons of free atom"],["N","Non-bonding electrons"],["B","Bonding electrons (shared)"]], tip:"The structure with formal charges closest to zero (and negative charge on the more electronegative atom) is usually the most stable Lewis structure."},
    {t:"Bond Order (Molecular Orbital Theory)", eq:"B.O. = " + frac("N<sub>b</sub> − N<sub>a</sub>","2"),
     sym:[["N_b","Electrons in bonding MOs"],["N_a","Electrons in antibonding MOs"]], tip:"Higher bond order means shorter, stronger bonds — B.O. = 0 predicts the molecule doesn't exist (e.g. He₂)."},
    {t:"Dipole Moment", eq:"μ = q × d",
     sym:[["q","Magnitude of charge separated"],["d","Distance between charge centres"]], tip:"Measured in Debye (D); a symmetric molecule can have polar bonds yet zero net dipole moment (e.g. CO₂) due to vector cancellation."},
    {t:"Percentage Ionic Character", eq:"%ionic = " + frac("μ<sub>observed</sub>","μ<sub>calculated (100% ionic)</sub>") + " × 100",
     sym:[], tip:"No real bond is 100% ionic or 100% covalent — this formula quantifies where a bond actually sits on that spectrum."},
    {t:"Hybridization & VSEPR Bond Angles", eq:"sp: 180° (linear)",
     sym:[],
     cases:["sp²: 120° (trigonal planar)","sp³: 109.5° (tetrahedral)","sp³d: trigonal bipyramidal (90° & 120°)","sp³d²: 90° (octahedral)"],
     tip:"Lone pairs compress bond angles below the ideal value (e.g. NH3's sp³ angle is ~107°, not 109.5°) — lone-pair/lone-pair repulsion is stronger than lone-pair/bond-pair."}
  ]},

  {cls:"11", subject:"chemistry", chapter:"States of Matter", formulas:[
    {t:"Ideal Gas Equation", eq:"PV = nRT",
     sym:[["P","Pressure"],["V","Volume"],["R","Gas constant"]],
     consts:["R = 0.0821 L·atm/mol·K = 8.314 J/mol·K"],
     cases:["At STP (0°C, 1 atm): 1 mole occupies 22.4 L"],
     tip:"Use R = 8.314 J/mol·K in SI units, or 0.0821 L·atm/mol·K when pressure is in atm and volume in litres."},
    {t:"Combined Gas Law", eq:frac("P<sub>1</sub>V<sub>1</sub>","T<sub>1</sub>") + " = " + frac("P<sub>2</sub>V<sub>2</sub>","T<sub>2</sub>"),
     sym:[], tip:"Use for any two-state gas problem where moles are constant — no need to know n or R at all."},
    {t:"Dalton's Law of Partial Pressures", eq:"P<sub>total</sub> = P<sub>1</sub> + P<sub>2</sub> + ⋯",
     sym:[], tip:"Each gas in a mixture behaves as if it alone occupied the container — partial pressure Pi = xi × Ptotal."},
    {t:"Van der Waals Equation", eq:"(P + " + frac("an²","V²") + ")(V − nb) = nRT",
     sym:[["a","Measure of intermolecular attraction"],["b","Excluded volume per mole"]], tip:"'a' corrects for real attractive forces (lowers effective pressure); 'b' corrects for finite molecular size."},
    {t:"Compressibility Factor", eq:"Z = " + frac("PV","nRT"),
     sym:[["Z","Compressibility factor"]],
     cases:["Z = 1: ideal gas behaviour","Z < 1: attractive forces dominate (gas more compressible than ideal)","Z > 1: repulsive forces / molecular size dominates (less compressible than ideal)"],
     tip:"Z measures how far a real gas deviates from ideality — it approaches 1 for all gases at low pressure and high temperature."},
    {t:"Critical Constants (van der Waals)", eq:"V<sub>c</sub> = 3b, &nbsp; P<sub>c</sub> = " + frac("a","27b²") + ", &nbsp; T<sub>c</sub> = " + frac("8a","27Rb"),
     sym:[["Tc","Critical temperature — above this, a gas cannot be liquefied by pressure alone"]],
     cases:["Critical compressibility: Zc = PcVc/RTc = 3/8 = 0.375 for any van der Waals gas"],
     tip:"These come from the fact that the critical point is a point of inflection on the P-V isotherm, where both dP/dV and d²P/dV² vanish."},
    {t:"Boyle and Inversion Temperatures", eq:"T<sub>b</sub> = " + frac("a","Rb"),
     sym:[["Tb","Boyle temperature — the temperature at which a real gas behaves ideally over a wide pressure range"]],
     cases:["Inversion temperature: Ti = 2a/Rb = 2Tb","Below Ti a gas cools on Joule-Thomson expansion; above it, the gas warms instead"],
     tip:"The inversion temperature is exactly twice the Boyle temperature — and it's why hydrogen and helium must be pre-cooled before they can be liquefied by throttling."},
    {t:"Graham's Law of Diffusion", eq:frac("r<sub>1</sub>","r<sub>2</sub>") + " = √(" + frac("M<sub>2</sub>","M<sub>1</sub>") + ")",
     sym:[["r","Rate of diffusion/effusion"],["M","Molar mass"]], tip:"Lighter gases diffuse faster — the ratio depends on inverse square root of molar mass, not mass itself."},
    {t:"RMS Speed of Gas Molecules", eq:"v<sub>rms</sub> = √(3RT/M)",
     sym:[["T","Absolute temperature"]], tip:"Speed order is always v_rms > v_avg > v_mp for the same gas at the same temperature."}
  ]},

  {cls:"11", subject:"chemistry", chapter:"Thermodynamics", formulas:[
    {t:"First Law of Thermodynamics", eq:"ΔU = q + w",
     sym:[["ΔU","Change in internal energy"],["q","Heat absorbed by system"],["w","Work done ON the system"]], tip:"JEE uses the q + w (IUPAC) convention — double check which sign convention a question is using before substituting."},
    {t:"Enthalpy", eq:"H = U + PV",
     sym:[["H","Enthalpy"]], tip:"At constant pressure, ΔH = q_p — this is why enthalpy is the natural variable for most lab reactions (open to atmosphere)."},
    {t:"Enthalpy–Internal Energy Relation", eq:"ΔH = ΔU + Δn<sub>g</sub>RT",
     sym:[["Δn_g","Change in moles of gas (products − reactants)"]], tip:"Δn_g uses only gaseous species — ignore solids and liquids entirely when counting moles."},
    {t:"Hess's Law", eq:"ΔH°<sub>rxn</sub> = ΣΔH°<sub>f</sub>(products) − ΣΔH°<sub>f</sub>(reactants)",
     sym:[["ΔH°_f","Standard enthalpy of formation"]], tip:"Enthalpy is a state function — total ΔH is path-independent, so you can add/subtract known reaction enthalpies freely."},
    {t:"Gibbs Free Energy", eq:"ΔG = ΔH − TΔS",
     sym:[["ΔS","Change in entropy"]], tip:"ΔG < 0 means spontaneous. Combine signs of ΔH and ΔS to predict spontaneity across temperature ranges — a classic JEE table question."},
    {t:"Entropy Change", eq:"ΔS = " + frac("q<sub>rev</sub>","T"),
     sym:[],
     cases:["General (T and V both changing): ΔS = nCv ln(T2/T1) + nR ln(V2/V1)","Isothermal expansion: ΔS = nR ln(V2/V1)","Phase change: ΔS = ΔH(transition)/T(transition)"],
     tip:"Only valid for a reversible process — for irreversible processes, ΔS_universe > q/T strictly."},
    {t:"Relation Between ΔG° and Equilibrium Constant", eq:"ΔG° = −RT ln K = −2.303RT log K",
     sym:[["K","Thermodynamic equilibrium constant"]],
     cases:["ΔG° < 0 ⇒ K > 1 (products favoured)","ΔG° = 0 ⇒ K = 1","ΔG° > 0 ⇒ K < 1 (reactants favoured)"],
     tip:"Note this uses ΔG° (standard state), not ΔG — at actual equilibrium ΔG itself is always exactly zero."},
    {t:"Kirchhoff's Equation (ΔH at Different Temperatures)", eq:"ΔH<sub>2</sub> − ΔH<sub>1</sub> = ΔC<sub>p</sub>(T<sub>2</sub> − T<sub>1</sub>)",
     sym:[["ΔCp","Cp(products) − Cp(reactants)"]], tip:"Lets you convert a tabulated enthalpy at 298 K to the value at any other temperature — essential for industrial-process calculations."},
    {t:"Born–Haber Cycle (Lattice Enthalpy)", eq:"ΔH<sub>f</sub> = ΔH<sub>sub</sub> + IE + " + frac("1","2") + "BE + EA + U<sub>lattice</sub>",
     sym:[["IE","Ionisation enthalpy"],["EA","Electron gain enthalpy"],["U","Lattice enthalpy"]], tip:"A direct application of Hess's Law to ionic-compound formation — it's the standard indirect route to lattice enthalpy, which can't be measured directly."}
  ]},

  {cls:"11", subject:"chemistry", chapter:"Equilibrium", formulas:[
    {t:"Henry's Law", eq:"p = K<sub>H</sub>·x",
     sym:[["p","Partial pressure of the gas above the solution"],["KH","Henry's law constant"],["x","Mole fraction of gas dissolved"]], tip:"Higher KH means lower solubility for a given pressure — used to explain why dissolved O2/CO2 in blood/soda behave the way they do under pressure changes."},
    {t:"Relation between Kp and Kc", eq:"K<sub>p</sub> = K<sub>c</sub>(RT)<sup>Δn</sup>",
     sym:[["Δn","Moles of gaseous product − gaseous reactant"]], tip:"If Δn = 0, Kp = Kc exactly — a quick sanity check for reactions with equal moles on both sides."},
    {t:"Ostwald's Dilution Law", eq:"K<sub>a</sub> = " + frac("Cα²","1 − α") + " ≈ Cα² &nbsp;(for α ≪ 1)",
     sym:[["C","Initial concentration"],["α","Degree of dissociation"]], tip:"For weak acids/bases, dilution increases α even though Ka stays constant — this formula links the two."},
    {t:"pH of a Solution", eq:"pH = −log[H<sup>+</sup>]",
     sym:[["[H+]","Molar concentration of H⁺ ions"]], tip:"Each unit change in pH means a 10× change in [H⁺] — always keep this logarithmic scale in mind for mixing problems."},
    {t:"pH – pOH Relation", eq:"pH + pOH = 14 &nbsp; (at 25°C)",
     sym:[], tip:"This constant (pKw = 14) only holds at 25°C — it changes with temperature since Kw itself is temperature dependent."},
    {t:"Henderson–Hasselbalch Equation", eq:"pH = pK<sub>a</sub> + log(" + frac("[Salt]","[Acid]") + ")",
     sym:[["pKa","−log(Ka) of the weak acid"]], tip:"Buffer capacity is maximum when [salt] = [acid], i.e. when pH = pKa exactly."},
    {t:"Solubility Product", eq:"K<sub>sp</sub> = [A<sup>+</sup>]<sup>m</sup>[B<sup>−</sup>]<sup>n</sup>",
     sym:[["A_mB_n","Sparingly soluble salt, A_mB_n ⇌ mA⁺ + nB⁻"]],
     cases:["For AB type (e.g. AgCl): Ksp = s²","For AB2 or A2B type: Ksp = 4s³","For AB3 type: Ksp = 27s⁴"],
     tip:"If ionic product > Ksp, precipitation occurs; if less, more solid dissolves — the common ion effect works by pushing the ionic product above Ksp."},
    {t:"pH of Salt Hydrolysis", eq:"Weak acid + strong base: pH = 7 + " + frac("1","2") + "(pK<sub>a</sub> + log C)",
     sym:[["C","Concentration of the salt"]],
     cases:["Strong acid + weak base: pH = 7 − ½(pKb + log C)","Weak acid + weak base: pH = 7 + ½(pKa − pKb) — independent of concentration"],
     tip:"The weak-acid/weak-base case is the only one where pH doesn't depend on concentration at all — a frequently tested distinguishing feature."},
    {t:"Buffer Capacity", eq:"β = " + frac("moles of acid or base added","change in pH"),
     sym:[["β","Buffer capacity"]], tip:"Maximum when [salt] = [acid], i.e. when pH = pKa — this is why buffers are always chosen with a pKa close to the target pH."},
    {t:"Degree of Dissociation from Vapour Density", eq:"α = " + frac("D − d","d(n − 1)"),
     sym:[["D","Theoretical (normal) vapour density"],["d","Observed vapour density"],["n","Number of particles produced per molecule dissociating"]], tip:"Dissociation increases the number of particles, which lowers the observed vapour density below the theoretical value — this formula quantifies by how much."}
  ]},

  {cls:"11", subject:"chemistry", chapter:"Redox Reactions", formulas:[
    {t:"Equivalent Mass", eq:"Eq. mass = " + frac("Molar mass","n-factor"),
     sym:[["n-factor","Number of electrons gained/lost per formula unit"]],
     cases:["Acids: n-factor = basicity (number of replaceable H⁺)","Bases: n-factor = acidity (number of replaceable OH⁻)","Salts: n-factor = total charge on cation (or anion)","Oxidising/reducing agents: n-factor = change in oxidation number per formula unit"],
     tip:"n-factor for acids/bases = basicity/acidity; for redox species it's the change in oxidation number."},
    {t:"n-Factor for Disproportionation", eq:frac("1","n<sub>eff</sub>") + " = " + frac("1","n<sub>1</sub>") + " + " + frac("1","n<sub>2</sub>"),
     sym:[["n1, n2","n-factors for the oxidation and reduction halves respectively"]], tip:"In disproportionation the SAME species is both oxidised and reduced — so its effective n-factor combines both halves this way."},
    {t:"Number of Equivalents", eq:"Equivalents = Moles × n-factor",
     sym:[], tip:"At the equivalence point of any titration: equivalents of oxidant = equivalents of reductant — this is the master relation."},
    {t:"Normality", eq:"N = Molarity × n-factor",
     sym:[["N","Normality (eq/L)"]], tip:"Normality is reaction-dependent — the same solution can have different N values in different reactions."},
    {t:"Oxidation Number Sum Rule", eq:"Σ(oxidation states) = 0 &nbsp;(neutral) &nbsp;or&nbsp; = charge &nbsp;(ion)",
     sym:[], tip:"Assign known oxidation states first (like O = −2, H = +1) then solve for the unknown atom algebraically."}
  ]},

  {cls:"11", subject:"chemistry", chapter:"Organic Chemistry Basics", formulas:[
    {t:"Degree of Unsaturation", eq:"DoU = " + frac("2C + 2 + N − H","2"),
     sym:[["C, H, N","Number of carbon, hydrogen, and nitrogen atoms"]], tip:"Oxygen and sulfur don't affect this formula at all — only count C, H, and N."},
    {t:"General Formulas of Hydrocarbons", eq:"Alkanes: C<sub>n</sub>H<sub>2n+2</sub>",
     sym:[],
     cases:["Alkenes (one double bond): CₙH₂ₙ","Alkynes (one triple bond): CₙH₂ₙ₋₂"],
     tip:"Each degree of unsaturation (ring or π bond) removes 2 hydrogens from the saturated CₙH₂ₙ₊₂ formula."},
    {t:"Percentage Yield", eq:"%yield = " + frac("Actual yield","Theoretical yield") + " × 100",
     sym:[], tip:"Theoretical yield is calculated from the limiting reagent — always identify the limiting reagent first in multi-step synthesis problems."}
  ]},

  /* =========================================================
     CLASS 11 :: MATHEMATICS  (10 chapters)
     ========================================================= */
  {cls:"11", subject:"math", chapter:"Quadratic Equations", formulas:[
    {t:"Roots of a Quadratic", eq:"x = " + frac("−b ± √(b² − 4ac)","2a"),
     sym:[["a, b, c","Coefficients of ax² + bx + c = 0"]], tip:"The ± gives both roots at once — plug back one root into the original equation as a quick accuracy check."},
    {t:"Sum & Product of Roots", eq:"α + β = −b/a &nbsp;&nbsp; αβ = c/a",
     sym:[["α, β","Roots of the quadratic"]], tip:"Lets you construct a new quadratic from transformed roots (like α², 1/β) without solving for α, β explicitly."},
    {t:"Discriminant", eq:"D = b² − 4ac",
     sym:[["D","Discriminant"]],
     cases:["D > 0: two distinct real roots","D = 0: two equal (repeated) real roots","D < 0: two complex conjugate roots"],
     tip:"D > 0 → real distinct roots, D = 0 → equal roots, D < 0 → complex conjugate roots."},
    {t:"Formation of a Quadratic from its Roots", eq:"x² − (α + β)x + αβ = 0",
     sym:[], tip:"Fast way to build a new equation once you know the sum and product of the desired roots — no need to expand (x−α)(x−β)."},
    {t:"Condition for a Common Root", eq:"(c<sub>1</sub>a<sub>2</sub> − c<sub>2</sub>a<sub>1</sub>)² = (a<sub>1</sub>b<sub>2</sub> − a<sub>2</sub>b<sub>1</sub>)(b<sub>1</sub>c<sub>2</sub> − b<sub>2</sub>c<sub>1</sub>)",
     sym:[],
     cases:["Both roots common: a1/a2 = b1/b2 = c1/c2"],
     tip:"Use this directly instead of solving both quadratics simultaneously — saves significant time in MCQs."},
    {t:"Difference of Roots", eq:"|α − β| = " + frac("√D","|a|"),
     sym:[], tip:"Handy whenever a question gives you the difference of roots directly rather than asking you to find each root separately."},
    {t:"Newton's Sum Formula", eq:"Sn = αⁿ + βⁿ &nbsp;⇒&nbsp; a·Sn + b·S(n−1) + c·S(n−2) = 0",
