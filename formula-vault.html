  {cls:"11", subject:"physics", chapter:"Work, Energy & Power", derivations:[
    {t:"Derivation of the Work-Energy Theorem (Variable Force)",
     given:"A variable force F acts on a body of mass m along the x-direction, changing its velocity from v1 to v2 as it moves from x1 to x2.",
     steps:[
       "Work done: W = ∫(x1 to x2) F dx = ∫(x1 to x2) ma dx, using Newton's second law",
       "Write a = dv/dt, and use the chain rule trick: a = (dv/dt) = (dv/dx)(dx/dt) = v(dv/dx)",
       "Substitute: W = ∫(x1 to x2) m·v(dv/dx)·dx = ∫(v1 to v2) mv dv (the dx cancels, and limits convert from x to v)",
       "Integrate: W = m[v²/2] from v1 to v2 = ½mv2² − ½mv1²"
     ],
     result:"W(net) = ΔKE = ½mv2² − ½mv1²"},
    {t:"Derivation of Velocities After a 1D Elastic Collision",
     given:"Two bodies of masses m1, m2 with initial velocities u1, u2 undergo a perfectly elastic head-on collision, ending with velocities v1, v2.",
     steps:[
       "Conservation of momentum: m1u1 + m2u2 = m1v1 + m2v2, rearranged as m1(u1−v1) = m2(v2−u2)  …(i)",
       "Conservation of kinetic energy: m1(u1²−v1²) = m2(v2²−u2²), which factors as m1(u1−v1)(u1+v1) = m2(v2−u2)(v2+u2)  …(ii)",
       "Divide equation (ii) by equation (i): u1 + v1 = v2 + u2, which rearranges to u1 − u2 = v2 − v1  …(iii) — this says the velocity of approach equals the velocity of separation",
       "From (iii): v2 = u1 − u2 + v1. Substitute this into (i) and solve for v1",
       "This yields v1, and by the symmetric argument (swapping the labels 1↔2), v2 follows the same pattern"
     ],
     result:"v1 = [(m1−m2)u1 + 2m2u2]/(m1+m2), v2 = [(m2−m1)u2 + 2m1u1]/(m1+m2)"}
  ]},

  {cls:"11", subject:"physics", chapter:"Moment of Inertia", derivations:[
    {t:"Derivation of the Parallel Axis Theorem",
     given:"A body of mass M with moment of inertia Icm about an axis through its centre of mass; a second axis is parallel to it, at distance d.",
     steps:[
       "For a particle of mass m at position vector r from the centre of mass, its position from the new axis is (r + d)",
       "I (about new axis) = Σm(r + d)² = Σm(r² + 2r·d + d²) = Σmr² + 2d·Σmr + d²Σm",
       "By definition, Σmr² = Icm (moment of inertia about the CM axis)",
       "Also by definition of centre of mass, Σmr = 0 (position vectors measured from the CM average to zero)",
       "And Σm = M, the total mass, so the middle term vanishes and the last term becomes Md²"
     ],
     result:"I = Icm + Md²"},
    {t:"Derivation of the Perpendicular Axis Theorem",
     given:"A flat (planar) lamina lying in the xy-plane, with the z-axis perpendicular to it through the same origin.",
     steps:[
       "For a particle at position (x, y) in the lamina, its distance from the z-axis is r = √(x² + y²)",
       "Moment of inertia about z-axis: Iz = Σm(x² + y²) = Σmx² + Σmy²",
       "By definition, the moment of inertia about the x-axis is Ix = Σmy² (distance from the x-axis is y), and about the y-axis is Iy = Σmx²",
       "Substituting: Iz = Iy + Ix"
     ],
     result:"Iz = Ix + Iy &nbsp; (valid only for a planar lamina)"},
    {t:"Derivation of MOI of a Uniform Rod (About Centre)",
     given:"A thin uniform rod of mass M and length L, linear mass density λ = M/L. Axis through the centre, perpendicular to the rod.",
     steps:[
       "Consider a small element of the rod of length dx, at distance x from the centre. Its mass is dm = λ dx",
       "This element's contribution to the moment of inertia: dI = dm·x² = λx² dx",
       "Integrate over the full length of the rod, from x = −L/2 to x = +L/2: I = ∫(−L/2 to L/2) λx² dx",
       "I = λ[x³/3] from −L/2 to L/2 = λ[(L³/24) − (−L³/24)] = λL³/12",
       "Substitute λ = M/L: I = (M/L)(L³/12)"
     ],
     result:"I = ML²/12"},
    {t:"Derivation of MOI of a Uniform Disc (About Central Axis)",
     given:"A uniform disc of mass M and radius R, surface mass density σ = M/(πR²). Axis through the centre, perpendicular to the disc's plane.",
     steps:[
       "Consider a thin ring element of the disc, at radius r from the centre, with thickness dr. Its area is 2πr·dr, so its mass is dm = σ·2πr dr",
       "Since every point on this thin ring is at the same distance r from the axis, its contribution to the moment of inertia is dI = dm·r² = 2πσr³ dr",
       "Integrate over the whole disc, from r = 0 to r = R: I = ∫(0 to R) 2πσr³ dr",
       "I = 2πσ[r⁴/4] from 0 to R = 2πσR⁴/4 = πσR⁴/2",
       "Substitute σ = M/(πR²): I = π(M/πR²)(R⁴/2) = MR²/2"
     ],
     result:"I = MR²/2"}
  ]},

  {cls:"11", subject:"physics", chapter:"Gravitation", derivations:[
    {t:"Derivation of Escape Velocity",
     given:"The minimum speed needed to just escape a planet's gravity is the speed for which total mechanical energy (KE + PE) equals zero at infinity.",
     steps:[
       "Total energy at the surface: E = ½mve² − GMm/R",
       "For the object to just escape (reach infinity with zero residual velocity), total energy must equal zero: ½mve² − GMm/R = 0",
       "Solving for ve²: ve² = 2GM/R"
     ],
     result:"ve = √(2GM/R)"},
    {t:"Derivation of Kepler's Third Law (from gravitation)",
     given:"A satellite of mass m orbits a planet of mass M in a circular orbit of radius r; gravity supplies the required centripetal force.",
     steps:[
       "Equate gravitational force to centripetal force: GMm/r² = mv²/r",
       "Simplify: v² = GM/r, so orbital speed v = √(GM/r)",
       "Time period T = (circumference)/(speed) = 2πr/v = 2πr/√(GM/r) = 2πr^(3/2)/√(GM)",
       "Squaring both sides: T² = 4π²r³/GM"
     ],
     result:"T²/r³ = 4π²/GM &nbsp; (Kepler's Third Law)"},
    {t:"Derivation of Variation of g with Height and Depth",
     given:"g = GM/R² at the surface of a planet of radius R and mass M (assumed uniform density).",
     steps:[
       "At height h above the surface: g' = GM/(R+h)². Dividing by g = GM/R²: g'/g = R²/(R+h)² = (1 + h/R)⁻²",
       "For h ≪ R, apply the binomial approximation (1+x)ⁿ ≈ 1+nx: g'/g ≈ 1 − 2h/R, so g' ≈ g(1 − 2h/R)",
       "At depth d below the surface, only the mass enclosed within radius (R−d) contributes to gravity there (the shell outside contributes zero net field). For uniform density, this enclosed mass is M' = M×(R−d)³/R³",
       "g' = GM'/(R−d)² = GM(R−d)³ / [R³(R−d)²] = GM(R−d)/R³ = [GM/R²]×[(R−d)/R]"
     ],
     result:"gh ≈ g(1 − 2h/R); gd = g(1 − d/R)"}
  ]},

  {cls:"11", subject:"physics", chapter:"Mechanical Properties of Fluids", derivations:[
    {t:"Derivation of the Ascent Formula (Capillary Rise)",
     given:"A capillary tube of radius r dipped into a liquid of density ρ and surface tension T, with angle of contact θ. Liquid rises to height h.",
     steps:[
       "At equilibrium, the weight of the risen liquid column is balanced by the vertical component of the surface tension force acting around the circumference of the tube",
       "Weight of the liquid column: W = (volume)×(density)×g = (πr²h)×ρ×g",
       "Surface tension force acts along the circumference (length 2πr) at angle θ to the vertical wall; its vertical component is: F = T×(2πr)×cosθ",
       "Equating the two: πr²hρg = 2πrT cosθ",
       "Cancel πr from both sides and solve for h"
     ],
     result:"h = 2T cosθ / (rρg)"},
    {t:"Derivation of Terminal Velocity (Using Stokes' Law)",
     given:"A small sphere of radius r and density ρ falls through a viscous fluid of density σ and viscosity η. At terminal velocity, the net force on it is zero.",
     steps:[
       "Three forces act: weight (down), buoyant force (up), and viscous drag (up, opposing motion)",
       "Weight: W = (4/3)πr³ρg. Buoyant force: Fb = (4/3)πr³σg. Viscous force (Stokes' Law): Fv = 6πηrv",
       "At terminal velocity, net force = 0: W = Fb + Fv",
       "(4/3)πr³ρg = (4/3)πr³σg + 6πηrv",
       "(4/3)πr³g(ρ−σ) = 6πηrv",
       "Solve for v by dividing both sides by 6πηr"
     ],
     result:"vt = 2r²(ρ−σ)g / (9η)"},
    {t:"Derivation of Bernoulli's Theorem",
     given:"An ideal (non-viscous, incompressible) fluid flows steadily through a pipe of varying cross-section, from point 1 (area A1, pressure P1, height h1, speed v1) to point 2 (A2, P2, h2, v2), using the work-energy theorem.",
     steps:[
       "By the equation of continuity, the same volume ΔV of fluid enters at point 1 as leaves at point 2 in a given time interval",
       "Work done by the pressure force pushing fluid in at point 1: W1 = P1·A1·(v1Δt) = P1·ΔV. Work done against the pressure force at point 2: W2 = P2·ΔV",
       "Net work done on the fluid element by pressure forces: W = (P1−P2)ΔV",
       "By the work-energy theorem, this net work equals the change in kinetic energy plus the change in potential energy of the fluid element (mass Δm = ρΔV): W = [½Δm v2² − ½Δm v1²] + [Δm g h2 − Δm g h1]",
       "Substitute Δm = ρΔV and divide throughout by ΔV: P1 − P2 = ½ρ(v2²−v1²) + ρg(h2−h1)",
       "Rearrange so that all point-1 quantities are on one side and point-2 quantities on the other"
     ],
     result:"P + ½ρv² + ρgh = constant, along a streamline"}
  ]},

  {cls:"11", subject:"physics", chapter:"Kinetic Theory of Gases", derivations:[
    {t:"Derivation of Pressure of an Ideal Gas",
     given:"N molecules of mass m each, inside a cubical container of side L, moving randomly and colliding elastically with the walls.",
     steps:[
       "Consider one molecule with x-velocity component vx hitting the wall perpendicular to the x-axis. Since the collision is elastic, its momentum change per collision is 2mvx",
       "Time between successive collisions with the same wall is 2L/vx, so this molecule delivers momentum at rate mvx²/L (force from one molecule)",
       "Summing over all N molecules: total force = (m/L)Σvx² = (mN/L)⟨vx²⟩",
       "By symmetry of random motion, ⟨vx²⟩ = ⟨vy²⟩ = ⟨vz²⟩ = ⅓⟨v²⟩",
       "Pressure = Force/Area = [(mN/L)(⅓⟨v²⟩)] / L² = Nm⟨v²⟩/3L³ = Nm⟨v²⟩/3V (since V = L³)",
       "Since ρ = Nm/V is the gas density, this becomes P = ⅓ρ⟨v²⟩"
     ],
     result:"P = ⅓ρv²rms"}
  ]},

  {cls:"11", subject:"physics", chapter:"Thermodynamics", derivations:[
    {t:"Derivation of Mayer's Formula (Cp − Cv = R)",
     given:"One mole of an ideal gas, whose internal energy U depends only on temperature (dU = CvdT, always, for an ideal gas).",
     steps:[
       "At constant volume, no work is done (dW=0), so the first law gives: dQ = dU = CvdT, meaning the heat supplied at constant V defines Cv",
       "At constant pressure, the first law gives: dQ = dU + PdV = CvdT + PdV, and by definition this heat supplied at constant P defines Cp: CpdT = CvdT + PdV",
       "For 1 mole of ideal gas, PV=RT. At constant pressure, differentiate: PdV = RdT",
       "Substitute: CpdT = CvdT + RdT",
       "Divide through by dT"
     ],
     result:"Cp − Cv = R"},
    {t:"Derivation of Work Done in Isothermal Expansion",
     given:"n moles of an ideal gas expand reversibly and isothermally (constant T) from volume V1 to V2.",
     steps:[
       "Work done by the gas: W = ∫(V1 to V2) P dV",
       "For an ideal gas, P = nRT/V. Since T is constant, substitute directly: W = ∫(V1 to V2) (nRT/V) dV",
       "Since n, R, T are all constant, pull them out of the integral: W = nRT ∫(V1 to V2) dV/V = nRT[lnV] from V1 to V2"
     ],
     result:"W = nRT ln(V2/V1)"},
    {t:"Derivation of Work Done in Adiabatic Expansion",
     given:"An ideal gas expands reversibly and adiabatically from (P1,V1) to (P2,V2), obeying PVᵞ = constant = K.",
     steps:[
       "Work done: W = ∫(V1 to V2) P dV, with P = K/Vᵞ (from PVᵞ=K)",
       "W = ∫(V1 to V2) K·V⁻ᵞ dV = K[V^(1−γ)/(1−γ)] from V1 to V2",
       "W = [K·V2^(1−γ) − K·V1^(1−γ)] / (1−γ)",
       "Since K = P1V1ᵞ = P2V2ᵞ, substitute back: K·V2^(1−γ) = P2V2ᵞ·V2^(1−γ) = P2V2, and similarly K·V1^(1−γ) = P1V1",
       "So W = (P2V2 − P1V1)/(1−γ) = (P1V1 − P2V2)/(γ−1)"
     ],
     result:"W = (P1V1 − P2V2) / (γ−1)"}
  ]},

  {cls:"11", subject:"physics", chapter:"Oscillations", derivations:[
    {t:"Derivation of Time Period of a Spring-Mass System",
     given:"A block of mass m attached to a spring of force constant k, displaced by x from its equilibrium position on a frictionless surface.",
     steps:[
       "By Hooke's Law, the restoring force is F = −kx (negative sign shows it opposes the displacement)",
       "By Newton's second law: ma = −kx, so a = −(k/m)x",
       "Compare with the standard SHM equation a = −ω²x: matching coefficients gives ω² = k/m, so ω = √(k/m)",
       "Time period T = 2π/ω"
     ],
     result:"T = 2π√(m/k)"},
    {t:"Derivation of Time Period of a Simple Pendulum",
     given:"A bob of mass m on a string of length L, displaced through a small angle θ from the vertical.",
     steps:[
       "The restoring force along the arc is the tangential component of gravity: F = −mg sinθ",
       "For small angles, sinθ ≈ θ = x/L, where x is the arc-length displacement from the mean position",
       "So F ≈ −(mg/L)x — this matches the SHM form F = −kx with effective 'spring constant' k = mg/L",
       "For SHM, ω² = k/m, so ω² = g/L, giving ω = √(g/L)",
       "Time period T = 2π/ω"
     ],
     result:"T = 2π√(L/g)"}
  ]},

  {cls:"11", subject:"physics", chapter:"Waves", derivations:[
    {t:"Derivation of Standing Wave Frequencies (String, Both Ends Fixed)",
     given:"A string of length L fixed at both ends; both endpoints must be nodes of any standing wave that forms.",
     steps:[
       "Consecutive nodes of a standing wave are separated by half a wavelength (λ/2)",
       "For both ends to be nodes, the string length must be a whole-number multiple of λ/2: L = nλ/2, where n = 1, 2, 3, …",
       "Solving for wavelength: λ = 2L/n",
       "Using v = fλ, frequency f = v/λ = v/(2L/n) = nv/2L"
     ],
     result:"fn = nv / 2L"},
    {t:"Derivation of Speed of a Transverse Wave on a Stretched String",
     given:"The wave speed v on a stretched string can only depend on the tension T and the linear mass density μ (mass per unit length) — the only two relevant physical quantities of the string itself.",
     steps:[
       "Assume v = k·Tᵃ·μᵇ for some dimensionless constant k and unknown powers a, b",
       "Write the dimensions of each quantity: [v] = LT⁻¹, [T] = MLT⁻², [μ] = ML⁻¹",
       "Substitute into the assumed relation: LT⁻¹ = (MLT⁻²)ᵃ(ML⁻¹)ᵇ = M^(a+b)L^(a−b)T^(−2a)",
       "Match powers on both sides — for M: a+b=0; for L: a−b=1; for T: −2a=−1",
       "Solving: a = 1/2, and then b = −1/2",
       "So v = k√(T/μ); a full treatment of the wave equation on a string confirms the constant k = 1"
     ],
     result:"v = √(T/μ)"},
    {t:"Newton's Formula for Speed of Sound and Laplace's Correction",
     given:"Sound travels through a gas as a series of compressions and rarefactions, and the speed of any wave in a medium is v=√(B/ρ), where B is the medium's bulk modulus.",
     steps:[
       "Newton assumed sound propagation is slow enough for the gas to stay at constant temperature (isothermal), so PV = constant applies, giving isothermal bulk modulus B = P",
       "This gives Newton's formula: v = √(P/ρ) — but this predicts a speed of sound in air about 20% lower than what is measured experimentally",
       "Laplace corrected this by arguing that compressions and rarefactions in a sound wave happen too rapidly for heat to be exchanged between adjacent gas layers — the process is actually adiabatic, not isothermal",
       "For an adiabatic process, PVᵞ = constant, which gives the adiabatic bulk modulus B = γP instead of just P",
       "Substituting the adiabatic bulk modulus into v=√(B/ρ) gives the corrected result, which matches experimental values closely"
     ],
     result:"v = √(γP/ρ) &nbsp; (Laplace's corrected formula)"},
    {t:"Derivation of the Doppler Effect (Source Approaching a Stationary Observer)",
     given:"A source emits sound of frequency f (period T=1/f) while moving toward a stationary observer with speed vs. Sound travels at speed v in the medium.",
     steps:[
       "Consider two consecutive wavefronts, emitted at t=0 and t=T (one full period apart)",
       "By the time the source emits the second wavefront (at t=T), it has moved a distance vsT closer to the observer",
       "In this same time T, the first wavefront has travelled a distance vT from the source's original position",
       "The distance between the two wavefronts (the apparent wavelength λ′ perceived by the observer) is therefore reduced: λ′ = vT − vsT = (v−vs)T",
       "The apparent frequency is f′ = v/λ′ = v / [(v−vs)T], and since T=1/f, this becomes f′ = fv/(v−vs)"
     ],
     result:"f′ = fv / (v − vs)"},
    {t:"Derivation of Beat Frequency",
     given:"Two sound waves of equal amplitude A and close (but different) frequencies f1 and f2, superposing at a point: y1 = A sin(2πf1t), y2 = A sin(2πf2t).",
     steps:[
       "By the principle of superposition, the resultant displacement is y = y1 + y2 = A[sin(2πf1t) + sin(2πf2t)]",
       "Apply the sum-to-product identity: y = 2A cos[2π(f1−f2)t/2] · sin[2π(f1+f2)t/2]",
       "This represents a wave of frequency (f1+f2)/2 (essentially the average of the two, barely changed) whose amplitude is modulated by the slowly-varying envelope term 2A cos[2π(f1−f2)t/2]",
       "Loudness is maximum whenever this envelope term reaches its maximum magnitude (+1 or −1), which happens twice in every full cycle of the cosine term",
       "The cosine term itself has frequency (f1−f2)/2, so its magnitude peaks occur at twice that rate"
     ],
     result:"Beat frequency = |f1 − f2|"}
  ]},

  {cls:"12", subject:"physics", chapter:"Electrostatics", derivations:[
    {t:"Derivation of Electric Field on the Axial Line of a Dipole",
     given:"A dipole with charges +q and −q separated by distance 2a; point P lies on the axial line at distance r from the centre, on the +q side.",
     steps:[
       "Distance from P to +q is (r − a); distance from P to −q is (r + a)",
       "Field due to +q at P (pointing away from the dipole): E+ = kq/(r−a)²",
       "Field due to −q at P (pointing toward the dipole, i.e. same direction as E+ here): E− = kq/(r+a)²",
       "Net field: E = k q [1/(r−a)² − 1/(r+a)²] = kq[(r+a)² − (r−a)²] / [(r−a)²(r+a)²] = kq(4ar)/(r²−a²)²",
       "Since dipole moment p = q(2a): E = 2kpr/(r²−a²)²",
       "For a short dipole (r ≫ a), (r²−a²)² ≈ r⁴, giving E ≈ 2kp/r³"
     ],
     result:"Eaxial ≈ (1/4πε0)(2p/r³) &nbsp; for r ≫ a"},
    {t:"Derivation of Electric Field on the Equatorial Line of a Dipole",
     given:"A dipole with charges +q and −q separated by distance 2a; point P lies on the equatorial line (perpendicular bisector) at distance r from the centre.",
     steps:[
       "By symmetry, P is equidistant from both charges: distance = √(r²+a²)",
       "Each charge contributes a field of equal magnitude E = kq/(r²+a²) at P, but pointing in different directions (away from +q, toward −q)",
       "Resolve each field into components parallel and perpendicular to the dipole axis — the perpendicular components cancel by symmetry, and the parallel (axis-directed) components add",
       "Each field's component along the axis is E·cosα, where cosα = a/√(r²+a²)",
       "Net field: Enet = 2E cosα = 2·[kq/(r²+a²)]·[a/√(r²+a²)] = 2kqa/(r²+a²)^(3/2) = kp/(r²+a²)^(3/2), using p=2qa",
       "For a short dipole (r≫a): (r²+a²)^(3/2) ≈ r³"
     ],
     result:"Eequatorial ≈ (1/4πε0)(p/r³) &nbsp; for r ≫ a — exactly half the axial field"},
    {t:"Derivation of Torque on a Dipole in a Uniform Field",
     given:"A dipole of moment p = q(2a) placed in a uniform electric field E, making angle θ with the field direction.",
     steps:[
       "Forces qE (on +q) and −qE (on −q) act in opposite directions, forming a couple — they don't cancel as a torque even though they cancel as a net force",
       "The perpendicular distance between the two lines of action of this force couple is (2a)sinθ",
       "Torque of a couple = one force × perpendicular distance between them: τ = qE × (2a sinθ)",
       "Group terms: τ = (q·2a)·E·sinθ = p·E·sinθ, using p=2qa"
     ],
     result:"τ = pE sinθ"},
    {t:"Derivation of Electric Potential due to a Dipole",
     given:"A dipole with charges +q, −q separated by 2a; point P at distance r from the centre, at angle θ from the dipole axis, with r ≫ a.",
     steps:[
       "V at P = kq/r+ − kq/r−, where r+ and r− are distances from P to +q and −q respectively",
       "Using the approximation valid for r≫a: r+ ≈ r − a cosθ, and r− ≈ r + a cosθ",
       "V = kq[1/(r−acosθ) − 1/(r+acosθ)]",
       "Using the binomial approximation 1/(r∓acosθ) ≈ (1/r)(1±(acosθ/r)) for a≪r: V ≈ kq[(1/r)(1+acosθ/r) − (1/r)(1−acosθ/r)] = kq(2acosθ)/r²",
       "Substitute p = 2qa"
     ],
     result:"V = (1/4πε0)(p cosθ)/r²"},
    {t:"Derivation of Electric Field due to an Infinitely Long Charged Wire (Gauss's Law)",
     given:"An infinitely long straight wire with uniform linear charge density λ. Find the field at perpendicular distance r from the wire.",
     steps:[
       "Choose a cylindrical Gaussian surface of radius r and length L, coaxial with the wire",
       "By symmetry, E is radially outward and has the same magnitude everywhere on the curved surface; the flux through the two flat end-caps is zero (E is parallel to these surfaces there)",
       "Flux through the curved surface: Φ = E × (2πrL)",
       "Charge enclosed: qenc = λL",
       "Apply Gauss's Law: E×2πrL = λL/ε0"
     ],
     result:"E = λ / (2πε0r)"},
    {t:"Derivation of Electric Field due to a Charged Infinite Plane Sheet (Gauss's Law)",
     given:"An infinite plane sheet with uniform surface charge density σ. Find the field at a point near the sheet.",
     steps:[
       "Choose a cylindrical 'pillbox' Gaussian surface that straddles the sheet symmetrically, with its two flat faces (each of area A) parallel to the sheet",
       "By symmetry, E is perpendicular to the sheet, pointing away from it on both sides, with equal magnitude at both faces",
       "Flux through the two flat faces: Φ = EA + EA = 2EA. Flux through the curved side surface is zero (E is parallel to it there)",
       "Charge enclosed: qenc = σA",
       "Apply Gauss's Law: 2EA = σA/ε0"
     ],
     result:"E = σ / (2ε0)"},
    {t:"Derivation of Capacitance of a Parallel Plate Capacitor",
     given:"Two parallel plates of area A separated by distance d, with charge Q and −Q, treated as infinite sheets so the field between them is uniform.",
     steps:[
       "Field between the plates (from the infinite-sheet result, doubled since both plates contribute): E = σ/ε0 = Q/(ε0A)",
       "Potential difference V = E·d (uniform field over separation d): V = Qd/(ε0A)",
       "Capacitance is defined as C = Q/V"
     ],
     result:"C = ε0A / d"},
    {t:"Derivation of Capacitance with a Dielectric Inserted",
     given:"A parallel plate capacitor (capacitance C0 = ε0A/d without dielectric) has a dielectric slab of dielectric constant K inserted, completely filling the gap.",
     steps:[
       "Inside a dielectric, the field reduces by a factor of K compared to the field in vacuum for the same free charge: E = E0/K",
       "Since V = E×d, the new voltage for the same charge Q is V = V0/K, where V0 = Q/C0 was the original voltage",
       "Capacitance is defined as C = Q/V = Q/(V0/K) = K(Q/V0) = K·C0"
     ],
     result:"C = Kε0A/d = KC0"},
    {t:"Derivation of Energy Stored in a Capacitor",
     given:"A capacitor of capacitance C is charged from 0 to a final charge Q by transferring charge in small increments.",
     steps:[
       "At some intermediate stage, when charge q has already been transferred, the potential difference is V=q/C. The work needed to transfer the next small charge dq is dW = V dq = (q/C)dq",
       "Total work done to charge the capacitor from 0 to Q: W = ∫(0 to Q) (q/C) dq = (1/C)[q²/2] from 0 to Q = Q²/(2C)",
       "This work is stored as electrical potential energy in the capacitor. Using Q=CV, this can also be written as U = ½CV²"
     ],
     result:"U = Q²/(2C) = ½CV²"}
  ]},

  {cls:"12", subject:"physics", chapter:"Current Electricity", derivations:[
    {t:"Derivation of Equivalent Resistance — Series and Parallel",
     given:"Resistors R1, R2, … combined either in series (same current through each) or in parallel (same voltage across each).",
     steps:[
       "Series: the same current I flows through every resistor. Total voltage across the combination: V = V1+V2+⋯ = IR1+IR2+⋯ = I(R1+R2+⋯). Since V=IReq by definition, Req = R1+R2+⋯",
       "Parallel: the same voltage V appears across every resistor. Total current drawn: I = I1+I2+⋯ = V/R1+V/R2+⋯ = V(1/R1+1/R2+⋯). Since I=V/Req by definition, 1/Req = 1/R1+1/R2+⋯"
     ],
     result:"Series: Req = R1+R2+⋯; &nbsp; Parallel: 1/Req = 1/R1+1/R2+⋯"},
    {t:"Derivation of I = nAev(d) (Drift Velocity Relation)",
     given:"A conductor of cross-sectional area A with n free electrons per unit volume, each moving with average drift speed vd.",
     steps:[
       "In a small time Δt, electrons travel an average distance vd·Δt along the conductor",
       "Volume of conductor swept through in this time: A × (vd·Δt)",
       "Number of free electrons in this volume: n × A × vd·Δt",
       "Total charge crossing a cross-section in time Δt: ΔQ = (n·A·vd·Δt)·e",
       "Current I = ΔQ/Δt"
     ],
     result:"I = nAevd"},
    {t:"Derivation of the Wheatstone Bridge Balance Condition",
     given:"A bridge with resistances P, Q, R, S in its four arms, a galvanometer between the midpoints, and a battery driving current through the network. At balance, no current flows through the galvanometer.",
     steps:[
       "Since no current flows through the galvanometer at balance, the same current I1 flows through both P and Q, and the same current I2 flows through both R and S",
       "No current through the galvanometer also means the two midpoints (call them B and D) are at the same potential: VB = VD",
       "Along the P–Q path: VA − VB = I1P and VA − VD = I2R. Since VB = VD: I1P = I2R  …(i)",
       "Along the same branches to the far end C: VB − VC = I1Q and VD − VC = I2S. Since VB = VD: I1Q = I2S  …(ii)",
       "Dividing equation (i) by equation (ii): P/Q = R/S"
     ],
     result:"P/Q = R/S"}
  ]},

  {cls:"12", subject:"physics", chapter:"Magnetism & Electromagnetic Induction", derivations:[
    {t:"Derivation of Magnetic Field at the Centre of a Circular Loop",
     given:"A circular loop of radius R carrying current I. By the Biot–Savart law, dB = (μ0/4π)(I·dl × r̂)/r².",
     steps:[
       "At the centre, every current element dl is at the same distance r = R, and dl is always perpendicular to r̂ (tangential vs radial)",
       "So |dl × r̂| = dl, and each element contributes dB = (μ0/4π)(I·dl)/R², all pointing in the same direction (along the axis)",
       "Integrate around the full loop: B = ∫dB = (μ0I)/(4πR²) ∫dl = (μ0I)/(4πR²) × (2πR)"
     ],
     result:"B = μ0I / 2R"},
    {t:"Derivation of Magnetic Field on the Axis of a Circular Loop",
     given:"A circular loop of radius R carrying current I. Find B at a point P on the axis, at distance x from the centre.",
     steps:[
       "Each current element dl is at distance √(R²+x²) from P. By the Biot–Savart law, it contributes dB = (μ0/4π)·I dl/(R²+x²), directed perpendicular to the line joining the element to P",
       "By symmetry, the components of dB perpendicular to the axis cancel out in pairs around the loop; only the components along the axis survive",
       "The axial component of each dB is dB·cosα, where cosα = R/√(R²+x²)",
       "Integrate around the loop: B = ∮dB cosα = [μ0I/(4π(R²+x²))]×[R/√(R²+x²)] × ∮dl = [μ0I R/(4π(R²+x²)^(3/2))] × 2πR"
     ],
     result:"B = μ0IR² / [2(R²+x²)^(3/2)]"},
    {t:"Derivation of Magnetic Field of a Long Straight Wire (Ampere's Law)",
     given:"A long straight wire carrying current I. Find B at perpendicular distance r from the wire.",
     steps:[
       "Choose an Amperian loop: a circle of radius r, centred on and perpendicular to the wire",
       "By symmetry, B is tangential to this circle and has the same magnitude everywhere on it",
       "Apply Ampere's Circuital Law: ∮B·dl = B×(2πr) = μ0Ienc = μ0I"
     ],
     result:"B = μ0I / (2πr)"},
    {t:"Derivation of Magnetic Field Inside a Long Solenoid (Ampere's Law)",
     given:"A long solenoid with n turns per unit length, carrying current I.",
     steps:[
       "Choose a rectangular Amperian loop: one long side of length L lies inside the solenoid, parallel to its axis; the opposite side lies far outside, where B≈0; the two short sides are perpendicular to the field, contributing nothing to the line integral",
       "Only the inside segment contributes to the line integral: ∮B·dl = B×L",
       "Current enclosed by this loop: the loop encloses nL turns, each carrying current I, so Ienc = nLI",
       "Apply Ampere's Law: B×L = μ0×nLI"
     ],
     result:"B = μ0nI"},
    {t:"Derivation of Force Between Two Parallel Current-Carrying Wires",
     given:"Two long parallel wires separated by distance d, carrying currents I1 and I2.",
     steps:[
       "Wire 1 produces a magnetic field at the location of wire 2, of magnitude B1 = μ0I1/(2πd)",
       "This field exerts a force on wire 2 (length L, carrying current I2): F = B1×I2×L",
       "Substitute B1"
     ],
     result:"F/L = μ0I1I2 / (2πd)"},
    {t:"Derivation of Self-Inductance of a Long Solenoid",
     given:"A solenoid of N turns, length l, cross-sectional area A, carrying current I. Inside field B = μ0nI, where n = N/l.",
     steps:[
       "Flux through a single turn: Φ1 = B×A = μ0nI×A",
       "Total flux linkage through all N turns: NΦ1 = N×μ0nIA = (nl)×μ0nIA = μ0n²IAl, using N=nl",
       "Self-inductance is defined by the relation: total flux linkage = LI, so L = μ0n²Al",
       "Since n = N/l, this can equivalently be written using N directly"
     ],
     result:"L = μ0n²Al = μ0N²A/l"},
    {t:"Derivation of Torque on a Current Loop in a Magnetic Field",
     given:"A rectangular loop of sides a and b, N turns, carrying current I, placed in field B with its normal at angle θ to B.",
     steps:[
       "The two sides of length b experience forces of magnitude F = BIb, equal and opposite, forming a couple",
       "The perpendicular distance between these two forces (the moment arm) is a·sinθ",
       "Torque of the couple = Force × moment arm = (BIb)(a sinθ) = BIA sinθ, where A = ab",
       "For N turns, each contributes equally, so multiply by N"
     ],
     result:"τ = NIAB sinθ"},
    {t:"Derivation of Motional EMF (ε = Bvl)",
     given:"A conducting rod of length l moves with velocity v, perpendicular to both its length and a uniform field B.",
     steps:[
       "A free electron in the rod experiences a magnetic force F = e(v × B), pushing charge to one end of the rod",
       "Charge keeps separating until the resulting electric field E inside the rod exerts an equal and opposite force: eE = evB, so E = vB",
       "EMF is defined as the work done per unit charge moving through this field along the rod's length: ε = E × l"
     ],
     result:"ε = Bvl"}
  ]},

  {cls:"12", subject:"physics", chapter:"Alternating Current", derivations:[
    {t:"Derivation of Impedance in a Series LCR Circuit (Phasor Method)",
     given:"A resistor R, inductor L, and capacitor C connected in series to an AC source V=V0sinωt, carrying a common current I=I0sin(ωt−φ).",
     steps:[
       "Voltage across R: VR=IR, in phase with the current — drawn along the current-phasor direction",
       "Voltage across L: VL=IXL, leading the current by 90° — drawn perpendicular, rotated +90°",
       "Voltage across C: VC=IXC, lagging the current by 90° — drawn perpendicular, rotated −90° (opposite to VL)",
       "Since VL and VC point in exactly opposite directions on the phasor diagram, their net effect is a single phasor of magnitude (VL−VC)",
       "This net reactive phasor (VL−VC) is perpendicular to VR, so by the Pythagorean theorem, the source voltage amplitude is: V0² = VR² + (VL−VC)²",
       "Substitute VR=I0R, VL=I0XL, VC=I0XC: V0² = I0²R² + I0²(XL−XC)², so V0 = I0√(R²+(XL−XC)²) = I0Z"
     ],
     result:"Z = √(R² + (XL−XC)²); tanφ = (XL−XC)/R"},
    {t:"Derivation of Resonant Frequency of an LCR Circuit",
     given:"A series LCR circuit, with impedance Z = √(R²+(XL−XC)²).",
     steps:[
       "Impedance Z is minimum (equal to just R) when the reactive term vanishes, i.e. when XL = XC",
       "Substitute XL=ωL and XC=1/(ωC): ωL = 1/(ωC)",
       "Solve for ω: ω² = 1/(LC)"
     ],
     result:"ω0 = 1/√(LC)"}
  ]},

  {cls:"12", subject:"physics", chapter:"Ray & Wave Optics", derivations:[
    {t:"Derivation of the Mirror Formula",
     given:"A concave mirror forms a real image; using similar triangles from the ray diagram (object AB, image A′B′, pole P, focus F).",
     steps:[
       "From the ray through the pole P, triangles ABP and A′B′P are similar: A′B′/AB = PB′/PB = v/u (using magnitudes)",
       "From the ray that travels parallel to the axis and reflects through F, triangles are similar in a way that gives: A′B′/AB = (PB′ − PF)/PF = (v − f)/f",
       "Equate the two expressions for A′B′/AB: v/u = (v − f)/f",
       "Cross-multiply: vf = u(v − f) = uv − uf, so vf + uf = uv",
       "Divide throughout by uvf: 1/u + 1/v = 1/f"
     ],
     result:"1/v + 1/u = 1/f"},
    {t:"Derivation of the Lens Maker's Formula",
     given:"A thin lens with two spherical surfaces of radii R1 and R2, refractive index n relative to the surrounding medium (air).",
     steps:[
       "Apply the single-spherical-surface refraction formula at the first surface (object in air, refracting into the lens): n/v1 − 1/u = (n − 1)/R1",
       "Apply the same formula at the second surface, treating the first image (at v1) as the object for this surface (ray now exits the lens back into air): 1/v − n/v1 = (1 − n)/R2",
       "Add the two equations — the n/v1 terms cancel: 1/v − 1/u = (n−1)/R1 + (1−n)/R2 = (n−1)(1/R1 − 1/R2)",
       "For an object at infinity, the image forms at the focus, so v = f"
     ],
     result:"1/f = (n − 1)(1/R1 − 1/R2)"},
    {t:"Derivation of the Prism Formula (δ = i + e − A)",
     given:"A ray enters a prism of refracting angle A at incidence angle i, refracts to r1 inside, hits the second face at r2, and exits at angle e.",
     steps:[
       "At the first surface, the ray bends by an angle (i − r1); at the second surface, it bends by a further (e − r2)",
       "Total deviation is the sum of these two individual deviations: δ = (i − r1) + (e − r2) = (i + e) − (r1 + r2)",
       "From the geometry of the quadrilateral formed by the two normals and the two refracting surfaces inside the prism, the angles work out to r1 + r2 = A"
     ],
     result:"δ = i + e − A"},
    {t:"Derivation of Refractive Index of a Prism at Minimum Deviation",
     given:"A prism of refracting angle A. At the angle of minimum deviation δm, the ray path through the prism becomes symmetric.",
     steps:[
       "At minimum deviation, the ray inside the prism travels parallel to the base, making the path symmetric: the angle of incidence equals the angle of emergence, i = e, and consequently r1 = r2 = r",
       "From the prism geometry relation r1+r2=A: 2r = A, so r = A/2",
       "From the deviation formula δ = i+e−A, at minimum deviation this becomes δm = 2i−A (since i=e), so i = (A+δm)/2",
       "Apply Snell's Law at the first surface: n = sin i / sin r"
     ],
     result:"n = sin[(A+δm)/2] / sin(A/2)"},
    {t:"Derivation of Magnifying Power of a Simple Microscope",
     given:"A convex lens of focal length f used as a simple magnifier, with the final virtual image formed at the near point (least distance of distinct vision, D).",
     steps:[
       "Magnifying power is defined as M = (angle subtended by the image at the eye, using the instrument) / (angle subtended by the object at the eye, at the near point without the instrument)",
       "For a thin lens with the image formed at the near point, v = −D (virtual image, same side as object, sign convention)",
       "Using the lens formula 1/v − 1/u = 1/f: −1/D − 1/u = 1/f, which gives 1/u = −1/D − 1/f",
       "Linear magnification m = v/u. Substituting u from above: m = (−D) / [−D f/(D+f)] = (D+f)/f"
     ],
     result:"M = 1 + D/f"},
    {t:"Derivation of Magnifying Power of an Astronomical Telescope",
     given:"An astronomical telescope in normal adjustment (final image at infinity): objective of focal length fo, eyepiece of focal length fe, sharing a common focal point where the objective's real image forms.",
     steps:[
       "Since the object is very far away, the objective forms a real, inverted image at its own focal point — at height h, say",
       "The angle subtended by the distant object at the objective (same as the angle subtended by this intermediate image, since the same rays are involved) is α ≈ h/fo (small angle approximation)",
       "This intermediate image lies exactly at the eyepiece's focal point too (normal adjustment), so the eyepiece views it from distance fe, and the final image (at infinity) subtends angle β ≈ h/fe at the eye",
       "Magnifying power M = β/α"
     ],
     result:"M = fo/fe"},
    {t:"Derivation of Fringe Width in Young's Double Slit Experiment",
     given:"Two coherent slits S1, S2 separated by distance d, screen at distance D (D≫d). Point P on the screen at distance x from the central point O.",
     steps:[
       "Path difference at P: Δ = S2P − S1P. Using the geometry of the setup (with D≫d and D≫x), this simplifies via the standard small-angle approximation to Δ ≈ dx/D",
       "For constructive interference (bright fringe) at P: Δ = nλ, giving the position of the nth bright fringe: xn = nλD/d",
       "The position of the next bright fringe (n+1): x(n+1) = (n+1)λD/d",
       "Fringe width β = x(n+1) − xn"
     ],
     result:"β = λD/d"}
  ]},

  {cls:"12", subject:"physics", chapter:"Modern Physics", derivations:[
    {t:"Derivation of the Radioactive Decay Law",
     given:"The rate of decay of a radioactive sample is directly proportional to the number of undecayed nuclei present: dN/dt = −λN.",
     steps:[
       "Separate variables: dN/N = −λ dt",
       "Integrate the left side from N0 (at t=0) to N (at time t), and the right side from 0 to t: ∫(N0 to N) dN/N = −λ∫(0 to t) dt",
       "Evaluating: ln(N/N0) = −λt",
       "Exponentiate both sides: N = N0e^(−λt)",
       "For the half-life, set N = N0/2: ln(1/2) = −λt½, so t½ = ln2/λ = 0.693/λ"
     ],
     result:"N = N0e^(−λt); &nbsp; t½ = 0.693/λ"},
    {t:"Derivation of Bohr Radius and Energy Levels",
     given:"An electron (charge −e, mass m) orbits a nucleus of charge +Ze at radius r with speed v. Coulomb attraction supplies the centripetal force, and angular momentum is quantised.",
     steps:[
       "Coulomb force = centripetal force: (1/4πε0)(Ze²/r²) = mv²/r, which rearranges to mv² = (1/4πε0)(Ze²/r)  …(i)",
       "Bohr's quantisation postulate: mvr = nh/2π, so v = nh/2πmr  …(ii)",
       "Substitute (ii) into (i) and solve for r: r = n²h²ε0/(πmZe²) — this shows rn ∝ n²/Z; evaluating the constants gives rn = 0.529(n²/Z) Å",
       "Total energy = KE + PE = ½mv² − (1/4πε0)(Ze²/r). Using mv² from (i), KE = ½(1/4πε0)(Ze²/r)",
       "So En = ½(1/4πε0)(Ze²/r) − (1/4πε0)(Ze²/r) = −½(1/4πε0)(Ze²/r)",
       "Substituting the expression for r from above and evaluating the constants gives the standard numerical result"
     ],
     result:"rn = 0.529(n²/Z) Å &nbsp;&nbsp; En = −13.6(Z²/n²) eV"}
  ]},

  {cls:"11", subject:"chemistry", chapter:"Structure of Atom", derivations:[
    {t:"Derivation of the Rydberg Formula (from Bohr's Energy Levels)",
     given:"An electron transitions from a higher energy level n2 to a lower level n1, emitting a photon. Bohr's energy formula: En = −13.6Z²/n² eV.",
     steps:[
       "Energy released = En1 − En2 (magnitude), since En1 is more negative... more precisely: ΔE = En(final) − En(initial) with initial=n2, final=n1: ΔE = −13.6Z²/n1² − (−13.6Z²/n2²) = 13.6Z²(1/n1² − 1/n2²)",
       "This energy is carried away by the emitted photon: ΔE = hc/λ",
       "Equating: hc/λ = 13.6Z²(1/n1² − 1/n2²)",
       "Divide both sides by hc, and absorb the constant (13.6/hc, converted to appropriate units) into the Rydberg constant R"
     ],
     result:"1/λ = RZ²(1/n1² − 1/n2²)"},
    {t:"Derivation of the De Broglie Wavelength Equation",
     given:"Planck's relation for a photon's energy, E=hν=hc/λ, combined with Einstein's mass-energy relation and the relativistic energy-momentum relation for light, E=pc.",
     steps:[
       "For a photon: E = hc/λ (Planck) and also E = pc (energy-momentum relation for a massless particle)",
       "Equate the two expressions: pc = hc/λ",
       "Cancel c from both sides: p = h/λ, so λ = h/p",
       "De Broglie's hypothesis extends this same relation to ALL matter, not just photons — for a particle of mass m moving with velocity v, its momentum is p=mv"
     ],
     result:"λ = h/p = h/(mv)"},
    {t:"Derivation of Bohr's Radius, Velocity, and Energy Equations",
     given:"An electron (mass m, charge −e) orbits a nucleus of charge +Ze at radius r with speed v. Coulomb attraction supplies the centripetal force, and angular momentum is quantised per Bohr's postulate.",
     steps:[
       "Coulomb force = centripetal force: (1/4πε0)(Ze²/r²) = mv²/r, which rearranges to mv² = (1/4πε0)(Ze²/r)  …(i)",
       "Bohr's quantisation postulate: mvr = nh/2π, so v = nh/(2πmr)  …(ii)",
       "Substitute (ii) into (i) and solve for r: r = n²h²ε0/(πmZe²) — evaluating the constants gives rn = 0.529(n²/Z) Å",
       "From (ii), the orbital velocity is vn = 2πZe²/(nh·4πε0) = Ze²/(2ε0nh)",
       "Total energy = KE + PE = ½mv² − (1/4πε0)(Ze²/r). Using mv² from (i): KE = ½(1/4πε0)(Ze²/r), so En = ½(1/4πε0)(Ze²/r) − (1/4πε0)(Ze²/r) = −½(1/4πε0)(Ze²/r)",
       "Substituting the expression for r and evaluating the constants gives the standard numerical result"
     ],
     result:"rn = 0.529(n²/Z) Å; &nbsp; En = −13.6(Z²/n²) eV"}
  ]},

  {cls:"11", subject:"chemistry", chapter:"States of Matter", derivations:[
    {t:"Derivation of the Ideal Gas Equation (PV = nRT)",
     given:"Three experimentally established gas laws, each holding the other variables fixed: Boyle's Law (V ∝ 1/P at constant T, n), Charles's Law (V ∝ T at constant P, n), and Avogadro's Law (V ∝ n at constant T, P).",
     steps:[
       "Combine all three proportionalities into a single relation, since V depends on all three simultaneously: V ∝ nT/P",
       "Introduce a constant of proportionality R (the universal gas constant) to convert this into an equation: V = RnT/P"
     ],
     result:"PV = nRT"}
  ]},

  {cls:"11", subject:"chemistry", chapter:"Thermodynamics", derivations:[
    {t:"Derivation of ΔH = ΔU + ΔngRT",
     given:"Enthalpy is defined as H = U + PV. For a reaction at constant temperature and pressure, only gaseous species contribute significantly to any volume change.",
     steps:[
       "From the definition: ΔH = ΔU + Δ(PV)",
       "At constant pressure, Δ(PV) = PΔV",
       "For the gaseous components, applying the ideal gas law PV = nRT at constant T gives PΔV = (Δng)RT, where Δng is the change in moles of gas (products − reactants)"
     ],
     result:"ΔH = ΔU + ΔngRT"},
    {t:"Derivation of Work Done in Reversible Isothermal Expansion",
     given:"n moles of an ideal gas expand reversibly and isothermally from V1 to V2. Chemistry (IUPAC) convention: w is the work done ON the system, w = −∫PdV.",
     steps:[
       "w = −∫(V1 to V2) P dV, with P = nRT/V for an ideal gas (T constant throughout)",
       "w = −nRT∫(V1 to V2) dV/V = −nRT[lnV] from V1 to V2 = −nRT ln(V2/V1)",
       "Since V2 > V1 for an expansion, ln(V2/V1) is positive, making w negative — consistent with the gas doing work ON the surroundings during expansion, so the system loses energy as work (w<0 by the IUPAC convention)"
     ],
     result:"w = −nRT ln(V2/V1) = −2.303nRT log(V2/V1)"},
    {t:"Derivation of Work Done in Reversible Adiabatic Expansion",
     given:"n moles of an ideal gas expand reversibly and adiabatically (q=0), with temperature falling from T1 to T2.",
     steps:[
       "For an adiabatic process, q=0, so the first law ΔU=q+w simplifies to ΔU=w",
       "For an ideal gas, the internal energy change depends only on temperature: ΔU = nCv(T2−T1), regardless of the process path",
       "Since ΔU=w for this adiabatic process, substitute directly"
     ],
     result:"w = nCv(T2 − T1)"},
    {t:"Justification of the Gibbs Free Energy Equation",
     given:"Gibbs free energy is defined as G = H − TS, where H is enthalpy, T is absolute temperature, and S is entropy.",
     steps:[
       "At constant temperature, differentiate (take the change in) the defining equation: ΔG = ΔH − Δ(TS)",
       "Since T is constant, Δ(TS) = TΔS",
       "Substitute back into the expression for ΔG"
     ],
     result:"ΔG = ΔH − TΔS"}
  ]},

  {cls:"11", subject:"chemistry", chapter:"Equilibrium", derivations:[
    {t:"Derivation of the Relation Between Kp and Kc",
     given:"A gaseous reaction aA + bB ⇌ cC + dD, where every species obeys the ideal gas law so its partial pressure P = (n/V)RT = [concentration]×RT.",
     steps:[
       "By definition: Kp = (P_C^c · P_D^d) / (P_A^a · P_B^b)",
       "Substitute Pi = [i]RT for every species: Kp = ([C]RT)^c([D]RT)^d / ([A]RT)^a([B]RT)^b",
       "Separate the concentration terms from the RT terms: Kp = Kc × (RT)^[(c+d)−(a+b)]",
       "Let Δn = (c+d) − (a+b), the difference between moles of gaseous products and reactants"
     ],
     result:"Kp = Kc(RT)^Δn"},
    {t:"Derivation of the Henderson-Hasselbalch Equation",
     given:"A buffer solution of a weak acid HA and its salt (conjugate base A⁻), with dissociation equilibrium HA ⇌ H⁺ + A⁻ and dissociation constant Ka.",
     steps:[
       "Write the equilibrium constant expression: Ka = [H⁺][A⁻]/[HA]",
       "Rearrange to isolate [H⁺]: [H⁺] = Ka×[HA]/[A⁻]",
       "Take the negative logarithm of both sides: −log[H⁺] = −logKa − log([HA]/[A⁻])",
       "Recognise −log[H⁺] = pH and −logKa = pKa, and flip the fraction inside the log (which flips its sign): pH = pKa + log([A⁻]/[HA])",
       "For a buffer, [A⁻] ≈ [salt] and [HA] ≈ [acid] (the equilibrium shift from initial concentrations is negligible)"
     ],
     result:"pH = pKa + log([salt]/[acid])"},
    {t:"Derivation of Ostwald's Dilution Law",
     given:"A weak electrolyte AB dissociating as AB ⇌ A⁺ + B⁻, starting at initial concentration C with degree of dissociation α at equilibrium.",
     steps:[
       "Set up an ICE table: at equilibrium, [AB] = C(1−α), [A⁺] = Cα, [B⁻] = Cα",
       "Write the equilibrium constant expression: Ka = [A⁺][B⁻]/[AB]",
       "Substitute the equilibrium concentrations: Ka = (Cα)(Cα) / [C(1−α)] = Cα²/(1−α)",
       "For a weak electrolyte, α is small (α≪1), so (1−α)≈1, giving the simplified approximate form"
     ],
     result:"Ka = Cα²/(1−α) ≈ Cα², for α≪1"}
  ]},

  {cls:"12", subject:"chemistry", chapter:"Solutions", derivations:[
    {t:"Derivation of Relative Lowering of Vapour Pressure",
     given:"A solution of a non-volatile solute in a volatile solvent, obeying Raoult's Law: p = p°·xsolvent.",
     steps:[
       "Since there are only two components, xsolvent + xsolute = 1, so xsolvent = 1 − xsolute",
       "Substitute into Raoult's law: p = p°(1 − xsolute) = p° − p°·xsolute",
       "Rearranging: p° − p = p°·xsolute",
       "Divide both sides by p°"
     ],
     result:"(p° − p)/p° = xsolute"},
    {t:"Derivation of the Osmotic Pressure Equation",
     given:"Van't Hoff observed that dilute solutions obey a relation directly analogous to the ideal gas equation, with osmotic pressure π playing the role of gas pressure.",
     steps:[
       "Van't Hoff's analogy states: πV = nRT (exactly parallel in form to PV = nRT for an ideal gas)",
       "Rearrange to isolate π: π = (n/V)RT",
       "Recognise that n/V is simply the molar concentration C of the solution"
     ],
     result:"π = CRT"}
  ]},

  {cls:"12", subject:"chemistry", chapter:"Electrochemistry", derivations:[
    {t:"Derivation of the Nernst Equation",
     given:"The thermodynamic relation ΔG = ΔG° + RT ln Q, combined with the electrochemical relations ΔG = −nFE and ΔG° = −nFE°.",
     steps:[
       "Substitute the electrochemical relations into the thermodynamic one: −nFE = −nFE° + RT ln Q",
       "Divide throughout by −nF: E = E° − (RT/nF) ln Q",
       "Convert natural log to log base 10 (multiply by 2.303) and substitute T = 298 K, R = 8.314 J/mol·K, F = 96500 C/mol: (2.303RT)/(nF) = 0.0591/n"
     ],
     result:"E = E° − (0.0591/n) log Q &nbsp; (at 298 K)"},
    {t:"Derivation of the Relation Between Standard Cell Potential and Equilibrium Constant",
     given:"The Nernst equation E = E° − (0.0591/n)logQ, applied at the point where the cell reaction reaches equilibrium.",
     steps:[
       "At equilibrium, the cell can no longer do work, so E = 0. Also, the reaction quotient Q becomes equal to the equilibrium constant K at this point",
       "Substitute both conditions into the Nernst equation: 0 = E° − (0.0591/n)logK",
       "Rearrange to isolate logK"
     ],
     result:"logK = nE°/0.0591"},
    {t:"Derivation of the Relation Between Standard Cell Potential and Gibbs Free Energy",
     given:"The electrical work obtainable from a galvanic cell equals the decrease in Gibbs free energy of the cell reaction: ΔG = −nFE (general relation, valid at any E).",
     steps:[
       "This relation follows from equating the maximum electrical work (nFE, charge × potential) to the maximum non-expansion work available from the reaction, which thermodynamics identifies with −ΔG",
       "Apply this relation under standard conditions, where the cell potential is E°"
     ],
     result:"ΔG° = −nFE°"}
  ]},

  {cls:"12", subject:"chemistry", chapter:"Chemical Kinetics", derivations:[
    {t:"Derivation of the Integrated Rate Law (First Order)",
     given:"A first-order reaction where Rate = −d[A]/dt = k[A].",
     steps:[
       "Separate variables: −d[A]/[A] = k·dt",
       "Integrate the left side from [A]0 (at t=0) to [A] (at time t), and the right side from 0 to t: −∫([A]0→[A]) d[A]/[A] = k∫(0→t) dt",
       "Evaluating: −(ln[A] − ln[A]0) = kt, i.e. ln([A]0/[A]) = kt",
       "Convert natural log to log base 10 by multiplying by 2.303"
     ],
     result:"k = (2.303/t) log([A]0/[A])"},
    {t:"Derivation of Half-Life for a First-Order Reaction",
     given:"The integrated first-order rate law: k = (2.303/t)log([A]0/[A]).",
     steps:[
       "At the half-life t½, exactly half the original concentration remains: [A] = [A]0/2",
       "Substitute into the integrated rate law: k = (2.303/t½)log([A]0/([A]0/2)) = (2.303/t½)log(2)",
       "Since log(2) = 0.301: k = (2.303×0.301)/t½ = 0.693/t½",
       "Rearrange to isolate t½"
     ],
     result:"t½ = 0.693/k &nbsp; (independent of initial concentration)"},
    {t:"Derivation of the Integrated Rate Law (Zero Order)",
     given:"A zero-order reaction where Rate = −d[A]/dt = k (a constant, independent of concentration).",
     steps:[
       "Separate variables: −d[A] = k·dt",
       "Integrate the left side from [A]0 to [A], and the right side from 0 to t: −([A] − [A]0) = kt"
     ],
     result:"[A] = [A]0 − kt"},
    {t:"Derivation of Half-Life for a Zero-Order Reaction",
     given:"The integrated zero-order rate law: [A] = [A]0 − kt.",
     steps:[
       "At the half-life t½: [A] = [A]0/2",
       "Substitute: [A]0/2 = [A]0 − kt½",
       "Rearrange: kt½ = [A]0 − [A]0/2 = [A]0/2"
     ],
     result:"t½ = [A]0/2k &nbsp; (DOES depend on initial concentration, unlike first order)"},
    {t:"Linearisation of the Arrhenius Equation",
     given:"The Arrhenius equation k = Ae^(−Ea/RT), used to determine activation energy experimentally.",
     steps:[
       "Take the natural logarithm of both sides: ln k = ln A + ln[e^(−Ea/RT)] = ln A − Ea/RT",
       "This equation has the form y = mx + c, with y = ln k, x = 1/T, slope m = −Ea/R, and intercept c = ln A",
       "Plotting experimental ln k values against 1/T therefore gives a straight line, whose slope directly yields Ea"
     ],
     result:"ln k = ln A − Ea/RT"}
  ]},

  {cls:"12", subject:"chemistry", chapter:"Solid State", derivations:[
    {t:"Derivation of the Density of a Unit Cell",
     given:"A unit cell with Z atoms, edge length a, and molar mass M for the substance.",
     steps:[
       "Mass of one atom = M/NA (molar mass divided by Avogadro's number)",
       "Mass of the unit cell = Z × (mass of one atom) = ZM/NA",
       "Volume of the (cubic) unit cell = a³",
       "Density = mass/volume"
     ],
     result:"ρ = ZM / (NA·a³)"},
    {t:"Derivation of Packing Efficiency — Simple Cubic",
     given:"A simple cubic unit cell, atoms of radius r touching along the edge, so edge length a = 2r. Number of atoms per unit cell Z = 1 (8 corners × 1/8).",
     steps:[
       "Volume occupied by atoms = Z × (4/3)πr³ = (4/3)πr³",
       "Volume of the unit cell = a³ = (2r)³ = 8r³",
       "Packing efficiency = (volume occupied / volume of cell) × 100 = [(4/3)πr³ / 8r³] × 100"
     ],
     result:"Packing efficiency = (π/6) × 100 ≈ 52.4%"},
    {t:"Derivation of Packing Efficiency — Body-Centred Cubic (BCC)",
     given:"A BCC unit cell, atoms touching along the body diagonal: body diagonal = 4r = √3·a, so a = 4r/√3. Number of atoms per unit cell Z = 2 (8 corners × 1/8, plus 1 body-centre).",
     steps:[
       "Volume occupied by atoms = Z × (4/3)πr³ = 2 × (4/3)πr³ = (8/3)πr³",
       "Volume of the unit cell = a³ = (4r/√3)³ = 64r³/(3√3)",
       "Packing efficiency = [(8/3)πr³] / [64r³/(3√3)] × 100 = [8π√3/64] × 100"
     ],
     result:"Packing efficiency = (π√3/8) × 100 ≈ 68%"},
    {t:"Derivation of Packing Efficiency — Face-Centred Cubic (FCC)",
     given:"An FCC unit cell, atoms touching along the face diagonal: face diagonal = 4r = √2·a, so a = 2√2·r. Number of atoms per unit cell Z = 4 (8 corners × 1/8, plus 6 faces × 1/2).",
     steps:[
       "Volume occupied by atoms = Z × (4/3)πr³ = 4 × (4/3)πr³ = (16/3)πr³",
       "Volume of the unit cell = a³ = (2√2r)³ = 16√2 r³",
       "Packing efficiency = [(16/3)πr³] / [16√2 r³] × 100 = [π/(3√2)] × 100"
     ],
     result:"Packing efficiency = [π/(3√2)] × 100 ≈ 74%"}
  ]},

  {cls:"11", subject:"math", chapter:"Quadratic Equations", derivations:[
    {t:"Derivation of the Quadratic Formula",
     given:"A general quadratic equation ax² + bx + c = 0, with a ≠ 0, solved by completing the square.",
     steps:[
       "Divide throughout by a: x² + (b/a)x + c/a = 0",
       "Move the constant to the right: x² + (b/a)x = −c/a",
       "Complete the square by adding (b/2a)² to both sides: x² + (b/a)x + (b/2a)² = (b/2a)² − c/a",
       "The left side is now a perfect square: (x + b/2a)² = (b² − 4ac)/4a²",
       "Take the square root of both sides: x + b/2a = ±√(b² − 4ac)/2a"
     ],
     result:"x = [−b ± √(b² − 4ac)] / 2a"}
  ]},

  {cls:"11", subject:"math", chapter:"Sequences & Series", derivations:[
    {t:"Derivation of the Sum of n Terms of an AP",
     given:"An AP with first term a and common difference d: a, a+d, a+2d, …, a+(n−1)d.",
     steps:[
       "Write the sum forwards: Sn = a + (a+d) + (a+2d) + … + [a+(n−1)d]",
       "Write the same sum backwards: Sn = [a+(n−1)d] + [a+(n−2)d] + … + a",
       "Add the two versions term by term — each pair sums to the same value, [2a+(n−1)d], and there are n such pairs: 2Sn = n[2a + (n−1)d]"
     ],
     result:"Sn = (n/2)[2a + (n−1)d]"},
    {t:"Derivation of the Sum of n Terms of a GP",
     given:"A GP with first term a and common ratio r: a, ar, ar², …, ar^(n−1).",
     steps:[
       "Write the sum: Sn = a + ar + ar² + … + ar^(n−1)",
       "Multiply throughout by r: rSn = ar + ar² + … + ar^n",
       "Subtract the second equation from the first — all the middle terms cancel: Sn − rSn = a − ar^n",
       "Factor both sides: Sn(1 − r) = a(1 − r^n)"
     ],
     result:"Sn = a(rⁿ − 1) / (r − 1)"},
    {t:"Derivation of the Sum of an Infinite GP",
     given:"The finite-sum formula Sn = a(1 − rⁿ)/(1 − r), for |r| < 1.",
     steps:[
       "As n → ∞, since |r| < 1, the term rⁿ shrinks toward 0 (each multiplication by r makes it smaller in magnitude)",
       "Taking the limit of Sn as n → ∞: S∞ = lim(n→∞) a(1 − rⁿ)/(1 − r) = a(1 − 0)/(1 − r)"
     ],
     result:"S∞ = a / (1 − r), valid only for |r| < 1"}
  ]},

  {cls:"11", subject:"math", chapter:"Trigonometric Functions", derivations:[
    {t:"Derivation of Trigonometric Sum & Difference Formulae",
     given:"Four points on the unit circle: P1=(cosx,sinx), P2=(cosy,siny), P3=(cos(x−y),sin(x−y)), and P4=(1,0). The angle ∠P1OP2 = x−y, which equals ∠P4OP3.",
     steps:[
       "Since equal angles at the centre of a circle subtend equal chords, chord P1P2 = chord P4P3, so P1P2² = P4P3²",
       "By the distance formula: P1P2² = (cosx−cosy)² + (sinx−siny)² = 2 − 2(cosx cosy + sinx siny), using sin²+cos²=1",
       "Similarly: P4P3² = (1−cos(x−y))² + (0−sin(x−y))² = 2 − 2cos(x−y)",
       "Equating the two: 2 − 2(cosx cosy + sinx siny) = 2 − 2cos(x−y), which gives cos(x−y) = cosx cosy + sinx siny",
       "Replace y with −y (using cos(−y)=cosy, sin(−y)=−siny) to get: cos(x+y) = cosx cosy − sinx siny",
       "For sin(x+y), use the co-function identity sin(x+y) = cos(π/2 − (x+y)) = cos((π/2−x) − y), then expand with the cos(x−y) formula: = cos(π/2−x)cosy + sin(π/2−x)siny = sinx cosy + cosx siny",
       "Replace y with −y in the sin(x+y) result to get: sin(x−y) = sinx cosy − cosx siny"
     ],
     result:"cos(x∓y) = cosx cosy ± sinx siny; sin(x±y) = sinx cosy ± cosx siny"},
    {t:"Derivation of the Sine Rule",
     given:"A triangle ABC with sides a, b, c opposite to angles A, B, C respectively, and circumradius R.",
     steps:[
       "Drop a perpendicular from vertex A to side BC (or its extension), meeting it at D, with AD = h",
       "In right triangle ABD: h = c·sinB. In right triangle ACD: h = b·sinC",
       "Equating the two expressions for h: c·sinB = b·sinC, which rearranges to b/sinB = c/sinC",
       "Repeating the construction by dropping a perpendicular from a different vertex gives a/sinA = b/sinB as well",
       "Combining both results: a/sinA = b/sinB = c/sinC",
       "A separate construction — drawing the diameter through one vertex and using the property that any angle in a semicircle is 90° — shows this common ratio equals exactly 2R"
     ],
     result:"a/sinA = b/sinB = c/sinC = 2R"},
    {t:"Derivation of the Cosine Rule",
     given:"A triangle with vertex A at the origin, side AB = c along the x-axis, and side AC = b at angle A to AB.",
     steps:[
       "Coordinates: A = (0,0), B = (c,0), C = (b cosA, b sinA)",
       "Side a = BC, so by the distance formula: a² = (c − b cosA)² + (b sinA)²",
       "Expand: a² = c² − 2bc cosA + b²cos²A + b²sin²A",
       "Using cos²A + sin²A = 1: a² = c² + b² − 2bc cosA",
       "Rearrange to isolate cosA"
     ],
     result:"cosA = (b² + c² − a²) / 2bc"}
  ]},

  {cls:"11", subject:"math", chapter:"Straight Lines", derivations:[
    {t:"Derivation of the Distance of a Point from a Line",
     given:"A line Ax + By + C = 0 and a point (x1, y1) not on the line.",
     steps:[
       "The foot of the perpendicular from (x1,y1) to the line, call it (h,k), lies along the direction (A,B) — the normal to the line",
       "Parametrise: h = x1 + λA, k = y1 + λB for some scalar λ",
