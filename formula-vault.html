     sym:[],
     cases:["Body-centred cubic (BCC): r = √3a/4","Face-centred cubic (FCC): r = √2a/4"],
     tip:"These come directly from the geometry of atoms touching along the cell's body diagonal (BCC) or face diagonal (FCC)."},
    {t:"Coordination Number by Lattice Type", eq:"Simple cubic: 6",
     sym:[],
     cases:["Body-centred cubic (BCC): 8","Close-packed (FCC/HCP): 12"],
     tip:"Coordination number is how many nearest neighbours touch a given atom — it rises as packing gets more efficient."},
    {t:"Radius Ratio Rule (Voids)", eq:"Tetrahedral void: r<sup>+</sup>/r<sup>−</sup> = 0.225 − 0.414",
     sym:[["r+/r−","Ratio of cation to anion radius"]],
     cases:["Triangular void (CN=3): 0.155 − 0.225","Octahedral void (CN=6): 0.414 − 0.732","Cubic void (CN=8): 0.732 − 1.000"],
     tip:"As the cation:anion size ratio grows, it fits into progressively higher-coordination voids — this is what determines which crystal structure a compound adopts."},
    {t:"Number of Voids in a Close-Packed Structure", eq:"Octahedral voids = N",
     sym:[["N","Number of atoms in the close-packed arrangement"]],
     cases:["Tetrahedral voids = 2N","For FCC (Z=4 per unit cell): 4 octahedral voids, 8 tetrahedral voids"],
     tip:"There are always exactly twice as many tetrahedral voids as octahedral voids in any close-packed (ccp/hcp) structure — an easy, frequently tested ratio."},
    {t:"Void Radius as a Fraction of Atomic Radius", eq:"Octahedral void: r(void) = 0.414 × r(atom)",
     sym:[],
     cases:["Tetrahedral void: r(void) = 0.225 × r(atom)"],
     tip:"These are just the lower limiting values from the radius-ratio rule, restated directly as a fraction of the atomic radius — the form most numericals actually ask for."},
    {t:"Seven Crystal Systems — Axial Parameters", eq:"Cubic: a=b=c, α=β=γ=90°",
     sym:[],
     cases:["Tetragonal: a=b≠c, α=β=γ=90°","Orthorhombic: a≠b≠c, α=β=γ=90°","Monoclinic: a≠b≠c, α=γ=90°≠β","Triclinic: a≠b≠c, α≠β≠γ≠90°","Hexagonal: a=b≠c, α=β=90°, γ=120°","Rhombohedral: a=b=c, α=β=γ≠90°"],
     tip:"Cubic is the most symmetric (all sides equal, all angles 90°); triclinic is the least symmetric — everything is unequal."},
    {t:"Bragg's Law", eq:"nλ = 2d sinθ",
     sym:[["d","Interplanar spacing"],["θ","Angle of diffraction"],["n","Order of diffraction"]], tip:"Foundation of X-ray crystallography — used to determine unit cell dimensions experimentally."},
    {t:"Packing Efficiency", eq:"Simple cubic: 52.4%",
     sym:[],
     cases:["Body-centred cubic: 68%", "Face-centred cubic / close-packed: 74%"],
     tip:"Memorise all three — frequently tested as direct recall, and needed to compare how 'open' different structures are."},
    {t:"Interplanar Spacing (Miller Indices)", eq:"d<sub>hkl</sub> = " + frac("a","√(h² + k² + l²)"),
     sym:[["a","Edge length of the cubic unit cell"],["(hkl)","Miller indices of the plane"]], tip:"Combine with Bragg's law (nλ=2d sinθ) to predict exactly which diffraction angles a given crystal plane will produce."},
    {t:"Point Defects and Density Effects", eq:"Schottky: equal numbers of cation and anion vacancies",
     sym:[],
     cases:["Schottky defect: DECREASES density (ions are missing entirely)","Frenkel defect: NO change in density (an ion just moves to an interstitial site)","Metal excess defect (F-centres): produces colour in the crystal","Metal deficiency defect: creates cation vacancies, giving p-type semiconduction"],
     tip:"Schottky is favoured when cation and anion are similar in size; Frenkel when there's a large size difference, since the smaller ion can fit into an interstitial site."}
  ]},

  {cls:"12", subject:"chemistry", chapter:"Coordination Compounds", formulas:[
    {t:"Effective Atomic Number", eq:"EAN = Z − O.S. + 2 × CN",
     sym:[["Z","Atomic number of metal"],["O.S.","Oxidation state of metal"],["CN","Coordination number"]], tip:"Complexes with EAN equal to the next noble gas's atomic number tend to be especially stable (EAN rule)."},
    {t:"Magnetic Moment", eq:"μ = √(n(n + 2)) BM",
     sym:[["n","Number of unpaired electrons"]], tip:"Compare calculated μ with experimental value to determine whether a complex is high-spin or low-spin."},
    {t:"CFSE (Octahedral Complex)", eq:"CFSE = −0.4Δ<sub>o</sub>·n(t<sub>2g</sub>) + 0.6Δ<sub>o</sub>·n(e<sub>g</sub>)",
     sym:[["Δo","Octahedral crystal field splitting energy"]],
     cases:["Tetrahedral: CFSE = −0.6Δt·n(e) + 0.4Δt·n(t2)","Add pairing energy P for each electron pair forced together in a low-spin arrangement"],
     tip:"Strong field ligands (high Δo) favour low-spin configurations by filling t2g before eg, per the spectrochemical series."},
    {t:"Tetrahedral–Octahedral Splitting Relation", eq:"Δ<sub>t</sub> = " + frac("4","9") + "Δ<sub>o</sub>",
     sym:[], tip:"Δt is always smaller than Δo for the same metal/ligand — this is why tetrahedral complexes are almost always high-spin."},
    {t:"Jahn–Teller Distortion Condition", eq:"Occurs when t<sub>2g</sub> or e<sub>g</sub> is asymmetrically filled",
     sym:[],
     cases:["Strong distortion: uneven eg occupancy (e.g. d⁴ high-spin, d⁹ — as in Cu²⁺)","Weak distortion: uneven t2g occupancy"],
     tip:"eg orbitals point directly at the ligands, so uneven filling there causes a much stronger distortion than uneven t2g filling does."},
    {t:"Spectrochemical Series (Ligand Field Strength)", eq:"I⁻ &lt; Br⁻ &lt; Cl⁻ &lt; F⁻ &lt; OH⁻ &lt; H<sub>2</sub>O &lt; NH<sub>3</sub> &lt; en &lt; NO<sub>2</sub>⁻ &lt; CN⁻ &lt; CO",
     sym:[], tip:"Weak-field ligands (left) give high-spin complexes; strong-field ligands (right) give low-spin — CN⁻ and CO are the strongest, producing the largest Δo."},
    {t:"Geometrical and Optical Isomer Counts", eq:"Ma<sub>4</sub>b<sub>2</sub> (octahedral): 2 geometrical isomers (cis, trans)",
     sym:[["M","Central metal"],["a, b, c","Monodentate ligands"],["AA","Symmetrical bidentate ligand"]],
     cases:["Ma3b3: 2 isomers (facial, meridional)","Ma2b2c2: 6 geometrical isomers","M(AA)2b2: 3 isomers (cis form is optically active)","M(AA)3: 2 optical isomers (d and l)"],
     tip:"Optical activity requires the complex to lack any plane of symmetry — the trans forms are almost always optically inactive, while cis forms often are active."}
  ]},

  {cls:"12", subject:"chemistry", chapter:"Surface Chemistry", formulas:[
    {t:"Freundlich Adsorption Isotherm", eq:"x/m = kP<sup>1/n</sup>",
     sym:[["x/m","Mass adsorbed per unit mass of adsorbent"],["P","Equilibrium pressure"],["k, n","Empirical constants (n > 1)"]],
     cases:["Logarithmic (linear) form: log(x/m) = log k + (1/n) log P"],
     tip:"Taking logs gives log(x/m) = log k + (1/n)log P — a straight-line plot used to determine k and n experimentally."},
    {t:"Langmuir Adsorption Isotherm", eq:"x/m = " + frac("aP","1 + bP"),
     sym:[["a, b","Langmuir constants"]],
     cases:["Low pressure (bP ≪ 1): x/m ∝ P (linear region)","High pressure (bP ≫ 1): x/m = a/b (saturated monolayer)"],
     tip:"At low pressure x/m ∝ P (linear); at high pressure x/m becomes constant — surface saturates with a monolayer."},
    {t:"Hardy–Schulze Rule (Coagulating Power)", eq:"Coagulating power ∝ (valency)<sup>6</sup>",
     sym:[],
     cases:["Coagulating power order for cations: Al³⁺ > Ba²⁺ > Na⁺","Coagulation value = minimum millimoles of electrolyte per litre needed to coagulate the sol"],
     tip:"Coagulating power and coagulation VALUE are inverses — a highly effective ion has high coagulating power but a low coagulation value."},
    {t:"Gold Number", eq:"Gold number = mg of lyophilic colloid needed to just prevent coagulation of 10 mL gold sol",
     sym:[],
     cases:["Lower gold number ⇒ GREATER protective power"],
     tip:"Gelatin has a very low gold number (0.005–0.01), making it one of the most effective protective colloids known."},
    {t:"Critical Micelle Concentration (CMC)", eq:"Micelles form only above the CMC and above the Kraft temperature",
     sym:[["CMC","Critical micelle concentration"],["Kraft temperature","Minimum temperature for micelle formation"]], tip:"Below either threshold, surfactant molecules stay dispersed as individual ions and cannot perform their cleansing action."}
  ]},

  /* =========================================================
     CLASS 12 :: MATHEMATICS  (9 chapters)
     ========================================================= */
  {cls:"12", subject:"math", chapter:"Matrices & Determinants", formulas:[
    {t:"Determinant of a 2×2 Matrix", eq:"|A| = ad − bc",
     sym:[], tip:"A 2×2 matrix is invertible if and only if |A| ≠ 0 — always check this before attempting to find an inverse."},
    {t:"Determinant of a Product", eq:"|AB| = |A|·|B|",
     sym:[],
     cases:["|kA| = kⁿ|A|, for an n×n matrix A"],
     tip:"Lets you evaluate the determinant of a product without ever multiplying the matrices out."},
    {t:"Inverse of a Matrix", eq:"A<sup>−1</sup> = " + frac("1","|A|") + " adj(A)",
     sym:[["adj(A)","Adjoint = transpose of cofactor matrix"]], tip:"A⁻¹ exists only when |A| ≠ 0 — such matrices are called non-singular."},
    {t:"Area of a Triangle (Determinant Form)", eq:"Area = " + frac("1","2") + "|Δ|",
     sym:[["Δ","3×3 determinant of vertices with a 1 in the third column"]], tip:"If the determinant evaluates to zero, the three points are collinear — a fast collinearity test."},
    {t:"Cramer's Rule", eq:"x = D<sub>x</sub>/D, y = D<sub>y</sub>/D, z = D<sub>z</sub>/D",
     sym:[["D","Determinant of coefficient matrix"]], tip:"If D = 0 but Dx, Dy, Dz aren't all zero, the system has no solution; if all are zero, it has infinite solutions."},
    {t:"Symmetric–Skew-Symmetric Decomposition", eq:"A = " + frac("1","2") + "(A + A<sup>T</sup>) + " + frac("1","2") + "(A − A<sup>T</sup>)",
     sym:[["Aᵀ","Transpose of A"]], tip:"The first part is always symmetric, the second always skew-symmetric — every square matrix splits uniquely this way."},
    {t:"Transpose of a Product", eq:"(AB)<sup>T</sup> = B<sup>T</sup>A<sup>T</sup>",
     sym:[], tip:"Notice the order reverses — a very common slip is writing AᵀBᵀ instead."},
    {t:"Special Types of Matrices", eq:"Orthogonal: AA<sup>T</sup> = I",
     sym:[],
     cases:["Idempotent: A² = A","Nilpotent: Aᵏ = 0 for some positive integer k","Involutory: A² = I"],
     tip:"For an orthogonal matrix, A⁻¹ = Aᵀ automatically — a very useful shortcut, since it means you never need to compute the inverse the long way."},
    {t:"Trace Properties", eq:"Tr(AB) = Tr(BA)",
     sym:[["Tr","Sum of the diagonal elements"]], tip:"Holds even though AB ≠ BA in general — trace is one of the few quantities that IS order-independent for a matrix product."},
    {t:"Extended Adjoint Properties", eq:"|adj(A)| = |A|<sup>n−1</sup> &nbsp;(for an n×n matrix)",
     sym:[],
     cases:["adj(AB) = adj(B)·adj(A)","|adj(adj A)| = |A|^((n−1)²)","adj(adj A) = |A|^(n−2)·A"],
     tip:"Notice adj(AB) reverses order too, just like the transpose of a product — a useful pattern to remember together."}
  ]},

  {cls:"12", subject:"math", chapter:"Limits, Continuity & Differentiability", formulas:[
    {t:"Standard Trig Limit", eq:"lim<sub>x→0</sub> " + frac("sinx","x") + " = 1",
     sym:[], tip:"Foundation for most trigonometric limit problems — manipulate the expression algebraically until it matches this form."},
    {t:"Standard Exponential Limit", eq:"lim<sub>x→0</sub>(1 + x)<sup>1/x</sup> = e",
     sym:[], tip:"Equivalently, lim(1 + 1/n)ⁿ = e as n → ∞ — recognise both forms, they appear interchangeably in JEE."},
    {t:"Standard Log Limit", eq:"lim<sub>x→0</sub> " + frac("e<sup>x</sup> − 1","x") + " = 1",
     sym:[], tip:"Companion limit: lim(ln(1+x)/x) = 1 as x → 0 — both are frequently combined in the same problem."},
    {t:"First Principles Derivative", eq:"f′(x) = lim<sub>h→0</sub> " + frac("f(x+h) − f(x)","h"),
     sym:[], tip:"Also called the ab-initio method — JEE occasionally demands derivation from this definition rather than direct rules."},
    {t:"L'Hôpital's Rule", eq:"lim " + frac("f(x)","g(x)") + " = lim " + frac("f′(x)","g′(x)"),
     sym:[], tip:"Only applicable to 0/0 or ∞/∞ indeterminate forms — always check the form first, and reapply if still indeterminate."},
    {t:"1^∞ Indeterminate Form", eq:"lim<sub>x→a</sub> f(x)<sup>g(x)</sup> = e<sup>lim g(x)[f(x)−1]</sup>",
     sym:[["f(x)→1, g(x)→∞","As x→a, giving the 1^∞ indeterminate form"]], tip:"Recognise this form whenever the base tends to 1 and the exponent tends to infinity — trying to evaluate it directly (as 1^∞) is meaningless without this formula."}
  ]},

  {cls:"12", subject:"math", chapter:"Differentiation", formulas:[
    {t:"Power Rule", eq:"" + frac("d","dx") + "(xⁿ) = nx<sup>n−1</sup>",
     sym:[], tip:"The most-used differentiation rule of all — works for any real exponent n, including negative and fractional powers."},
    {t:"Derivatives of Trigonometric Functions", eq:"" + frac("d","dx") + "(sinx) = cosx",
     sym:[],
     cases:["d/dx(cosx) = −sinx","d/dx(tanx) = sec²x","d/dx(cotx) = −cosec²x","d/dx(secx) = secx·tanx","d/dx(cosecx) = −cosecx·cotx"],
     tip:"Notice the pattern: 'co-' functions (cos, cot, cosec) always differentiate to something negative."},
    {t:"Derivatives of Exponential & Logarithmic Functions", eq:"" + frac("d","dx") + "(eˣ) = eˣ",
     sym:[],
     cases:["d/dx(ln x) = 1/x", "d/dx(aˣ) = aˣ ln a"],
     tip:"eˣ is the unique function that is its own derivative — this is precisely why it's the natural base for calculus."},
    {t:"Derivatives of Inverse Trigonometric Functions", eq:"" + frac("d","dx") + "(sin<sup>−1</sup>x) = " + frac("1","√(1−x²)"),
     sym:[],
     cases:["d/dx(cos⁻¹x) = −1/√(1−x²)","d/dx(tan⁻¹x) = 1/(1+x²)","d/dx(cot⁻¹x) = −1/(1+x²)","d/dx(sec⁻¹x) = 1/(|x|√(x²−1))","d/dx(cosec⁻¹x) = −1/(|x|√(x²−1))"],
     tip:"Each cofunction pair (sin⁻¹/cos⁻¹, tan⁻¹/cot⁻¹, sec⁻¹/cosec⁻¹) has derivatives that are exact negatives of each other — halves the memorising."},
    {t:"Product Rule", eq:"" + frac("d","dx") + "(uv) = u′v + uv′",
     sym:[["u, v","Functions of x"]], tip:"Extends to three functions as (uvw)′ = u′vw + uv′w + uvw′ — differentiate one factor at a time, keep the rest unchanged."},
    {t:"Quotient Rule", eq:"" + frac("d","dx") + "(" + frac("u","v") + ") = " + frac("u′v − uv′","v²"),
     sym:[], tip:"Remember the order in the numerator (u′v − uv′, not the reverse) — a very common sign-error source."},
    {t:"Chain Rule", eq:"" + frac("dy","dx") + " = " + frac("dy","du") + " · " + frac("du","dx"),
     sym:[["u","Intermediate function"]], tip:"Used for every composite function — peel off one 'layer' of the function at a time, from outside in."}
  ]},

  {cls:"12", subject:"math", chapter:"Inverse Trigonometric Functions", formulas:[
    {t:"Sine–Cosine Complement", eq:"sin<sup>−1</sup>x + cos<sup>−1</sup>x = π/2",
     sym:[["x","x ∈ [−1, 1]"]], tip:"Every inverse trig cofunction pair adds up to π/2 — the same pattern holds for tan/cot and sec/cosec."},
    {t:"Tangent–Cotangent Complement", eq:"tan<sup>−1</sup>x + cot<sup>−1</sup>x = π/2",
     sym:[], tip:"Unlike sin⁻¹/cos⁻¹, this identity holds for ALL real x — no domain restriction needed."},
    {t:"Secant–Cosecant Complement", eq:"sec<sup>−1</sup>x + cosec<sup>−1</sup>x = π/2",
     sym:[], tip:"Valid for |x| ≥ 1, the natural domain of both functions."},
    {t:"Addition Formula for tan⁻¹", eq:"tan<sup>−1</sup>x + tan<sup>−1</sup>y = tan<sup>−1</sup>" + frac("x + y","1 − xy"),
     sym:[],
     cases:["sin⁻¹(sinx) = x only for x ∈ [−π/2, π/2] — outside this range, reduce x to an equivalent angle in this interval first"],
     tip:"Only valid when xy < 1 — add π (or subtract, depending on sign) to the result when xy > 1."}
  ]},

  {cls:"12", subject:"math", chapter:"Application of Derivatives", formulas:[
    {t:"Equation of Tangent", eq:"y − y<sub>1</sub> = f′(x<sub>1</sub>)(x − x<sub>1</sub>)",
     sym:[["f′(x1)","Slope of the curve at the point"]], tip:"The tangent line touches the curve at exactly that point and matches its instantaneous slope there."},
    {t:"Equation of Normal", eq:"y − y<sub>1</sub> = −" + frac("1","f′(x<sub>1</sub>)") + "(x − x<sub>1</sub>)",
     sym:[], tip:"Normal is perpendicular to the tangent — undefined when f′(x1) = 0, in which case the normal is simply vertical."},
    {t:"Length of Tangent, Normal, Subtangent, Subnormal", eq:"Length of tangent = |y√(1+(dx/dy)²)|",
     sym:[],
     cases:["Length of normal = |y√(1+(dy/dx)²)|","Subtangent = |y(dx/dy)|","Subnormal = |y(dy/dx)|"],
     tip:"Subtangent and subnormal are the projections of the tangent/normal segments onto the x-axis — their product equals y² exactly."},
    {t:"Angle Between Two Curves", eq:"tanθ = |" + frac("m<sub>1</sub> − m<sub>2</sub>","1 + m<sub>1</sub>m<sub>2</sub>") + "|",
     sym:[["m1, m2","Slopes (dy/dx) of the two curves at their point of intersection"]], tip:"Curves are said to be orthogonal when they intersect at 90°, i.e. when m1·m2 = −1 at every intersection point."},
    {t:"Approximation (Small Change)", eq:"Δy ≈ f′(x)·Δx",
     sym:[["Δx","Small change in x"]], tip:"Used to estimate f(x + Δx) ≈ f(x) + f′(x)Δx without directly evaluating the function at the new point."},
    {t:"Second Derivative Test", eq:"f′(x) = 0 and f″(x) &lt; 0 ⇒ maxima; f″(x) &gt; 0 ⇒ minima",
     sym:[], tip:"If f″(x) = 0 too, the test is inconclusive — fall back on checking the sign change of f′(x) around that point."},
    {t:"Rolle's / Mean Value Theorem", eq:"f′(c) = " + frac("f(b) − f(a)","b − a"),
     sym:[["c","Some point in (a, b)"]], tip:"Rolle's theorem is the special case where f(a) = f(b), making f′(c) = 0 — used to prove roots of derivatives exist."},
    {t:"Monotonicity Test", eq:"f′(x) &gt; 0 ⇒ increasing &nbsp;&nbsp; f′(x) &lt; 0 ⇒ decreasing",
     sym:[], tip:"Check f′(x) at a test point in each interval between the critical points — this is how you build the full increasing/decreasing chart for a function."}
  ]},

  {cls:"12", subject:"math", chapter:"Integrals", formulas:[
    {t:"Power Rule of Integration", eq:"∫xⁿdx = " + frac("x<sup>n+1</sup>","n + 1") + " + C &nbsp; (n ≠ −1)",
     sym:[["C","Constant of integration"]], tip:"For n = −1, use ∫(1/x)dx = ln|x| + C instead — a very common exception students forget under time pressure."},
    {t:"Standard Integral — Inverse Tangent Form", eq:"∫" + frac("dx","x² + a²") + " = " + frac("1","a") + "tan<sup>−1</sup>" + frac("x","a") + " + C",
     sym:[], tip:"One of the most frequently used standard integrals — recognise this pattern instantly when you see x²+a² in a denominator."},
    {t:"Integration by Parts", eq:"∫uv dx = u∫v dx − ∫[u′∫v dx]dx",
     sym:[["u, v","Two functions of x"]], tip:"Choose u using ILATE priority (Inverse, Log, Algebraic, Trig, Exponential) to keep the resulting integral simpler."},
    {t:"King's Property (Definite Integrals)", eq:"∫<sub>a</sub><sup>b</sup> f(x)dx = ∫<sub>a</sub><sup>b</sup> f(a+b−x)dx",
     sym:[], tip:"One of the most powerful JEE tricks — try this substitution whenever a definite integral looks stuck."},
    {t:"Standard Integral — Exponential", eq:"∫e<sup>x</sup>dx = e<sup>x</sup> + C",
     sym:[],
     cases:["∫eˣ[f(x)+f′(x)]dx = eˣf(x) + C"],
     tip:"The bracketed pattern is a frequently tested pattern-recognition integral — spot it whenever a sum of a function and its derivative appears multiplied by eˣ."},
    {t:"Standard Integral — Inverse Sine Form", eq:"∫" + frac("dx","√(a² − x²)") + " = sin<sup>−1</sup>" + frac("x","a") + " + C",
     sym:[], tip:"Recognise a²−x² (not x²−a²) under a square root in the denominator — this is the signal to use this exact form."},
    {t:"Standard Integral — Logarithmic Forms", eq:"∫" + frac("dx","√(x² ± a²)") + " = ln|x + √(x² ± a²)| + C",
     sym:[],
     cases:["∫dx/(a² − x²) = (1/2a)·ln|(a+x)/(a−x)| + C"],
     tip:"The ± inside the root covers both x²+a² and x²−a² denominators with one formula — just substitute the correct sign."},
    {t:"Standard Integral — Radical Forms", eq:"∫√(a² − x²) dx = " + frac("x","2") + "√(a² − x²) + " + frac("a²","2") + "sin<sup>−1</sup>" + frac("x","a") + " + C",
     sym:[],
     cases:["∫√(x²−a²)dx = (x/2)√(x²−a²) − (a²/2)ln|x+√(x²−a²)| + C","∫√(x²+a²)dx = (x/2)√(x²+a²) + (a²/2)ln|x+√(x²+a²)| + C"],
     tip:"All three follow the same pattern: (x/2)×(the root) plus a constant×(inverse-sine or log term) — the sign inside just tracks which case you're in."},
    {t:"Integrating a Linear Numerator over a Quadratic", eq:"px + q = A(2ax + b) + B",
     sym:[["2ax+b","Derivative of the denominator ax²+bx+c"]],
     cases:["∫(px+q)dx/(ax²+bx+c) = A·ln|ax²+bx+c| + B·∫dx/(ax²+bx+c)"],
     tip:"Match coefficients to find A and B, then the integral splits cleanly into a log term plus one of the standard forms above."},
    {t:"Definite Integral of a Periodic Function", eq:"∫<sub>0</sub><sup>nT</sup> f(x)dx = n∫<sub>0</sub><sup>T</sup> f(x)dx",
     sym:[["T","Period of f(x)"],["n","Any positive integer"]], tip:"Each full period contributes the same area — this collapses a long integration range into just one period's worth of work."},
    {t:"Wallis' Formula", eq:"∫<sub>0</sub><sup>π/2</sup> sin<sup>n</sup>x cos<sup>m</sup>x dx = " + frac("[(n−1)(n−3)⋯][(m−1)(m−3)⋯]","(n+m)(n+m−2)⋯") + " × K",
     sym:[["K","π/2 if BOTH n and m are even; 1 otherwise"]], tip:"Saves you from repeated integration by parts for high powers of sine/cosine over exactly this interval — memorise the pattern rather than re-deriving it each time."},
    {t:"Leibniz Rule (Differentiation Under the Integral Sign)", eq:"" + frac("d","dx") + "∫<sub>g(x)</sub><sup>h(x)</sup> f(t)dt = f(h(x))h′(x) − f(g(x))g′(x)",
     sym:[], tip:"Use whenever both integration limits are functions of x — differentiate using both endpoints and their own derivatives, not just the upper one."}
  ]},

  {cls:"12", subject:"math", chapter:"Application of Integrals", formulas:[
    {t:"Area Under a Curve", eq:"A = ∫<sub>a</sub><sup>b</sup> y dx",
     sym:[["y = f(x)","The curve"]], tip:"Always sketch the curve first — area below the x-axis comes out negative and needs its sign flipped before adding."},
    {t:"Area Between Two Curves", eq:"A = ∫<sub>a</sub><sup>b</sup> (f(x) − g(x)) dx",
     sym:[["f(x) ≥ g(x)","Upper and lower curves on [a,b]"]], tip:"Find intersection points first to get correct limits — these become your a and b."},
    {t:"Area with Respect to the y-axis", eq:"A = ∫<sub>c</sub><sup>d</sup> x dy",
     sym:[], tip:"Switch to integrating with respect to y whenever the region is more naturally bounded by horizontal strips."}
  ]},

  {cls:"12", subject:"math", chapter:"Differential Equations", formulas:[
    {t:"Variable Separable Form", eq:"∫" + frac("dy","g(y)") + " = ∫f(x)dx + C",
     sym:[["dy/dx = f(x)g(y)","Original differential equation"]], tip:"Always the first thing to check — if variables can be separated onto opposite sides, this is by far the fastest method."},
    {t:"Linear Differential Equation", eq:"y·(I.F.) = ∫Q·(I.F.) dx + C",
     sym:[["I.F.","Integrating factor = e^∫P dx"]], tip:"Applies to equations of the form dy/dx + Py = Q, where P and Q are functions of x only."},
    {t:"Homogeneous Differential Equation Substitution", eq:"y = vx &nbsp;⇒&nbsp; " + frac("dy","dx") + " = v + x" + frac("dv","dx"),
     sym:[], tip:"Use when dy/dx = f(y/x) — this substitution always converts it into a variable-separable equation in v and x."},
    {t:"Bernoulli's Differential Equation", eq:"" + frac("dy","dx") + " + Py = Qy<sup>n</sup>",
     sym:[["P, Q","Functions of x"],["n","Any real number ≠ 0, 1"]],
     cases:["Divide throughout by yⁿ, then substitute t = 1/y^(n−1) to reduce it to a standard linear differential equation in t"],
     tip:"After the substitution, solve exactly like any linear DE (find the integrating factor for t), then convert back to y at the end."}
  ]},

  {cls:"12", subject:"math", chapter:"Vectors & 3D Geometry", formulas:[
    {t:"Dot Product", eq:"a·b = |a||b|cosθ",
     sym:[["θ","Angle between vectors a and b"]], tip:"a·b = 0 (for non-zero vectors) means the vectors are perpendicular — the fastest way to test orthogonality."},
    {t:"Projection of a Vector", eq:"Scalar projection of a on b = " + frac("a·b","|b|"),
     sym:[],
     cases:["Vector projection = (a·b/|b|²) b"],
     tip:"Geometrically, this is the 'shadow' length of a cast along the direction of b — negative if the angle between them is obtuse."},
    {t:"Cross Product Magnitude", eq:"|a × b| = |a||b|sinθ",
     sym:[], tip:"|a × b| also equals the area of the parallelogram formed by a and b — directly usable for triangle/parallelogram area problems."},
    {t:"Scalar Triple Product", eq:"[a b c] = a·(b × c)",
     sym:[], tip:"Equals zero exactly when a, b, c are coplanar — a standard test for coplanarity of three vectors."},
    {t:"Direction Cosines Relation", eq:"l² + m² + n² = 1",
     sym:[["l, m, n","Direction cosines of a line"]], tip:"Direction ratios (a,b,c) are proportional to (l,m,n) — divide by √(a²+b²+c²) to convert ratios into cosines."},
    {t:"Distance Between Two Points (3D)", eq:"d = √[(x<sub>2</sub>−x<sub>1</sub>)² + (y<sub>2</sub>−y<sub>1</sub>)² + (z<sub>2</sub>−z<sub>1</sub>)²]",
     sym:[], tip:"Direct 3D extension of the 2D distance formula — same Pythagorean idea, one more coordinate."},

  {cls:"11", subject:"physics", chapter:"Motion in a Straight Line", derivations:[
    {t:"Derivation of v = u + at",
     given:"A body starts with initial velocity u and moves with constant acceleration a for time t.",
     steps:[
       "By definition, acceleration is the rate of change of velocity: a = dv/dt",
       "Rearranging and separating variables: dv = a·dt",
       "Integrate the left side from v=u to v=v, and the right side from t=0 to t=t: ∫(u→v) dv = a∫(0→t) dt",
       "Evaluating both integrals: v − u = a(t − 0)"
     ],
     result:"v = u + at"},
    {t:"Derivation of s = ut + ½at²",
     given:"Using v = u + at from the first equation, where v = ds/dt.",
     steps:[
       "Write velocity as the rate of change of displacement: ds/dt = u + at",
       "Separate variables: ds = (u + at)dt",
       "Integrate the left side from s=0 to s=s, and the right side from t=0 to t=t: ∫(0→s) ds = ∫(0→t) (u+at) dt",
       "Evaluating: s = ut + ½at²"
     ],
     result:"s = ut + ½at²"},
    {t:"Derivation of v² = u² + 2as",
     given:"Using the chain rule to write acceleration in terms of displacement instead of time.",
     steps:[
       "Acceleration a = dv/dt = (dv/ds)(ds/dt) = v(dv/ds), since ds/dt = v",
       "Separate variables: a·ds = v·dv",
       "Integrate the left side from s=0 to s=s, and the right side from v=u to v=v: a∫(0→s) ds = ∫(u→v) v dv",
       "Evaluating: as = ½(v² − u²)"
     ],
     result:"v² = u² + 2as"}
  ]},

  {cls:"11", subject:"physics", chapter:"Motion in a Plane", derivations:[
    {t:"Derivation of Time of Flight (Projectile)",
     given:"A projectile launched with speed u at angle θ; vertical displacement y = u sinθ·t − ½gt².",
     steps:[
       "The projectile lands when it returns to the same vertical level, i.e. y = 0",
       "0 = u sinθ·t − ½gt², which factors as t(u sinθ − ½gt) = 0",
       "This gives t = 0 (the launch instant) or t = 2u sinθ/g (the landing instant)"

    {t:"Derivation of Maximum Height (Projectile)",
     given:"At maximum height, the vertical component of velocity momentarily becomes zero.",
     steps:[
       "Vertical velocity: vy = u sinθ − gt. Set vy = 0 to find the time to reach the top: t = u sinθ/g",
       "Substitute this t into y = u sinθ·t − ½gt²",
       "H = u sinθ·(u sinθ/g) − ½g·(u sinθ/g)² = u²sin²θ/g − u²sin²θ/2g"
     ],
     result:"H = u²sin²θ / 2g"},
    {t:"Derivation of Horizontal Range (Projectile)",
     given:"Range = horizontal velocity × total time of flight (horizontal velocity is unchanged throughout, since gravity acts only vertically).",
     steps:[
       "R = (u cosθ) × T, where T = 2u sinθ/g from the time-of-flight result",
       "R = u cosθ × (2u sinθ/g) = 2u²sinθ cosθ/g",
       "Using the identity 2sinθcosθ = sin2θ"
     ],
     result:"R = u²sin2θ / g"},
    {t:"Derivation of the Trajectory Equation (Projectile)",
     given:"A projectile launched with speed u at angle θ. Horizontal: x = (u cosθ)t. Vertical: y = (u sinθ)t − ½gt².",
     steps:[
       "From the horizontal equation, solve for time: t = x/(u cosθ)",
       "Substitute this into the vertical equation: y = u sinθ·[x/(u cosθ)] − ½g·[x/(u cosθ)]²",
       "Simplify the first term: u sinθ · x/(u cosθ) = x tanθ",
       "Simplify the second term: ½g·x²/(u²cos²θ)"
     ],
     result:"y = x tanθ − gx² / (2u²cos²θ)"},
    {t:"Derivation of Centripetal Acceleration",
     given:"A particle moves in a circle of radius r at constant speed v. Its velocity vector always stays perpendicular to its position vector.",
     steps:[
       "In a small time interval Δt, the particle sweeps a small angle Δθ = vΔt/r (since arc length = rΔθ = vΔt)",
       "Because the velocity vector is always perpendicular to the position vector, it rotates through this same small angle Δθ as the particle moves",
       "The velocity vector's magnitude stays v throughout, so the small change in velocity Δv (for small Δθ) has magnitude |Δv| ≈ v·Δθ (treating the tip of the rotating velocity vector as tracing a tiny arc of 'radius' v)",
       "Substitute Δθ = vΔt/r: |Δv| ≈ v·(vΔt/r) = v²Δt/r",
       "Acceleration a = lim(Δt→0) |Δv|/Δt = v²/r",
       "As Δt→0, the direction of Δv turns out to point exactly toward the centre of the circle"
     ],
     result:"ac = v²/r, directed toward the centre"}

  {cls:"11", subject:"physics", chapter:"Laws of Motion", derivations:[
