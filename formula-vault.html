     formulas:["F = (1/4πε0)(q1q2/r²)"],
     tip:"Force is attractive for unlike charges, repulsive for like charges — mathematically identical in form to Newton's law of gravitation, just with charge instead of mass."},
    {t:"Gauss's Law",
     statement:"The total electric flux through any closed surface is equal to 1/ε0 times the total charge enclosed by that surface.",
     terms:[["Φ","Electric flux"],["qenc","Charge enclosed by the Gaussian surface"]],
     formulas:["∮E·dA = qenc/ε0"],
     tip:"A far more powerful restatement of Coulomb's law for symmetric charge distributions — the field due to an infinite sheet, long wire, or spherical shell is derived from this law, not from Coulomb's law directly."}
  ]},

  {cls:"12", subject:"physics", chapter:"Current Electricity", laws:[
    {t:"Ohm's Law",
     statement:"At constant temperature and physical conditions, the current flowing through a conductor is directly proportional to the potential difference applied across its ends.",
     terms:[["R","Resistance, the constant of proportionality"]],
     formulas:["V = IR"],
     tip:"Not a universal law — only 'ohmic' conductors (like most metals, at constant T) obey it. Diodes and filament bulbs are classic non-ohmic exceptions."},
    {t:"Kirchhoff's Current Law (Junction Rule)",
     statement:"The algebraic sum of all currents meeting at any junction in an electrical circuit is zero — equivalently, the total current flowing into a junction equals the total current flowing out.",
     terms:[],
     formulas:["ΣIin = ΣIout"],
     tip:"A direct statement of conservation of charge — charge can't pile up or vanish at a junction, so whatever flows in must flow back out."},
    {t:"Kirchhoff's Voltage Law (Loop Rule)",
     statement:"The algebraic sum of all potential differences, including EMFs, around any closed loop in a circuit is zero.",
     terms:[],
     formulas:["ΣV = 0, around any closed loop"],
     tip:"A direct statement of conservation of energy — a charge returning to its starting point around a loop must have zero net change in potential energy."},
    {t:"Joule's Law of Heating",
     statement:"The heat produced in a conductor carrying current is directly proportional to the square of the current, the resistance, and the time for which the current flows.",
     terms:[],
     formulas:["H = I²Rt"],
     tip:"This is the physical basis for how electric heaters, filament bulbs, and fuses work — heat produced depends on I², so doubling current quadruples the heating rate."}
  ]},

  {cls:"12", subject:"physics", chapter:"Magnetism & Electromagnetic Induction", laws:[
    {t:"Biot–Savart Law",
     statement:"The magnetic field due to a small current-carrying element is directly proportional to the current, the length of the element, and the sine of the angle between the element and the position vector to the point, and inversely proportional to the square of the distance from the element.",
     terms:[["dl","Current element vector"],["r̂","Unit vector from element to the field point"]],
     formulas:["dB = (μ0/4π)(I·dl × r̂)/r²"],
     tip:"The magnetic analogue of Coulomb's law for a current element — direction is given by the right-hand rule, not simply along the line joining them like an electric field."},
    {t:"Ampere's Circuital Law",
     statement:"The line integral of the magnetic field around any closed loop is equal to μ0 times the total current enclosed by that loop.",
     terms:[["Ienc","Current enclosed by the Amperian loop"]],
     formulas:["∮B·dl = μ0Ienc"],
     tip:"For a long straight wire, solenoid, or toroid — situations with high symmetry — this law gives the field far more quickly than integrating Biot-Savart directly."},
    {t:"Faraday's Laws of Electromagnetic Induction",
     statement:"First Law: whenever the magnetic flux linked with a circuit changes, an EMF is induced in it. Second Law: the magnitude of the induced EMF is equal to the rate of change of magnetic flux linkage.",
     terms:[["Φ","Magnetic flux"],["N","Number of turns"]],
     formulas:["ε = −N(dΦ/dt)"],
     multipart:"Two-part law — the first establishes WHEN an EMF appears, the second gives HOW MUCH",
     tip:"The negative sign in the formula is actually Lenz's Law, tacked on to Faraday's magnitude relation to also fix the induced EMF's direction."},
    {t:"Lenz's Law",
     statement:"The direction of an induced current is always such as to oppose the change in magnetic flux that produced it.",
     terms:[],
     formulas:["Embodied in the minus sign of ε = −dΦ/dt"],
     tip:"Fundamentally a statement of energy conservation — if induced current instead REINFORCED the change in flux, you'd get energy for free, violating the first law of thermodynamics."},
    {t:"Gauss's Law for Magnetism",
     statement:"The net magnetic flux through any closed surface is always zero.",
     terms:[],
     formulas:["∮B·dA = 0"],
     tip:"Equivalent to saying isolated magnetic monopoles don't exist — every magnetic field line that enters a closed surface must also leave it, since field lines always form closed loops (unlike electric field lines, which can start/end on charges)."}
  ]},

  {cls:"12", subject:"physics", chapter:"Magnetism & Matter", laws:[
    {t:"Curie's Law",
     statement:"The magnetic susceptibility of a paramagnetic material is inversely proportional to its absolute temperature.",
     terms:[["χ","Magnetic susceptibility"],["C","Curie constant"]],
     formulas:["χ = C/T"],
     tip:"Higher temperature means more thermal agitation randomising the atomic dipoles, which weakens the material's net magnetic response — hence χ falls as T rises."},
    {t:"Curie-Weiss Law",
     statement:"Above a characteristic temperature called the Curie temperature, the magnetic susceptibility of a ferromagnetic material is inversely proportional to the difference between its temperature and the Curie temperature.",
     terms:[["Tc","Curie temperature — above this, ferromagnetic materials become merely paramagnetic"]],
     formulas:["χ = C/(T − Tc), valid for T > Tc"],
     tip:"Right at T=Tc this expression blows up (χ→∞), marking the sharp transition where a material's spontaneous magnetisation collapses to zero."}
  ]},

  {cls:"12", subject:"physics", chapter:"Ray & Wave Optics", laws:[
    {t:"Laws of Reflection",
     statement:"(1) The incident ray, the reflected ray, and the normal at the point of incidence all lie in the same plane. (2) The angle of incidence equals the angle of reflection.",
     terms:[],
     formulas:["∠i = ∠r"],
     multipart:"Two-part law — the first fixes the geometry (co-planarity), the second fixes the actual angle relationship"},
    {t:"Huygens' Principle",
     statement:"Every point on an existing wavefront acts as a source of secondary spherical wavelets spreading out in all directions at the wave's speed; the new wavefront at any later instant is the common tangent (envelope) surface to all these secondary wavelets.",
     terms:[],
     formulas:[],
     tip:"A purely geometric construction method for predicting how a wavefront evolves — used to derive both the laws of reflection and Snell's law of refraction from first principles."},
    {t:"Snell's Law of Refraction",
     statement:"For a given pair of media, the ratio of the sine of the angle of incidence to the sine of the angle of refraction is a constant, equal to the relative refractive index of the second medium with respect to the first.",
     terms:[["n1, n2","Refractive indices of the two media"]],
     formulas:["n1 sinθ1 = n2 sinθ2"],
     tip:"Light bends toward the normal entering a denser medium, away from the normal entering a rarer one — Snell's law quantifies exactly by how much."},
    {t:"Brewster's Law",
     statement:"The tangent of the angle of incidence at which reflected light is completely plane-polarised (the Brewster angle) is numerically equal to the refractive index of the reflecting medium.",
     terms:[["θB","Brewster's angle"]],
     formulas:["tanθB = n"],
     tip:"At exactly this angle, the reflected and refracted rays turn out to be perpendicular to each other — a handy secondary check."},
    {t:"Malus's Law",
     statement:"When completely plane-polarised light is incident on an analyser, the intensity of the transmitted light varies as the square of the cosine of the angle between the polariser's and analyser's transmission axes.",
     terms:[["I0","Intensity of the incident polarised light"]],
     formulas:["I = I0cos²θ"],
     tip:"θ=0° (aligned axes) transmits everything; θ=90° (crossed polarisers) transmits nothing — everything in between follows this cos² curve, not a linear one."},
    {t:"Rayleigh's Law of Scattering",
     statement:"The intensity of light scattered by particles much smaller than its wavelength is inversely proportional to the fourth power of the wavelength.",
     terms:[],
     formulas:["I ∝ 1/λ⁴"],
     tip:"Blue light (shorter λ) scatters far more than red light (longer λ) in the atmosphere — exactly why the sky looks blue and sunsets look red/orange."}
  ]},

  {cls:"12", subject:"physics", chapter:"Modern Physics", laws:[
    {t:"Einstein's Photoelectric Equation",
     statement:"The maximum kinetic energy of an emitted photoelectron is directly proportional to the frequency of the incident radiation (above a threshold frequency) and is completely independent of the light's intensity.",
     terms:[["φ","Work function of the metal"],["ν0","Threshold frequency, below which no emission occurs regardless of intensity"]],
     formulas:["KEmax = hν − φ", "φ = hν0"],
     tip:"This was the result that couldn't be explained by classical wave theory of light at all — it's direct evidence for the particle (photon) nature of light."},
    {t:"Laws of Photoelectric Emission",
     statement:"(1) For a given metal, photoelectric emission occurs only if the incident frequency exceeds a minimum threshold frequency, regardless of intensity. (2) Above the threshold, photoelectric current (electrons emitted per second) is directly proportional to light intensity. (3) The maximum kinetic energy of emitted photoelectrons depends only on frequency, never on intensity. (4) Emission is essentially instantaneous, with no measurable time lag.",
     terms:[],
     formulas:[],
     multipart:"Four experimental observations (from Hertz and Lenard) that any successful theory of light had to explain — Einstein's equation explains all four at once",
     tip:"These four experimental facts are exactly what classical wave theory of light COULDN'T explain, which is precisely why Einstein's photon (particle) explanation was needed."},
    {t:"De Broglie Hypothesis",
     statement:"Every moving particle has an associated wave, called a matter wave, whose wavelength is inversely proportional to the particle's momentum.",
     terms:[],
     formulas:["λ = h/p = h/mv"],
     tip:"Noticeable only for very small masses (like electrons) — for everyday macroscopic objects, λ is so tiny it's completely unobservable."},
    {t:"Heisenberg's Uncertainty Principle",
     statement:"It is impossible to simultaneously measure, with arbitrary precision, both the exact position and the exact momentum of a particle — the product of their uncertainties has a fundamental, non-zero lower limit.",
     terms:[["Δx, Δp","Uncertainties in position and momentum"]],
     formulas:["Δx·Δp ≥ h/4π"],
     tip:"This is a fundamental limit built into nature itself, not a limitation of measuring instruments — it's exactly why a definite 'orbit' for an electron (as in the Bohr model) isn't physically meaningful."},
    {t:"Bohr's Postulates",
     statement:"(1) Electrons revolve in certain stable orbits without radiating energy. (2) These orbits are ones where the electron's angular momentum is an integral multiple of h/2π. (3) An atom radiates energy only when an electron jumps between orbits, emitting or absorbing a photon of energy equal to the orbit energy difference.",
     terms:[["n","Principal quantum number"]],
     formulas:["mvr = nh/2π (quantisation)", "ΔE = hν (photon emission/absorption condition)"],
     multipart:"Three postulates together define the entire Bohr model of the atom",
     tip:"Postulate (1) directly contradicted classical electromagnetism, which predicts an accelerating (orbiting) charge should continuously radiate and spiral into the nucleus — Bohr simply asserted it doesn't happen, and the model's success justified the assumption after the fact."},
    {t:"Moseley's Law",
     statement:"The square root of the frequency of the characteristic X-rays emitted by an element is directly proportional to its atomic number.",
     terms:[["Z","Atomic number"]],
     formulas:["√ν = a(Z − b), where a and b are constants for a given spectral series"],
     tip:"This relation is what let scientists correctly order elements in the periodic table by ATOMIC NUMBER rather than atomic mass, resolving several historical anomalies."},
    {t:"Bragg's Law",
     statement:"X-rays (or matter waves) are strongly diffracted by the parallel planes of atoms in a crystal only when the path difference between waves reflected from successive planes equals a whole number of wavelengths.",
     terms:[["d","Interplanar spacing"],["θ","Glancing angle"]],
     formulas:["nλ = 2d sinθ"],
     tip:"Used with electron/neutron diffraction too, not just X-rays — the underlying wave interference condition is identical regardless of what type of wave is diffracting."},
    {t:"Law of Radioactive Decay",
     statement:"The rate of disintegration of a radioactive sample at any instant is directly proportional to the number of undecayed nuclei present in the sample at that instant.",
     terms:[["λ","Decay constant"]],
     formulas:["dN/dt = −λN", "N = N0e^(−λt)", "t½ = 0.693/λ"],
     tip:"A statistical law — you can't predict when any ONE nucleus will decay, but the decay rate of a large population is remarkably precise and predictable."},
    {t:"Soddy-Fajans Displacement Law",
     statement:"When a radioactive nucleus emits an alpha particle, its mass number decreases by 4 and its atomic number decreases by 2; when it emits a beta particle, its mass number stays the same but its atomic number increases by 1.",
     terms:[],
     formulas:["α-decay: A → A−4, Z → Z−2", "β-decay: A unchanged, Z → Z+1"],
     multipart:"Two separate displacement rules — one for alpha decay, one for beta decay",
     tip:"Gamma emission causes neither shift (A and Z both unchanged) — it only releases energy, since a gamma ray carries no charge and negligible rest mass."}
  ]},

  {cls:"11", subject:"chemistry", chapter:"Basic Concepts of Chemistry", laws:[
    {t:"Law of Conservation of Mass",
     statement:"Mass can neither be created nor destroyed in a chemical reaction — the total mass of reactants equals the total mass of products.",
     terms:[],
     formulas:[],
     tip:"Proposed by Lavoisier — this is the reason every chemical equation MUST be balanced; it's the chemical restatement of mass-energy conservation."},
    {t:"Law of Constant (Definite) Proportions",
     statement:"A given chemical compound always contains the same elements combined together in a fixed, definite proportion by mass, regardless of its source or method of preparation.",
     terms:[],
     formulas:[],
     tip:"Proposed by Proust — pure water is always exactly 1:8 hydrogen to oxygen by mass, whether it comes from a river, a lab, or condensed steam."},
    {t:"Law of Multiple Proportions",
     statement:"When two elements combine to form more than one compound, the different masses of one element that combine with a fixed mass of the other are in a ratio of small whole numbers.",
     terms:[],
     formulas:[],
     tip:"Proposed by Dalton — classic example: carbon and oxygen form CO and CO2, where the oxygen masses per fixed mass of carbon are in a simple 1:2 ratio."},
    {t:"Gay-Lussac's Law of Gaseous Volumes",
     statement:"When gases react with one another, they do so in volumes that bear a simple whole-number ratio to one another and to the volumes of the products, provided all volumes are measured at the same temperature and pressure.",
     terms:[],
     formulas:[],
     tip:"This law, combined with Avogadro's hypothesis, is what let chemists first work out the correct diatomic formulas (H2, O2, N2, etc.) for common gaseous elements."},
    {t:"Law of Reciprocal Proportions",
     statement:"When two elements combine separately with a fixed mass of a third element, the ratio of the masses in which they do so is either the same as, or a simple whole-number multiple of, the ratio in which the first two elements combine directly with each other.",
     terms:[],
     formulas:[],
     tip:"The least commonly remembered of the classical proportion laws, but it played the same historical role as the others — early quantitative evidence for atoms combining in fixed ratios."},
    {t:"Dalton's Atomic Theory",
     statement:"(1) Matter consists of indivisible particles called atoms. (2) Atoms of the same element are identical in mass and properties; atoms of different elements differ. (3) Atoms combine in simple, fixed whole-number ratios to form compounds. (4) Atoms can neither be created nor destroyed in a chemical reaction.",
     terms:[],
     formulas:[],
     multipart:"Four founding postulates — postulate (2) is now known to be modified by the existence of isotopes, and postulate (1) by subatomic particles, but the theory remains the historical foundation of modern chemistry",
     tip:"Postulates (3) and (4) are precisely what give rise to the Law of Multiple Proportions and the Law of Conservation of Mass, respectively."}
  ]},

  {cls:"11", subject:"chemistry", chapter:"Structure of Atom", laws:[
    {t:"Heisenberg's Uncertainty Principle",
     statement:"It is impossible to simultaneously determine, with absolute precision, both the exact position and the exact momentum of a microscopic particle such as an electron.",
     terms:[["Δx","Uncertainty in position"],["Δp","Uncertainty in momentum"]],
     formulas:["Δx·Δp ≥ h/4π"],
     tip:"This is what makes the idea of a fixed circular 'orbit' (as in the Bohr model) conceptually invalid for electrons — you can only speak of a probability distribution (orbital), not a definite path."},
    {t:"Aufbau Principle",
     statement:"In the ground state of an atom, electrons are filled into orbitals in order of increasing orbital energy — the lowest-energy orbitals are filled first.",
     terms:[],
     formulas:["Filling order follows (n + l) rule: lower (n+l) fills first; if tied, lower n fills first"],
     tip:"'Aufbau' is German for 'building up' — this is exactly how electronic configurations are constructed, one electron at a time, from the lowest available energy level."},
    {t:"Pauli's Exclusion Principle",
     statement:"No two electrons in the same atom can have an identical set of all four quantum numbers.",
     terms:[],
     formulas:["Maximum electrons per orbital = 2 (with opposite spins)", "Maximum electrons per shell = 2n²"],
     tip:"This single principle is what forces electrons to spread out across different orbitals/shells rather than all collapsing into the lowest-energy orbital — it's the reason atoms have the size and structure they do."},
    {t:"Hund's Rule of Maximum Multiplicity",
     statement:"Orbitals of equal energy (degenerate orbitals, like the three 2p orbitals) are each singly occupied by one electron before any orbital receives a second electron — and all the singly-occupying electrons have parallel (same-direction) spin.",
     terms:[],
     formulas:[],
     tip:"This is exactly why nitrogen (2p³, all three 2p orbitals singly occupied) is extra stable — half-filled degenerate sets carry a small but real stability bonus."},
    {t:"Slater's Rules",
     statement:"A set of empirical rules for estimating the effective nuclear charge felt by an electron in a multi-electron atom, by calculating a 'screening constant' contributed by the atom's other electrons.",
     terms:[["Zeff","Effective nuclear charge"],["S","Screening (shielding) constant"]],
     formulas:["Zeff = Z − S"],
     tip:"Explains why outer electrons feel a much weaker pull than the full nuclear charge Z would suggest — inner electrons 'shield' much of the nucleus's attraction from them."},
    {t:"Modern Periodic Law",
     statement:"The physical and chemical properties of the elements are a periodic function of their atomic number.",
     terms:[],
     formulas:[],
     tip:"This corrected Mendeleev's original version of the law (based on atomic MASS), resolving several anomalies like tellurium and iodine appearing 'out of order' by mass but correctly ordered by atomic number."}
  ]},

  {cls:"11", subject:"chemistry", chapter:"Chemical Bonding", laws:[
    {t:"Octet Rule",
     statement:"Atoms tend to gain, lose, or share electrons so as to achieve eight electrons in their outermost (valence) shell, resembling the stable electronic configuration of the nearest noble gas.",
     terms:[],
     formulas:[],
     tip:"A useful guiding rule, but far from universal — molecules like BF3 (incomplete octet) and SF6 (expanded octet) are common, well-known exceptions."},
    {t:"Fajan's Rules",
     statement:"A set of rules predicting when an ionic bond gains significant covalent character: covalent character increases with smaller cation size, larger anion size, higher cationic charge, and a cation having a pseudo-noble-gas (18-electron) outer configuration.",
     terms:[],
     formulas:[],
     tip:"Explains why, for example, LiCl is noticeably more covalent than NaCl or KCl — the small, highly-charged Li⁺ ion polarises the large Cl⁻ ion's electron cloud much more strongly."},
    {t:"Bent's Rule",
     statement:"An atom's s-orbital character concentrates in hybrid orbitals directed toward more electropositive substituents (or lone pairs), while its p-orbital character concentrates in orbitals directed toward more electronegative substituents.",
     terms:[],
     formulas:[],
     tip:"Explains subtle bond-angle distortions in molecules with different substituents — like why the F-P-F angle in PF3 differs slightly from the ideal tetrahedral value."}
  ]},

  {cls:"11", subject:"chemistry", chapter:"States of Matter", laws:[
    {t:"Boyle's Law",
     statement:"At constant temperature, the pressure of a fixed mass of gas is inversely proportional to its volume.",
     terms:[],
     formulas:["PV = constant", "P1V1 = P2V2"],
     tip:"Squeezing a gas into half its volume (at constant T) doubles its pressure — this is the law firefighters and divers rely on when reasoning about compressed air tanks."},
    {t:"Charles's Law",
     statement:"At constant pressure, the volume of a fixed mass of gas is directly proportional to its absolute temperature.",
     terms:[],
     formulas:["V/T = constant", "V1/T1 = V2/T2"],
     tip:"Extrapolating this straight-line V vs T relationship to V=0 gives −273.15°C — historically, this is exactly how absolute zero was first estimated."},
    {t:"Avogadro's Law",
     statement:"Equal volumes of all gases, measured at the same temperature and pressure, contain equal numbers of molecules.",
     terms:[],
     formulas:["V ∝ n", "1 mole of any gas occupies 22.4 L at STP"],
     tip:"This is precisely what makes gas stoichiometry so convenient — you can work directly in volume ratios instead of converting to moles first, since volume ratio = mole ratio at fixed T, P."},
    {t:"Graham's Law of Diffusion",
     statement:"At constant temperature and pressure, the rate of diffusion or effusion of a gas is inversely proportional to the square root of its molar mass (or density).",
     terms:[],
     formulas:["r1/r2 = √(M2/M1)"],
     tip:"Lighter gases always diffuse faster — this is the principle historically used to enrich uranium isotopes by effusion through a porous barrier."},
    {t:"Dulong and Petit's Law",
     statement:"For most solid elements at room temperature, the product of the specific heat capacity and the atomic mass — the molar heat capacity — is approximately the same constant value for all of them.",
     terms:[],
     formulas:["Atomic mass × Specific heat ≈ 6.4 cal/(mol·K)"],
     tip:"An empirical rule useful for roughly estimating an unknown element's atomic mass from an easily-measured specific heat — but it fails for light elements like carbon, boron, and silicon."},
    {t:"Dalton's Law of Partial Pressures",
     statement:"The total pressure exerted by a mixture of non-reacting gases equals the sum of the partial pressures that each individual gas would exert if it alone occupied the same container.",
     terms:[],
     formulas:["P(total) = P1 + P2 + P3 + ⋯"],
     tip:"Partial pressure of any one gas equals its mole fraction times the total pressure — useful for gas-collection-over-water problems where you must subtract water vapour pressure."},
    {t:"Amagat's Law of Partial Volumes",
     statement:"The total volume of a mixture of non-reacting gases equals the sum of the volumes each individual gas would occupy alone, at the same temperature and pressure as the mixture.",
     terms:[],
     formulas:["V(total) = V1 + V2 + V3 + ⋯"],
     tip:"The volume-based counterpart to Dalton's pressure law — both express the same underlying idea (ideal gases don't 'interact'), just measured along different axes."}
  ]},

  {cls:"11", subject:"chemistry", chapter:"Equilibrium", laws:[
    {t:"Henry's Law",
     statement:"At a constant temperature, the solubility of a gas in a liquid (or equivalently, the partial pressure of the gas above the liquid) is directly proportional to the mole fraction of the gas dissolved in the liquid.",
     terms:[["KH","Henry's law constant, specific to the gas-solvent pair"]],
     formulas:["p = KH·x"],
     tip:"A higher KH means the gas is LESS soluble at a given pressure — this is why divers must decompress slowly, to avoid dissolved nitrogen suddenly bubbling out of the blood."},
    {t:"Law of Mass Action",
     statement:"At a given temperature, the rate of a chemical reaction is directly proportional to the product of the active masses (molar concentrations) of the reactants, each raised to a power equal to its stoichiometric coefficient in the balanced equation.",
     terms:[],
     formulas:["For aA + bB ⇌ cC + dD: Kc = [C]^c[D]^d / [A]^a[B]^b"],
     tip:"This is the fundamental basis for writing every equilibrium constant expression — Kc and Kp are both direct consequences of this law."},
    {t:"Le Chatelier's Principle",
     statement:"If a system at equilibrium is subjected to a change in concentration, pressure, volume, or temperature, the equilibrium shifts in the direction that tends to counteract (partially oppose) the imposed change.",
     terms:[],
     formulas:[],
     tip:"Purely qualitative but extremely powerful — used to predict the effect of adding reactant, removing product, compressing a gas mixture, or heating an exothermic vs endothermic reaction, all with the same one-line reasoning."},
    {t:"Ostwald's Dilution Law",
     statement:"For a weak electrolyte, the dissociation constant relates to the degree of dissociation and the concentration — as the solution is diluted, the degree of dissociation increases even though the dissociation constant itself stays fixed.",
     terms:[["α","Degree of dissociation"]],
     formulas:["Ka = Cα²/(1−α) ≈ Cα², for α ≪ 1"],
     tip:"Dilution always increases α for a weak electrolyte, per Le Chatelier's principle — spreading the ions out favours the (more dissociated) product side."}
  ]},

  {cls:"11", subject:"chemistry", chapter:"Thermodynamics", laws:[
    {t:"Hess's Law of Constant Heat Summation",
     statement:"The total enthalpy change for a chemical reaction is the same whether it occurs in a single step or via a series of intermediate steps, provided the initial and final states are identical.",
     terms:[],
     formulas:["ΔH(reaction) = ΣΔH(steps), for any pathway between the same initial and final states"],
     tip:"A direct consequence of enthalpy being a state function — lets you calculate enthalpies that are difficult or impossible to measure directly, by combining ones that are easy to measure."},
    {t:"Second Law of Thermodynamics",
     statement:"For any spontaneous process, the total entropy of the universe — the system plus its surroundings — always increases.",
     terms:[["ΔS","Change in entropy"]],
     formulas:["ΔS(universe) = ΔS(system) + ΔS(surroundings) > 0, for a spontaneous process"],
     tip:"This is why ΔG (Gibbs free energy) was introduced — it repackages this entropy condition into a single system-only quantity: ΔG<0 for spontaneity at constant T, P."},
    {t:"Third Law of Thermodynamics",
     statement:"The entropy of a perfectly crystalline substance approaches zero as its absolute temperature approaches zero Kelvin.",
     terms:[],
     formulas:["S → 0 as T → 0 K, for a perfect crystal"],
     tip:"Provides the reference point (S=0) needed to calculate ABSOLUTE entropy values — unlike enthalpy, where only differences (ΔH) are usually meaningful."},
    {t:"Trouton's Rule",
     statement:"For many liquids, the molar entropy of vaporisation is approximately the same constant value.",
     terms:[],
     formulas:["ΔSvap = ΔHvap/Tb ≈ 88 J/(mol·K)"],
     tip:"Breaks down for liquids with strong hydrogen bonding (like water) — their entropy of vaporisation is noticeably higher than this typical value."}
  ]},

  {cls:"11", subject:"chemistry", chapter:"Organic Chemistry Basics", laws:[
    {t:"Markovnikov's Rule",
     statement:"When an unsymmetrical reagent (such as HX) adds to an unsymmetrical alkene, the hydrogen atom attaches to the carbon that already bears the greater number of hydrogen atoms, while the halogen attaches to the more substituted carbon.",
     terms:[],
     formulas:[],
     tip:"Explained by carbocation stability — the more substituted (more stable) carbocation forms as the intermediate, and the halide ion then attacks that carbon."},
    {t:"Anti-Markovnikov's Rule (Kharasch Effect)",
     statement:"In the presence of peroxides, HBr adds to an unsymmetrical alkene via a free-radical mechanism, placing the bromine atom on the carbon with MORE hydrogen atoms — the opposite regiochemistry to Markovnikov's rule.",
     terms:[],
     formulas:[],
     tip:"Only occurs with HBr specifically — HCl and HI don't show this peroxide-reversal effect, due to the specific bond energies involved in their respective radical mechanisms."},
    {t:"Huckel's Rule of Aromaticity",
     statement:"A cyclic, planar, fully-conjugated system is aromatic if it contains (4n+2) π electrons in its ring, where n is zero or a positive integer.",
     terms:[["n","Any non-negative integer (0, 1, 2, …)"]],
     formulas:["Number of π electrons = 4n + 2, for aromaticity"],
     tip:"Benzene (n=1, 6 π electrons) is the classic example — a ring with 4n π electrons instead (like cyclobutadiene, n=1, 4 electrons) is actually ANTI-aromatic and especially unstable."},
    {t:"Baeyer's Strain Theory",
     statement:"The stability of a cycloalkane ring depends on how far its internal bond angles are forced to deviate from the ideal tetrahedral angle of 109.5° — greater deviation means greater angle strain and lower stability.",
     terms:[],
     formulas:[],
     tip:"Correctly predicts that cyclopentane (near-ideal angles) is far more stable than cyclopropane (60° angles, heavily strained) — though it famously fails for larger rings, which pucker out of plane to relieve strain."}
  ]},

  {cls:"12", subject:"chemistry", chapter:"Solutions", laws:[
    {t:"Raoult's Law",
     statement:"The partial vapour pressure of each volatile component in an ideal solution is directly proportional to its mole fraction in the solution.",
     terms:[],
     formulas:["p = p°·x", "For a non-volatile solute: (p° − p)/p° = xsolute"],
     tip:"Deviates from ideal behaviour when solute-solvent interactions differ significantly from solute-solute/solvent-solvent interactions — this deviation is exactly what produces azeotropes."}
  ]},

  {cls:"12", subject:"chemistry", chapter:"Electrochemistry", laws:[
    {t:"Faraday's First Law of Electrolysis",
     statement:"The mass of a substance deposited or liberated at an electrode during electrolysis is directly proportional to the quantity of electric charge passed through the electrolyte.",
     terms:[["Z","Electrochemical equivalent of the substance"]],
     formulas:["m = Zit = ZQ"],
     tip:"1 Faraday (96500 C) is defined as exactly the charge needed to deposit one gram-equivalent of any substance — a direct numerical consequence of this law."},
    {t:"Faraday's Second Law of Electrolysis",
     statement:"When the same quantity of electric charge is passed through different electrolytes connected in series, the masses of the substances liberated at their respective electrodes are directly proportional to their chemical equivalent weights.",
     terms:[["E","Equivalent weight"]],
     formulas:["m1/m2 = E1/E2, for equal charge Q passed through each"],
     tip:"Explains why, for the same current and time, a divalent metal deposits only half as much (by moles) as a monovalent one — it takes twice the charge per mole to reduce it."},
    {t:"Kohlrausch's Law of Independent Migration of Ions",
     statement:"At infinite dilution, each ion migrates independently of its co-ion, and contributes a fixed, definite share to the total molar conductivity of the electrolyte, regardless of which other ion it's paired with.",
     terms:[["λ°+, λ°−","Limiting molar conductivities of the cation and anion"]],
     formulas:["Λ°m = λ°+ + λ°−"],
     tip:"This is what lets you calculate Λ°m for a WEAK electrolyte (which can never actually be fully dissociated, so you can't measure it directly) using only data from strong electrolytes."}
  ]},

  {cls:"12", subject:"chemistry", chapter:"Chemical Kinetics", laws:[
    {t:"Rate Law",
     statement:"An experimentally determined equation expressing the rate of a reaction as a function of the molar concentrations of the reactants, each raised to a power called its order with respect to that reactant.",
     terms:[["k","Rate constant"],["m, n","Orders of reaction with respect to each reactant, found experimentally"]],
     formulas:["Rate = k[A]^m[B]^n"],
     tip:"Cannot be predicted from the balanced chemical equation alone — unlike molecularity, reaction order must always be determined by experiment."},
    {t:"Arrhenius Equation",
     statement:"The rate constant of a reaction increases exponentially with absolute temperature, with the exponential controlled by the ratio of activation energy to thermal energy.",
     terms:[["A","Pre-exponential (frequency) factor"],["Ea","Activation energy"]],
     formulas:["k = Ae^(−Ea/RT)", "ln k = ln A − Ea/RT"],
     tip:"A plot of ln k vs 1/T gives a straight line of slope −Ea/R — this is the standard experimental method for measuring a reaction's activation energy."}
  ]},

  {cls:"12", subject:"chemistry", chapter:"Surface Chemistry", laws:[
    {t:"Hardy-Schulze Rule",
     statement:"The coagulating power of an electrolyte on a given colloidal sol increases sharply with the valency (charge) of the ion carrying a charge opposite to that of the colloidal particles.",
     terms:[],
     formulas:[],
     tip:"A trivalent ion (like Al³⁺ or PO4³⁻) coagulates a sol far more effectively than a monovalent one — coagulating power rises steeply, not just linearly, with charge."}
  ]},

  {cls:"12", subject:"chemistry", chapter:"Solid State", laws:[
    {t:"Bragg's Law",
     statement:"X-rays are strongly diffracted (reflected) by the parallel planes of atoms in a crystal only when the path difference between rays reflected from successive planes equals a whole number of wavelengths.",
     terms:[["d","Interplanar spacing"],["θ","Glancing angle of incidence"]],
     formulas:["nλ = 2d sinθ"],
     tip:"This is the working principle behind X-ray crystallography — measuring the angles at which diffraction peaks occur lets you calculate the exact spacing between atomic planes in a crystal."}
  ]},

  {cls:"11", subject:"math", chapter:"Sets & Relations", laws:[
    {t:"De Morgan's Laws",
     statement:"For any two sets A and B: the complement of their union equals the intersection of their complements, and the complement of their intersection equals the union of their complements.",
     terms:[["A′","Complement of set A"]],
     formulas:["(A∪B)′ = A′∩B′", "(A∩B)′ = A′∪B′"],
     multipart:"Two laws — one for union, one for intersection",
     tip:"Extremely useful for simplifying set expressions involving 'NOT (this OR that)' type conditions — converts them into 'NOT this AND NOT that'."},
    {t:"Distributive Laws of Sets",
     statement:"Set union and intersection distribute over each other, just like multiplication distributes over addition in ordinary algebra.",
     terms:[],
     formulas:["A∪(B∩C) = (A∪B)∩(A∪C)", "A∩(B∪C) = (A∩B)∪(A∩C)"],
     multipart:"Two laws — union-over-intersection and intersection-over-union",
     tip:"Draw a 3-circle Venn diagram if you ever doubt which side of the equation you're on — both sides always shade the identical region."},
    {t:"Idempotent Laws",
     statement:"The union or intersection of any set with itself simply returns that same set.",
     terms:[],
     formulas:["A∪A = A", "A∩A = A"],
     tip:"'Idempotent' means 'unchanged when applied to itself' — repeating the same set operation on one set can never add or remove anything."},
    {t:"Absorption Laws",
     statement:"A set 'absorbs' any union or intersection formed with a combination that already involves itself.",
     terms:[],
     formulas:["A∪(A∩B) = A", "A∩(A∪B) = A"],
     tip:"A quick way to remember it: if A is already fully 'inside' the expression via a union, intersecting with anything more specific just collapses back to A."}
  ]},

  {cls:"11", subject:"math", chapter:"Mathematical Induction", laws:[
    {t:"Principle of Mathematical Induction",
     statement:"If a statement P(n) is true for n=1 (the base case), and the truth of P(k) implies the truth of P(k+1) for every natural number k (the inductive step), then P(n) is true for all natural numbers n.",
     terms:[["P(n)","A statement or proposition depending on a natural number n"]],
     formulas:["Base case: P(1) is true", "Inductive step: P(k) true ⇒ P(k+1) true"],
     tip:"Think of it as an infinite line of dominoes — showing the first one falls, and that each domino knocks over the next, guarantees ALL of them fall."},
    {t:"Fundamental Theorem of Arithmetic",
     statement:"Every composite number can be expressed (factorised) as a product of prime numbers, and this prime factorisation is unique except for the order in which the factors are written.",
     terms:[],
     formulas:[],
     tip:"This uniqueness is exactly why the 'prime factorisation' of a number is meaningful to talk about at all — there's only ever one way to do it (ignoring order)."}
  ]},

  {cls:"11", subject:"math", chapter:"Quadratic Equations", laws:[
    {t:"Remainder Theorem",
     statement:"If a polynomial p(x) is divided by the linear factor (x−a), the remainder of that division is p(a).",
     terms:[],
     formulas:["Remainder = p(a), when p(x) is divided by (x−a)"],
     tip:"Lets you find a remainder instantly by substitution — no need to actually carry out the long division."},
    {t:"Factor Theorem",
     statement:"(x−a) is a factor of a polynomial p(x) if and only if p(a) equals zero.",
     terms:[],
     formulas:["p(a) = 0 ⇔ (x−a) is a factor of p(x)"],
     tip:"A direct special case of the Remainder Theorem — a zero remainder means (x−a) divides p(x) exactly, i.e. it's a factor."},
    {t:"Descartes' Rule of Signs",
     statement:"The number of positive real roots of a polynomial equation p(x)=0 is at most equal to the number of sign changes between consecutive (non-zero) coefficients of p(x), and the true count differs from this maximum by an even number. Applying the same rule to p(−x) bounds the number of negative real roots.",
     terms:[],
     formulas:[],
     tip:"A fast way to bound how many positive/negative roots to even look for, before attempting to solve a higher-degree polynomial."}
  ]},

  {cls:"11", subject:"math", chapter:"Permutations & Combinations", laws:[
    {t:"Fundamental Principle of Counting",
     statement:"If one task can be performed in m different ways, and following it, a second independent task can be performed in n different ways, then the two tasks together can be performed in m×n ways.",
     terms:[],
     formulas:["Total ways = m × n (multiplication principle)"],
     tip:"The foundation underneath every permutation and combination formula — nPr and nCr are both just clever shortcuts built from repeated use of this one principle."},
    {t:"Pascal's Identity",
     statement:"Each entry in Pascal's Triangle (each binomial coefficient) equals the sum of the two entries directly above it in the previous row.",
     terms:[],
     formulas:["nCr + nC(r−1) = (n+1)Cr"],
     tip:"This identity is exactly what generates Pascal's Triangle row by row, and it's also the key algebraic step in proving the Binomial Theorem by induction."}
  ]},

  {cls:"11", subject:"math", chapter:"Binomial Theorem", laws:[
    {t:"Binomial Theorem",
     statement:"For a positive integer n, the expansion of (x+y)ⁿ is a sum of (n+1) terms, where the coefficient of each term is a binomial coefficient nCr.",
     terms:[["nCr","Binomial coefficient, n!/[r!(n−r)!]"]],
     formulas:["(x+y)ⁿ = Σ(r=0 to n) nCr·x^(n−r)·y^r"],
     tip:"Provable by mathematical induction, using Pascal's Identity as the key algebraic step to go from n=k to n=k+1."}
  ]},

  {cls:"11", subject:"math", chapter:"Sequences & Series", laws:[
    {t:"AM-GM-HM Inequality Theorem",
     statement:"For any set of positive real numbers, the arithmetic mean is always greater than or equal to the geometric mean, which is in turn always greater than or equal to the harmonic mean. Equality holds throughout if and only if all the numbers are equal.",
     terms:[],
     formulas:["AM ≥ GM ≥ HM"],
     tip:"One of the most powerful inequality tools in JEE — reach for it whenever a problem asks you to optimise (maximise/minimise) a sum or product of positive quantities."},
    {t:"Cauchy-Schwarz Inequality (Algebraic)",
     statement:"For any real numbers a1,...,an and b1,...,bn, the square of the sum of their pairwise products never exceeds the product of the sums of their individual squares.",
     terms:[],
     formulas:["(Σaᵢbᵢ)² ≤ (Σaᵢ²)(Σbᵢ²)"],
     tip:"Equality holds exactly when the two sequences are proportional (aᵢ = k·bᵢ for some constant k) — a useful check in optimisation problems."},
    {t:"Sandwich (Squeeze) Theorem",
     statement:"If f(x) ≤ g(x) ≤ h(x) for all x near a point c (except possibly at c itself), and the limits of f(x) and h(x) as x approaches c are both equal to L, then the limit of g(x) as x approaches c is also L.",
     terms:[],
     formulas:["f(x)≤g(x)≤h(x) and lim f = lim h = L ⇒ lim g = L"],
     tip:"The standard tool for evaluating limits of oscillating functions (like x·sin(1/x) as x→0) that can't be handled by direct substitution or algebra alone."}
  ]},

  {cls:"11", subject:"math", chapter:"Complex Numbers", laws:[
    {t:"De Moivre's Theorem",
     statement:"For any real number θ and integer n, raising (cosθ + i sinθ) to the power n gives cos(nθ) + i sin(nθ).",
     terms:[],
     formulas:["(cosθ + i sinθ)ⁿ = cos(nθ) + i sin(nθ)"],
     tip:"The single most useful tool for finding powers and roots of complex numbers — convert to polar form first, then this theorem does the heavy lifting."},
    {t:"Complex Triangle Inequality",
     statement:"For any two complex numbers z1 and z2, the modulus of their sum is at most the sum of their individual moduli.",
     terms:[],
     formulas:["|z1+z2| ≤ |z1|+|z2|", "|z1−z2| ≥ ||z1|−|z2||"],
     tip:"Geometrically obvious once you view complex numbers as vectors — this is just the ordinary triangle inequality from vector geometry, restated in complex-number language."},
    {t:"Fundamental Theorem of Algebra",
     statement:"Every polynomial equation of degree n≥1 with complex coefficients has at least one root among the complex numbers — and as a consequence, has exactly n roots when counted with multiplicity.",
     terms:[],
     formulas:[],
     tip:"This is precisely why complex numbers were 'invented' in the first place — they're exactly what's needed to guarantee every polynomial equation has a full set of roots."}
  ]},

  {cls:"11", subject:"math", chapter:"Trigonometric Functions", laws:[
    {t:"Sine Rule",
     statement:"In any triangle, the ratio of a side's length to the sine of the angle opposite it is the same for all three sides, and equals the diameter of the triangle's circumscribed circle.",
     terms:[["R","Circumradius of the triangle"]],
     formulas:["a/sinA = b/sinB = c/sinC = 2R"],
     tip:"The go-to relation when you know two angles and a side (AAS/ASA), or two sides and a non-included angle (SSA)."},
    {t:"Cosine Rule",
     statement:"In any triangle, the square of one side equals the sum of the squares of the other two sides, minus twice their product times the cosine of the angle between them.",
     terms:[],
     formulas:["a² = b² + c² − 2bc·cosA"],
     tip:"The natural choice when all three sides are known (SSS) and an angle is needed, or when two sides and the included angle (SAS) are given."},
    {t:"Projection Formulae",
     statement:"In any triangle, each side equals the sum of the projections of the other two sides onto it.",
     terms:[],
     formulas:["a = b·cosC + c·cosB", "b = c·cosA + a·cosC", "c = a·cosB + b·cosA"],
     tip:"A quick consistency check on a triangle's sides and angles — if the projections don't add up correctly, something in your earlier working is wrong."},
    {t:"Napier's Analogy (Law of Tangents)",
     statement:"In any triangle, the ratio of the difference to the sum of two sides equals the ratio of the tangent of half the difference of their opposite angles to the tangent of half their sum.",
     terms:[],
     formulas:["(a−b)/(a+b) = tan[(A−B)/2] / tan[(A+B)/2]"],
     tip:"Less commonly used than the sine/cosine rules, but occasionally the fastest route when a problem is phrased directly in terms of side differences and angle differences."}
  ]},

  {cls:"11", subject:"math", chapter:"Triangle & Geometry Theorems", laws:[
    {t:"Apollonius' Theorem",
     statement:"In any triangle, the sum of the squares of two sides equals twice the square of the median to the third side, plus twice the square of half the third side.",
     terms:[["AD","Median from vertex A to the midpoint D of side BC"]],
     formulas:["AB² + AC² = 2AD² + 2BD²"],
     tip:"A quick way to find a median's length using only the triangle's three side lengths, without any trigonometry."},
    {t:"Ptolemy's Theorem",
     statement:"For a cyclic quadrilateral (one whose vertices all lie on a single circle), the product of the two diagonals equals the sum of the products of the two pairs of opposite sides.",
     terms:[],
     formulas:["AC·BD = AB·CD + BC·AD (for cyclic quadrilateral ABCD)"],
     tip:"Only holds for CYCLIC quadrilaterals — for any other quadrilateral this becomes an inequality instead of an equality."},
    {t:"Ceva's Theorem",
     statement:"Three cevians drawn from the three vertices of a triangle to the opposite sides are concurrent (meet at one point) if and only if the product of the three ratios they create on the sides equals 1.",
     terms:[["Cevian","A line segment from a vertex to a point on the opposite side"]],
     formulas:["(BD/DC)·(CE/EA)·(AF/FB) = 1, for concurrency"],
     tip:"Used to prove that medians, angle bisectors, and altitudes of a triangle are each concurrent — plug the appropriate ratios into this one theorem for all three proofs."},
    {t:"Menelaus' Theorem",
     statement:"If a straight line (transversal) crosses the three sides of a triangle (or their extensions), the product of the three resulting ratios, taken with sign, equals −1.",
     terms:[],
     formulas:["(BD/DC)·(CE/EA)·(AF/FB) = −1, for a transversal line"],
     tip:"The 'sister' theorem to Ceva's — same three ratios, but this one tests for three points being collinear rather than three cevians being concurrent."}
  ]},

  {cls:"12", subject:"math", chapter:"Matrices & Determinants", laws:[
    {t:"Determinant Multiplication Theorem",
     statement:"The determinant of the product of two square matrices of the same order equals the product of their individual determinants.",
     terms:[],
     formulas:["|AB| = |A|·|B|"],
     tip:"Lets you evaluate the determinant of a matrix product without ever multiplying the matrices out — often a huge shortcut."},
    {t:"Adjoint Matrix Theorem",
     statement:"The product of a square matrix and its adjoint (in either order) equals the determinant of the matrix multiplied by the identity matrix.",
     terms:[["adj(A)","Adjoint of A — the transpose of its cofactor matrix"]],
     formulas:["A·adj(A) = adj(A)·A = |A|·I"],
     tip:"This is exactly where the inverse formula A⁻¹ = adj(A)/|A| comes from — divide both sides by |A|, provided |A|≠0."},
    {t:"Cramer's Rule",
     statement:"For a system of linear equations whose coefficient determinant D is non-zero, each unknown equals the ratio of a modified determinant (with that variable's column replaced by the constants) to D.",
     terms:[["D","Determinant of the coefficient matrix"]],
     formulas:["x = Dx/D, y = Dy/D, z = Dz/D (valid only when D≠0)"],
     tip:"If D=0 but at least one of Dx, Dy, Dz is non-zero, the system has NO solution; if D and all of Dx, Dy, Dz are zero, it has infinitely many."},
    {t:"Cayley-Hamilton Theorem",
     statement:"Every square matrix satisfies its own characteristic equation.",
     terms:[["Characteristic equation","|A − λI| = 0, treated as a polynomial equation in λ"]],
     formulas:["Substituting A in place of λ in |A−λI|=0 gives the zero matrix"],
     tip:"A surprisingly powerful shortcut for computing higher powers or the inverse of a matrix — express A² (or higher) in terms of lower powers of A using this theorem instead of direct multiplication."}
  ]},

  {cls:"12", subject:"math", chapter:"Limits, Continuity & Differentiability", laws:[
    {t:"Intermediate Value Theorem",
     statement:"If a function f is continuous on a closed interval [a,b], then for any value k lying between f(a) and f(b), there exists at least one point c in [a,b] such that f(c)=k.",
     terms:[],
     formulas:[],
     tip:"The formal justification behind 'if a continuous function is negative at one point and positive at another, it must cross zero somewhere in between' — the basis of root-finding by sign change."},
    {t:"Extreme Value Theorem",
     statement:"If a function f is continuous on a closed interval [a,b], then f attains both an absolute maximum value and an absolute minimum value at least once within that interval.",
     terms:[],
     formulas:[],
     tip:"Guarantees that a maximum/minimum actually EXISTS on a closed interval before you go looking for it using derivatives — continuity and a CLOSED interval are both essential conditions."},
    {t:"L'Hôpital's Rule",
     statement:"For a limit that produces an indeterminate form of type 0/0 or ∞/∞, the limit of the quotient of two functions equals the limit of the quotient of their derivatives, provided that second limit exists.",
     terms:[],
     formulas:["lim f(x)/g(x) = lim f′(x)/g′(x)"],
     tip:"Reapply the rule again if the result is still indeterminate — but always double-check the form is genuinely 0/0 or ∞/∞ before applying it at all."}
  ]},

  {cls:"12", subject:"math", chapter:"Application of Derivatives", laws:[
    {t:"Rolle's Theorem",
     statement:"If a function f is continuous on [a,b], differentiable on (a,b), and f(a) equals f(b), then there exists at least one point c in (a,b) where the derivative f′(c) equals zero.",
     terms:[],
     formulas:["f′(c) = 0, for some c in (a,b)"],
     tip:"Geometrically: if a smooth curve starts and ends at the same height, it must have at least one perfectly flat (horizontal tangent) point somewhere in between."},
    {t:"Lagrange's Mean Value Theorem",
     statement:"If a function f is continuous on [a,b] and differentiable on (a,b), then there exists at least one point c in (a,b) where the instantaneous rate of change equals the average rate of change over the whole interval.",
     terms:[],
     formulas:["f′(c) = [f(b)−f(a)] / (b−a)"],
     tip:"Rolle's Theorem is just the special case of this where f(a)=f(b), making the average rate of change (and hence f′(c)) equal to zero."},
    {t:"Cauchy's Mean Value Theorem",
     statement:"If two functions f and g are both continuous on [a,b] and differentiable on (a,b), with g′(x) never zero on (a,b), then there exists a point c in (a,b) where the ratio of their derivatives equals the ratio of their total changes over the interval.",
     terms:[],
     formulas:["[f(b)−f(a)] / [g(b)−g(a)] = f′(c) / g′(c)"],
     tip:"A generalisation of Lagrange's MVT — setting g(x)=x recovers Lagrange's theorem exactly, since g′(x)=1 and g(b)−g(a)=b−a."},
    {t:"First Derivative Test",
     statement:"At a critical point of f, if f′(x) changes sign from positive to negative, that point is a local maximum; if it changes from negative to positive, it's a local minimum; if the sign doesn't change, the point is neither.",
     terms:[],
     formulas:[],
     tip:"Works even when f″ doesn't exist or equals zero at the critical point — more broadly applicable than the Second Derivative Test, just slightly more work to apply."},
    {t:"Second Derivative Test",
     statement:"At a point where f′(x)=0: if f″(x) is negative, the point is a local maximum; if f″(x) is positive, it's a local minimum; if f″(x)=0, the test gives no conclusion.",
     terms:[],
     formulas:["f′(x)=0 and f″(x)<0 ⇒ local maximum; f″(x)>0 ⇒ local minimum"],
     tip:"Usually faster than the First Derivative Test when f″ is easy to compute — but fall back to the First Derivative Test whenever f″(x)=0 at the critical point."}
  ]},

  {cls:"12", subject:"math", chapter:"Differentiation", laws:[
    {t:"Euler's Theorem for Homogeneous Functions",
     statement:"If f(x,y) is a homogeneous function of degree n, then summing x times its partial derivative with respect to x, plus y times its partial derivative with respect to y, gives exactly n times the function itself.",
     terms:[["Homogeneous function of degree n","A function satisfying f(tx,ty) = tⁿf(x,y) for all t"]],
     formulas:["x(∂f/∂x) + y(∂f/∂y) = n·f(x,y)"],
     tip:"A quick way to verify that a given multivariable function actually IS homogeneous of a claimed degree — differentiate, plug into this relation, and check it holds."}
  ]},

  {cls:"12", subject:"math", chapter:"Integrals", laws:[
    {t:"Fundamental Theorem of Calculus",
     statement:"If F is any antiderivative of a continuous function f on the interval [a,b], then the definite integral of f from a to b equals F(b) minus F(a).",
     terms:[["F","Any antiderivative of f, i.e. F′(x)=f(x)"]],
     formulas:["∫(a to b) f(x)dx = F(b) − F(a)"],
     tip:"This single theorem is what connects the two halves of calculus — differentiation (rates of change) and integration (areas/accumulation) — as inverse operations of each other."},
    {t:"Newton-Leibniz Rule",
     statement:"Differentiating a definite integral with respect to its upper limit simply returns the integrand evaluated at that limit; more generally, when both limits are functions of x, differentiate using both endpoints and their own derivatives.",
     terms:[],
     formulas:["d/dx ∫(a to x) f(t)dt = f(x)", "d/dx ∫(u(x) to v(x)) f(t)dt = f(v(x))·v′(x) − f(u(x))·u′(x)"],
     tip:"Frequently used to differentiate functions that are DEFINED as an integral — no need to actually evaluate the integral first."},
    {t:"King's Property of Definite Integrals",
     statement:"The definite integral of f(x) from a to b equals the definite integral of f(a+b−x) over the same limits.",
     terms:[],
     formulas:["∫(a to b) f(x)dx = ∫(a to b) f(a+b−x)dx"],
     tip:"One of the most powerful JEE tricks — whenever a definite integral looks stuck, try this substitution before anything else."},
    {t:"Queen's Property of Definite Integrals",
     statement:"The definite integral of f(x) from 0 to 2a equals twice the integral from 0 to a if f(2a−x)=f(x), and equals zero if f(2a−x)=−f(x).",
     terms:[],
     formulas:["∫(0 to 2a) f(x)dx = 2∫(0 to a) f(x)dx, if f(2a−x)=f(x)", "∫(0 to 2a) f(x)dx = 0, if f(2a−x)=−f(x)"],
     tip:"A direct extension of King's Property to the specific limits [0, 2a] — check the symmetry condition around x=a before applying it."},
    {t:"Jack's Property of Definite Integrals",
     statement:"The definite integral of an even function over a symmetric interval [−a,a] equals twice the integral from 0 to a; the definite integral of an odd function over [−a,a] equals zero.",
     terms:[],
     formulas:["∫(−a to a) f(x)dx = 2∫(0 to a) f(x)dx, if f is even", "∫(−a to a) f(x)dx = 0, if f is odd"],
     tip:"Always check whether the integrand is even or odd BEFORE attempting to integrate directly — an odd-function integral over symmetric limits can be written down as zero instantly."},
    {t:"Wallis' Formula",
     statement:"Gives a direct reduction formula for definite integrals of powers of sine or cosine over [0, π/2], with a different final factor depending on whether the power is even or odd.",
     terms:[],
     formulas:["∫(0 to π/2) sinⁿx dx = ∫(0 to π/2) cosⁿx dx = [(n−1)(n−3)⋯1 or 2] / [n(n−2)⋯1 or 2] × (π/2 if n is even, ×1 if n is odd)"],
     tip:"Saves you from repeated integration by parts / reduction formula derivations for high powers of sinⁿx or cosⁿx over this specific interval."}
  ]},

  {cls:"12", subject:"math", chapter:"Vectors & 3D Geometry", laws:[
    {t:"Vector Expansion Theorem (Vector Triple Product)",
     statement:"The vector triple product of three vectors can be expanded as the difference of two vectors, each scaled by a dot product of the other two.",
     terms:[],
     formulas:["a×(b×c) = b(a·c) − c(a·b)"],
     tip:"Remembered by the mnemonic 'BAC minus CAB' — matching the order of the letters in the formula to the order they appear in the original expression."},
    {t:"Cauchy-Schwarz Inequality for Vectors",
     statement:"For any two vectors, the absolute value of their dot product never exceeds the product of their magnitudes.",
     terms:[],
     formulas:["|a·b| ≤ |a||b|"],
     tip:"Equality holds exactly when the two vectors are parallel (or anti-parallel) — a useful check in vector optimisation problems."}
  ]},

  {cls:"12", subject:"math", chapter:"Probability", laws:[
    {t:"Addition Theorem of Probability",
     statement:"The probability that at least one of two events occurs equals the sum of their individual probabilities, minus the probability that both occur together.",

  /* ============ typo-tolerant universal search ("AI search") ============ */
  /*
    Searches the ENTIRE vault (formulas + derivations + laws, all classes &
    subjects) regardless of the active mode/filter. Matching is fuzzy so
    misspelled queries still resolve: edit-distance typo tolerance, greek
    symbol names (λ -> "lambda", θ -> "theta"...), stopword removal and
    field weighting (title > chapter/subject > body).
  */
  const SEARCH = (function(){
    const GREEK = {
      'α':'alpha','β':'beta','γ':'gamma','δ':'delta','ε':'epsilon','ζ':'zeta','η':'eta','θ':'theta',
      'λ':'lambda','μ':'mu','ν':'nu','ξ':'xi','π':'pi','ρ':'rho','σ':'sigma','τ':'tau','φ':'phi','ϕ':'phi','χ':'chi','ψ':'psi','ω':'omega',
      'Γ':'gamma','Δ':'delta','Θ':'theta','Λ':'lambda','Π':'pi','Σ':'sigma','Φ':'phi','Ψ':'psi','Ω':'omega',
      '√':'sqrt','∫':'integral','≤':'less','≥':'greater','×':'times','·':'dot','÷':'divide','≈':'approx','∞':'infinity','°':'degree'
    };
    const STOP = new Set(['a','an','the','of','to','in','on','for','and','or','is','by','do','does','did','with','at','from','as','be','its','it']);
    function norm(s){
      s = String(s||'').toLowerCase().replace(/[\u2019\u2018']/g,'');
      let out='';
      for(let i=0;i<s.length;i++){ const ch=s[i]; out += GREEK[ch] ? ' '+GREEK[ch]+' ' : ch; }
      return out.normalize('NFD').replace(/[\u0300-\u036f]/g,'')
        .replace(/[²³⁴]/g,m=>m==='²'?'2':m==='³'?'3':'4')
        .replace(/(tion|sion|cion|cian|shun)/g,'shn')
        .replace(/ph/g,'f')
        .replace(/(\w)\1+/g,'$1'); // collapse double letters (typing habit)
    }
    function tokens(s){ return norm(s).split(/[^a-z0-9]+/).filter(t=>t.length); }
    function lev(a,b){
      if(a===b) return 0;
      const m=a.length, n=b.length;
      if(!m||!n) return m||n;
      if(Math.abs(m-n)>2) return 99;
      const dp=[]; for(let i=0;i<=m;i++){ dp[i]=[i]; for(let j=1;j<=n;j++) dp[i][j]=0; }
      for(let j=0;j<=n;j++) dp[0][j]=j;
      for(let i=1;i<=m;i++){ const ai=a[i-1]; for(let j=1;j<=n;j++){
        dp[i][j]=Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1]+(ai===b[j-1]?0:1));
      } }
      return dp[m][n];
    }
    const _stemCache = {};
    function stem(w){
      const c=_stemCache[w]; if(c!==undefined) return c;
      let res=w;
      if(w.length>=5){
        const SUF=['ational','tional','ation','ance','ence','ment','ness','ions','tion','ity','ious','ive','ous','al','ic','ing','er','ed','es','s'];
        for(let k=0;k<SUF.length;k++){
          const sf=SUF[k];
          if(w.length-sf.length>=4 && w.slice(w.length-sf.length)===sf){ res=w.slice(0,w.length-sf.length); break; }
        }
      }
      return _stemCache[w]=res;
    }
    function maskOf(s){
      let m=0;
      for(let i=0;i<s.length;i++){ const c=s.charCodeAt(i); m |= (c>=97&&c<=122) ? (1<<(c-97)) : (c>=48&&c<=57) ? (1<<26) : 0; }
      return m;
    }
    function popc(x){ x -= (x>>1)&0x55555555; x = (x&0x33333333)+((x>>2)&0x33333333); x = (x+(x>>4))&0x0f0f0f0f; return (x*0x01010101)>>24; }
    const _levCache = new Map();
    function levC(a,b){
      const key = a<b ? (a+'|'+b) : (b+'|'+a);
      const v=_levCache.get(key); if(v!==undefined) return v;
      const d=lev(a,b); if(_levCache.size>8000) _levCache.clear(); _levCache.set(key,d); return d;
    }
    function levScore(a,b,L){
      const d=levC(a,b);
      if(d===1) return L<=5 ? 0.85 : 0.90;
      if(d===2) return L>=6 ? 0.78 : -1;
      if(d===3) return L>=8 ? 0.70 : -1;
      return -1;
    }
    function simRaw(qS,qm,tS,tm){
      if(qS===tS) return 1;
      const ql=qS.length, tl=tS.length;
      if(tS.indexOf(qS)===0 && ql>=3) return 0.95;
      if(qS.indexOf(tS)===0 && tl>=3 && ql===tl+1) return 0.92;
      if(tS.indexOf(qS)>0 && ql>=3) return 0.9;
      if(ql<3 || tl<3) return -1;
      if(Math.abs(ql-tl)>2) return -1;
      if(popc(qm & ~tm) > 3) return -1;
      return levScore(qS,tS,Math.max(ql,tl));
    }
    function tokSim(q,t){
      let best=simRaw(q.w,q.m,t.w,t.m);
      if(best<0.9){
        best=Math.max(best, simRaw(q.st,q.sm,t.w,t.m));
        if(best<0.9){
          best=Math.max(best, simRaw(q.w,q.m,t.st,t.sm));
          if(best<0.9) best=Math.max(best, simRaw(q.st,q.sm,t.st,t.sm));
        }
      }
      return best;
    }
    function _mk(w){ return { w:w, st:stem(w), m:maskOf(w), sm:maskOf(stem(w)) }; }
    function pools(c){
      if(c._p) return c._p;
      return c._p = {
        hi: tokens(c.t).map(_mk),
        mid: tokens(c.chapter).concat(tokens(c.subject), tokens('class '+c.cls)).map(_mk),
        low: tokens(c.search).map(_mk)
      };
    }
    function scoreCard(qt,c){
      const p=pools(c);
      const qq = qt.map(function(tt){ return { w:tt, st:stem(tt), m:maskOf(tt), sm:maskOf(stem(tt)) }; });
      let total=0, matched=0, bestAny=0, fuzzy=false;
      for(const qx of qq){
        let best=-1, bf=false, w=0;
        for(const t of p.hi){ const s=tokSim(qx,t); if(s>best){ best=s; bf=s<0.94; w=1; } }
        if(best<0){ for(const t of p.mid){ const s=tokSim(qx,t); if(s>best){ best=s; bf=s<0.94; w=0.9; } } }
        if(best<0){ for(const t of p.low){ const s=tokSim(qx,t); if(s>best){ best=s; bf=s<0.94; w=0.7; } } }
        if(best<0) continue;
        if(best>bestAny) bestAny=best;
        total += best * w;
        matched++; if(bf) fuzzy=true;
      }
      if(!matched) return null;
      const minCov = qt.length===1 ? 1 : Math.ceil(qt.length*0.5);
      if(matched < minCov || bestAny < 0.7) return null;
      return { score: total + (matched>=qt.length?0.15:0), coverage: matched/qt.length, fuzzy:fuzzy };
    }
    function run(list, qt){
      const out=[];
      for(const c of list){ const r=scoreCard(qt,c); if(r) out.push({card:c, score:r.score, coverage:r.coverage, fuzzy:r.fuzzy}); }
      out.sort(function(a,b){ return (b.coverage-a.coverage) || (b.score-a.score); });
      return out;
    }
    function search(raw){
      const q=norm(raw||'');
      const qt=tokens(q).filter(t=>!STOP.has(t));
      if(!qt.length) return { formulas:[], derivations:[], laws:[], fuzzy:false, tokens:[] };
      if(qt.join('').length<2) return { formulas:[], derivations:[], laws:[], fuzzy:false, tokens:[] };
      const formulas=run(CARDS,qt), derivations=run(DCARDS,qt), laws=run(LCARDS,qt);
      return { formulas:formulas, derivations:derivations, laws:laws,
               fuzzy: formulas.some(m=>m.fuzzy)||derivations.some(m=>m.fuzzy)||laws.some(m=>m.fuzzy), tokens:qt };
    }
    return { search:search, tokens:tokens, STOP:STOP };
  })();
