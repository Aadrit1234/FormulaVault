      ? '<div class="const-box">' + c.consts.map(x=>'<div>'+x+'</div>').join('') + '</div>'
      : '';
    const casesHTML = (c.cases && c.cases.length)
      ? '<div class="case-box" style="--accent-c:'+accent+'"><span class="case-label">Special cases</span><ul>' + c.cases.map(x=>'<li>'+x+'</li>').join('') + '</ul></div>'
      : '';
    const tipHTML = c.tip ? '<div class="tip-box"><b>Tip — </b>'+c.tip+'</div>' : '';
    return (
      '<div class="card-outer" data-idx="'+idx+'" tabindex="0" role="button" aria-label="'+c.t+', tap to flip">'+
        '<div class="card-inner">'+
          '<div class="face face-front" style="--accent-c:'+accent+'">'+
            '<div class="card-actions">'+
              '<button class="card-btn fv-fav'+(window.__fvIsFav&&window.__fvIsFav(c)?' active':'')+'" data-fav="'+idx+'" title="Bookmark" aria-label="Bookmark formula">'+(window.__fvIsFav&&window.__fvIsFav(c)?window.__I.starFilled:window.__I.star)+'</button>'+
              '<button class="card-btn fv-explain" data-explain="'+idx+'" title="Explain with AI" aria-label="Explain with AI">'+window.__I.sparkles+'</button>'+
            '</div>'+
            tag +
            '<div class="card-title">'+titleHTML+'</div>'+
            '<div class="card-eq">'+c.eq+'</div>'+
            '<div class="card-hint">'+flipSVG()+' tap to flip</div>'+
          '</div>'+
          '<div class="face face-back" style="--accent-c:'+accent+'">'+
            '<div class="back-chapter">'+c.chapter+'</div>'+
            symHTML +
            constsHTML +
            casesHTML +
            tipHTML +
          '</div>'+
        '</div>'+
      '</div>'
    );
  }

  function derivCardHTML(d, idx, hl){
    const accent = ACCENT[d.subject] || "#1D64D8";
    const titleHTML = hl ? hl(d.t) : d.t;
    const givenHTML = d.given ? '<div class="deriv-given"><b>Given — </b>'+d.given+'</div>' : '';
    const stepsHTML = d.steps.length
      ? '<ol class="deriv-steps">' + d.steps.map(s=>'<li>'+s+'</li>').join('') + '</ol>'
      : '';
    const resultHTML = d.result
      ? '<div class="deriv-result"><span class="deriv-result-label">Result</span><div class="deriv-result-eq">'+d.result+'</div></div>'
      : '';
    return (
      '<div class="deriv-card" data-idx="'+idx+'" style="--accent-c:'+accent+'">'+
        '<div class="deriv-head" tabindex="0" role="button" aria-label="'+d.t+', tap to expand">'+
          '<div class="deriv-head-text">'+
            '<span class="deriv-tag">Class '+d.cls+' • '+SUBJECT_LABEL[d.subject]+' • '+d.chapter+'</span>'+
            '<span class="deriv-title">'+titleHTML+'</span>'+
          '</div>'+
          '<svg class="deriv-chevron" viewBox="0 0 24 24" fill="none"><path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'+
        '</div>'+
        '<div class="deriv-body"><div class="deriv-body-inner">'+
          givenHTML + stepsHTML + resultHTML +
        '</div></div>'+
      '</div>'
    );
  }

  function lawCardHTML(l, idx, hl){
    const accent = ACCENT[l.subject] || "#1D64D8";
    const titleHTML = hl ? hl(l.t) : l.t;
    const statementHTML = l.statement ? '<div class="law-statement">'+l.statement+'</div>' : '';
    const multipartHTML = l.multipart ? '<span class="law-multipart">'+l.multipart+'</span>' : '';
    const termsHTML = l.terms.length
      ? '<span class="law-section-label">Key terms</span><ul class="law-terms">' + l.terms.map(s=>'<li><b>'+s[0]+'</b><span>'+s[1]+'</span></li>').join('') + '</ul>'
      : '';
    const formulasHTML = l.formulas.length
      ? '<span class="law-section-label">Formulas that follow from this law</span><ul class="law-formulas">' + l.formulas.map(x=>'<li>'+x+'</li>').join('') + '</ul>'
      : '';
    const tipHTML = l.tip ? '<div class="tip-box"><b>Tip — </b>'+l.tip+'</div>' : '';
    return (
      '<div class="law-card" data-idx="'+idx+'" style="--accent-c:'+accent+'">'+
        '<div class="deriv-head" tabindex="0" role="button" aria-label="'+l.t+', tap to expand">'+
          '<div class="deriv-head-text">'+
            '<span class="deriv-tag">Class '+l.cls+' • '+SUBJECT_LABEL[l.subject]+' • '+l.chapter+'</span>'+
            '<span class="deriv-title">'+titleHTML+'</span>'+
          '</div>'+
          '<svg class="deriv-chevron" viewBox="0 0 24 24" fill="none"><path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'+
        '</div>'+
        '<div class="deriv-body"><div class="deriv-body-inner">'+
          multipartHTML + statementHTML + termsHTML + formulasHTML + tipHTML +
        '</div></div>'+
      '</div>'
    );
  }

  function getChaptersFor(cls, subject, mode){
    const m = mode || state.mode;
    const src = m === 'formulas' ? DATA : (m === 'derivations' ? DERIVATIONS : LAWS);
    return src.filter(d=>d.cls===cls && d.subject===subject).map(d=>d.chapter);
  }

  function renderChips(){
    const chapters = getChaptersFor(state.cls, state.subject);
    let html = '';
    chapters.forEach(ch=>{
      html += '<button class="chip'+(state.chapter===ch?" active":"")+'" data-chapter="'+ch.replace(/"/g,'&quot;')+'">'+ch+'</button>';
    });
    chapterChips.innerHTML = html;
  }

  function renderCards(){
    if(state.query.trim()){ renderUniversalSearch(); return; }
    if(state.mode === 'derivations'){ renderDerivationCards(); return; }
    if(state.mode === 'laws'){ renderLawCards(); return; }
    let html = '';
    let count = 0;
    const chaptersData = DATA.filter(d=>d.cls===state.cls && d.subject===state.subject &&
      d.chapter===state.chapter);

    if(chaptersData.length === 0){
      html = '<div class="empty-state"><h3>Nothing here yet</h3><p>Try a different chapter or subject.</p></div>';
    } else {
      chaptersData.forEach(ch=>{
        html += '<div class="chapter-heading"><h2>'+ch.chapter+'</h2><span>'+ch.formulas.length+' formulas</span></div>';
        ch.formulas.forEach(f=>{
          const idx = CARDS.findIndex(c=>c.cls===ch.cls && c.subject===ch.subject && c.chapter===ch.chapter && c.t===f.t);
          html += cardHTML(CARDS[idx], idx, false);
          count++;
        });
      });
    }
    controlsWrap.style.opacity = '1';
    controlsWrap.style.pointerEvents = 'auto';
    grid.innerHTML = html;
    countPill.textContent = count + (count===1 ? ' formula' : ' formulas');
  }

  function escQ(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function makeHL(qRaw){
    const qt = SEARCH.tokens(qRaw).filter(function(t){ return t.length>=2 && !SEARCH.STOP.has(t); });
    if(!qt.length) return null;
    return function(text){
      let out = escQ(text);
      qt.forEach(function(tkn){
        out = out.replace(new RegExp('('+tkn.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'), '<mark>$1</mark>');
      });
      return out;
    };
  }
  function renderUniversalSearch(){
    const q = state.query.trim();
    const rawTokens = SEARCH.tokens(q);
    let html = '';
    if(!rawTokens.length){
      html = '<div class="empty-state"><h3>Keep typing…</h3><p>Search works across formulas, derivations and laws — even for misspellings.</p></div>';
      grid.innerHTML = html;
      countPill.textContent = '';
      controlsWrap.style.opacity = '0.4';
      controlsWrap.style.pointerEvents = 'none';
      return;
    }
    const res = SEARCH.search(q);
    const hl = makeHL(q);
    if(!res.tokens.length){
      html = '<div class="empty-state"><h3>Be more specific…</h3><p>Those words are all ignored as filler. Try adding a real term — like "projectile", "pH", or "lambda".</p></div>';
      controlsWrap.style.opacity = '0.4';
      controlsWrap.style.pointerEvents = 'none';
      grid.innerHTML = html;
      countPill.textContent = '';
      return;
    }
    const cap = function(list,n){ return { list: list.slice(0,n), total: list.length }; };
    const cf = cap(res.formulas,60), cd = cap(res.derivations,30), cl = cap(res.laws,30);
    const total = cf.total + cd.total + cl.total;

    if(!total){
      html = '<div class="empty-state"><h3>No matches for "'+escQ(q)+'"</h3><p>Even after typo-correction and symbol lookup, nothing matched. Try simpler words — like "projectile", "pH", or "lambda".</p></div>';
    } else {
      if(res.fuzzy){
        html += '<div class="deriv-note">Typo-aware search — best matches for "'+escQ(q)+'" across <b>all classes &amp; subjects</b>.</div>';
      }
      if(cf.list.length){
        html += '<div class="chapter-heading"><h2>Formulas</h2><span>'+(cf.total>cf.list.length ? cf.list.length+' of '+cf.total+' · top matches' : cf.total+' found')+'</span></div>';
        cf.list.forEach((m)=>{ html += cardHTML(m.card, CARDS.indexOf(m.card), true, hl); });
      }
      if(cd.list.length){
        html += '<div class="chapter-heading"><h2>Derivations</h2><span>'+(cd.total>cd.list.length ? cd.list.length+' of '+cd.total+' · top matches' : cd.total+' found')+'</span></div>';
        cd.list.forEach((m)=>{ html += derivCardHTML(m.card, DCARDS.indexOf(m.card), hl); });
      }
      if(cl.list.length){
        html += '<div class="chapter-heading"><h2>Laws</h2><span>'+(cl.total>cl.list.length ? cl.list.length+' of '+cl.total+' · top matches' : cl.total+' found')+'</span></div>';
        cl.list.forEach((m)=>{ html += lawCardHTML(m.card, LCARDS.indexOf(m.card), hl); });
      }
    }
    controlsWrap.style.opacity = '0.4';
    controlsWrap.style.pointerEvents = 'none';
    grid.innerHTML = html;
    countPill.textContent = total + (total===1 ? ' result' : ' results');
  }

  function renderLawCards(){
    let html = '';
    let count = 0;
    const chaptersData = LAWS.filter(d=>d.cls===state.cls && d.subject===state.subject &&
      d.chapter===state.chapter);

    if(chaptersData.length === 0){
      html = '<div class="deriv-note">No curated named laws for this selection yet — many chapters (like most of Organic Chemistry, or Application of Derivatives in Math) are built on techniques and formulas rather than a single named law. Try Physics or Chemistry, Class 11 or 12, for the fullest coverage.</div>';
    } else {
      chaptersData.forEach(ch=>{
        html += '<div class="chapter-heading"><h2>'+ch.chapter+'</h2><span>'+ch.laws.length+' law'+(ch.laws.length===1?'':'s')+'</span></div>';
        ch.laws.forEach(l=>{
          const idx = LCARDS.findIndex(c=>c.cls===ch.cls && c.subject===ch.subject && c.chapter===ch.chapter && c.t===l.t);
          html += lawCardHTML(LCARDS[idx], idx);
          count++;
        });
      });
    }
    controlsWrap.style.opacity = '1';
    controlsWrap.style.pointerEvents = 'auto';
    grid.innerHTML = html;
    countPill.textContent = count + (count===1 ? ' law' : ' laws');
  }

  function renderDerivationCards(){
    let html = '';
    let count = 0;
    const chaptersData = DERIVATIONS.filter(d=>d.cls===state.cls && d.subject===state.subject &&
      d.chapter===state.chapter);

    if(chaptersData.length === 0){
      html = '<div class="deriv-note">No curated derivations for this selection yet — this app prioritises CBSE-board and JEE-critical derivations rather than covering every formula, since many (like Ohm\'s Law or F=ma) are definitions or postulates rather than derived results. Try Class 12 for more coverage, or switch back to Formulas.</div>';
    } else {
      chaptersData.forEach(ch=>{
        html += '<div class="chapter-heading"><h2>'+ch.chapter+'</h2><span>'+ch.derivations.length+' derivation'+(ch.derivations.length===1?'':'s')+'</span></div>';
        ch.derivations.forEach(d=>{
          const idx = DCARDS.findIndex(c=>c.cls===ch.cls && c.subject===ch.subject && c.chapter===ch.chapter && c.t===d.t);
          html += derivCardHTML(DCARDS[idx], idx);
          count++;
        });
      });
    }
    controlsWrap.style.opacity = '1';
    controlsWrap.style.pointerEvents = 'auto';
    grid.innerHTML = html;
    countPill.textContent = count + (count===1 ? ' derivation' : ' derivations');
  }

  const renderHooks = [];
  function renderAll(){
    renderChips();
    renderCards();
    renderHooks.forEach(function(cb){ try{ cb(); }catch(e){} });
  }

  /* ---------- events ---------- */
  document.getElementById('modeSeg').addEventListener('click', e=>{
    const btn = e.target.closest('button');
    if(!btn) return;
    document.querySelectorAll('#modeSeg button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.mode = btn.dataset.mode;
    state.query = '';
    searchInput.value = '';
    clearBtn.classList.remove('show');
    searchInput.placeholder = 'Search everything — formulas, derivations & laws (typo-friendly)…';
    restoreChapterFor(state.mode, state.cls, state.subject);
    _scrollPending = true;
    renderAll();
    writeLast();
    scrollToItem();
  });

  document.getElementById('classSeg').addEventListener('click', e=>{
    const btn = e.target.closest('button');
    if(!btn) return;
    document.querySelectorAll('#classSeg button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.cls = btn.dataset.class;
    restoreChapterFor(state.mode, state.cls, state.subject);
    _scrollPending = true;
    renderAll();
    writeLast();
    scrollToItem();
  });

  document.getElementById('subjectSeg').addEventListener('click', e=>{
    const btn = e.target.closest('button');
    if(!btn) return;
    document.querySelectorAll('#subjectSeg button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.subject = btn.dataset.subject;
    restoreChapterFor(state.mode, state.cls, state.subject);
    _scrollPending = true;
    renderAll();
    writeLast();
    scrollToItem();
  });

  chapterChips.addEventListener('click', e=>{
    const btn = e.target.closest('.chip');
    if(!btn) return;
    state.chapter = btn.dataset.chapter;
    const last=readLast();
    const ck=lastKey();
    state.item = last && last.items ? (last.items[ck+'|'+state.chapter]||null) : null;
    renderChips();
    renderCards();
    restoreOpenItem();
    writeLast();
  });

  function toggleAccordion(accordion){
    const opening=!accordion.classList.contains('open');
    accordion.classList.toggle('open');
    if(opening){
      const titleEl=accordion.querySelector('.deriv-title');
      state.item=titleEl?titleEl.textContent.trim():null;
      writeLast();
    }
  }

  grid.addEventListener('click', e=>{
    if(e.target.closest('.card-btn')) return;
    const dhead = e.target.closest('.deriv-head');
    if(dhead){
      const accordion = dhead.closest('.deriv-card, .law-card');
      if(accordion) toggleAccordion(accordion);
      return;
    }
    const card = e.target.closest('.card-outer');
    if(!card) return;
    card.classList.toggle('flipped');
  });
  grid.addEventListener('keydown', e=>{
    if(e.key !== 'Enter' && e.key !== ' ') return;
    const dhead = e.target.closest('.deriv-head');
    if(dhead){
      e.preventDefault();
      const accordion = dhead.closest('.deriv-card, .law-card');
      if(accordion) toggleAccordion(accordion);
      return;
    }
    const card = e.target.closest('.card-outer');
    if(!card) return;
    e.preventDefault();
    card.classList.toggle('flipped');
  });

  searchInput.addEventListener('input', e=>{
    state.query = e.target.value;
    clearBtn.classList.toggle('show', state.query.length > 0);
    clearTimeout(_searchTimer);
    if(SEARCH.tokens(state.query).length===0){
      renderCards();
      return;
    }
    _searchTimer = setTimeout(renderCards, 140);
  });
  clearBtn.addEventListener('click', ()=>{
    searchInput.value = '';
    state.query = '';
    clearBtn.classList.remove('show');
    searchInput.focus();
    renderCards();
  });

  window.FV = {
    state: state, CARDS: CARDS, DCARDS: DCARDS, LCARDS: LCARDS,
    DATA: DATA, DERIVATIONS: DERIVATIONS, LAWS: LAWS,
    ACCENT: ACCENT, SUBJECT_LABEL: SUBJECT_LABEL,
    renderAll: renderAll,
    onRender: function(cb){ renderHooks.push(cb); },
    strip: function(s){ return String(s).replace(/<[^>]*>/g,''); }
  };
  renderHooks.push(restoreOpenItem);
  renderAll();
  scrollToItem();
})();
</script>
<script>
(function(){
"use strict";
const FV = window.FV;
if(!FV) return;
const state = FV.state, CARDS = FV.CARDS, DCARDS = FV.DCARDS, LCARDS = FV.LCARDS;
const DATA = FV.DATA, DERIVATIONS = FV.DERIVATIONS, LAWS = FV.LAWS;
const ACCENT = FV.ACCENT, SUBJ = FV.SUBJECT_LABEL;
const $ = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.prototype.slice.call((r||document).querySelectorAll(s));

/* ============ storage & user data ============ */
const store = {
  get(k,d){ try{ const v=localStorage.getItem('fvault:'+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem('fvault:'+k, JSON.stringify(v)); }catch(e){} }
};
let favs = store.get('favs', []); if(!Array.isArray(favs)) favs=[];
let sheets = store.get('sheets', 0); if(!Number.isFinite(sheets)||sheets<0) sheets=0;
let study = store.get('study', {}); if(!study||typeof study!=='object'||Array.isArray(study)) study={};
let settings = store.get('settings', {provider:'auto'});
if(!settings||typeof settings!=='object'||Array.isArray(settings)) settings={provider:'auto'};
if(typeof settings.provider!=='string'||['auto','groq','google','openrouter'].indexOf(settings.provider)===-1) settings.provider='auto';
if(!settings.aiKeys||typeof settings.aiKeys!=='object') settings.aiKeys={};
['groq','google','openrouter'].forEach(function(p){ settings.aiKeys[p]=typeof settings.aiKeys[p]==='string'?settings.aiKeys[p]:''; });
function key(c){ return c.cls+'|'+c.subject+'|'+c.chapter+'|'+c.t; }
function saveAll(){ store.set('favs',favs); store.set('sheets',sheets); store.set('study',study); store.set('settings',settings); }
window.__fvIsFav = function(c){ return favs.indexOf(key(c))!==-1; };

/* ============ helpers ============ */
function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function stripHtml(s){ const d=document.createElement('div'); d.innerHTML=s||''; return (d.textContent||'').replace(/\s+/g,' ').trim(); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

function toast(msg, ms){
  const host=$('#fvToasts'); if(!host) return;
  const d=document.createElement('div'); d.className='fv-toast'; d.innerHTML='<span>•</span>'+escHtml(msg);
  host.appendChild(d); requestAnimationFrame(()=>d.classList.add('show'));
  setTimeout(()=>{ d.classList.remove('show'); setTimeout(()=>d.remove(),350); }, ms||2600);
}
window.addEventListener('error', function(e){ try{ toast(e.error&&e.error.message?e.error.message:(e.message||'Unexpected error')); }catch(_){ } });
window.addEventListener('unhandledrejection', function(e){ try{ toast(e.reason&&e.reason.message?e.reason.message:'Promise failed'); }catch(_){ } });
function confetti(n){
  n=n||90; const colors=['#1D64D8','#0E93AE','#5457D9','#FF9F0A','#2fbf71','#FF375F'];
  for(let i=0;i<n;i++){ const p=document.createElement('i'); p.className='fv-confetti';
    p.style.left=Math.random()*100+'vw'; p.style.background=colors[i%colors.length];
    p.style.animationDelay=(Math.random()*0.4)+'s'; p.style.animationDuration=(1.6+Math.random()*1.4)+'s';
    p.style.setProperty('--rx',(Math.random()*720-360)+'deg'); p.style.setProperty('--sz',(6+Math.random()*7)+'px');
    document.body.appendChild(p); setTimeout(()=>p.remove(),3400); }
}

/* ============ scroll reveal ============ */
const io = ('IntersectionObserver' in window) ? new IntersectionObserver(function(es){ es.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add('fv-in'); io.unobserve(en.target); } }); }, {rootMargin:'0px 0px -6% 0px', threshold:0.05}) : null;
function reveal(){
  $$('#grid > *').forEach(function(el,i){
    if(!el.classList.contains('fv-reveal')){ el.classList.add('fv-reveal'); if(io){ el.style.transitionDelay=Math.min((i%12)*40,420)+'ms'; io.observe(el); } else el.classList.add('fv-in'); }
  });
  setTimeout(function(){ $$('#grid .fv-reveal:not(.fv-in)').forEach(el=>el.classList.add('fv-in')); }, 1700);
}

/* ============ overlay framework ============ */
const hostEl = $('#fvOverlayHost');
let overlayStack = [];
function openOverlay(html, cls){
  const w=document.createElement('div'); w.className='fv-ov '+(cls||'');
  w.innerHTML='<div class="fv-ov-back"></div><div class="fv-ov-panel">'+html+'</div>';
  hostEl.appendChild(w); requestAnimationFrame(()=>w.classList.add('open'));
  w.addEventListener('click', e=>{ if(e.target.closest('[data-close]')||e.target.classList.contains('fv-ov-back')) closeOverlay(w); });
  overlayStack.push(w); document.addEventListener('keydown', escFor);
  return w;
}
function escFor(e){ if(e.key==='Escape'&&overlayStack.length){ closeOverlay(overlayStack[overlayStack.length-1]); } }
function closeOverlay(w){
  w = w||overlayStack[overlayStack.length-1]; if(!w) return;
  w.classList.remove('open'); overlayStack=overlayStack.filter(x=>x!==w);
  setTimeout(()=>w.remove(),280);
  if(!overlayStack.length) document.removeEventListener('keydown', escFor);
}

/* ============ AI engine (Groq → Google → OpenRouter) — bring your own API key ============ */
/* Keys are never baked into the code: you paste them in AI Settings and they are
   saved only in this browser's localStorage (settings.aiKeys). Auto mode tries every
   provider that has a key configured. */
const AI = (function(){
  const MODELS = {
    groq:['qwen/qwen3.8-27b','openai/gpt-oss-120b'],
    google:['gemini-3.5-flash-lite','gemini-2.5-flash'],
    openrouter:['deepseek/deepseek-chat-v3.1','meta-llama/llama-4-maverick']
  };
  const LABEL = { groq:'Groq', google:'Google AI', openrouter:'OpenRouter' };
  const HELP = {
    groq:'https://console.groq.com/keys',
    google:'https://aistudio.google.com/apikey',
    openrouter:'https://openrouter.ai/keys'
  };
  const keyTips = {
    groq:'Paste your Groq key — starts with gsk_…',
    google:'Paste your Google AI Studio key — starts with AIza… or AQ.…',
    openrouter:'Paste your OpenRouter key — starts with sk-or-v1-…'
  };

  function keyFor(p){ const k=(settings.aiKeys&&settings.aiKeys[p])||''; return String(k).trim(); }
  function hasKey(p){ return !!keyFor(p); }
  function configured(){ return ['groq','google','openrouter'].filter(hasKey); }
  function errNoKey(p){
    const e=new Error('No '+LABEL[p]+' API key yet — get one free at '+HELP[p]+' and paste it in AI Settings.');
    e.code='AI_NO_KEY'; e.provider=p; return e;
  }
  function errBadKey(p, msg){
    const e=new Error(msg||(LABEL[p]+' rejected that API key. Double-check it at '+HELP[p]));
    e.code='AI_BAD_KEY'; e.provider=p; return e;
  }

  async function* sseChunks(res){
    const reader=res.body.getReader(); const dec=new TextDecoder(); let buf='';
    while(true){ const r=await reader.read(); if(r.done) break; buf+=dec.decode(r.value,{stream:true});
      let idx; while((idx=buf.indexOf('\n'))>=0){ const line=buf.slice(0,idx).trim(); buf=buf.slice(idx+1);
        if(!line||line.indexOf('data:')!==0) continue; const payload=line.slice(5).trim();
        if(payload==='[DONE]') return; yield payload; } }
  }

  async function callProvider(p, model, messages, o){
    const KEY=keyFor(p);
    if(!KEY) throw errNoKey(p);
    const sys = messages.filter(m=>m.role==='system').map(m=>m.content).join('\n\n');
    const rest = messages.filter(m=>m.role!=='system');
    let url, init;
    if(p==='groq'||p==='openrouter'){
      url = p==='groq' ? 'https://api.groq.com/openai/v1/chat/completions' : 'https://openrouter.ai/api/v1/chat/completions';
      const headers={'Content-Type':'application/json','Authorization':'Bearer '+KEY};
      if(p==='openrouter'){ headers['HTTP-Referer']='https://formula-vault.app'; headers['X-Title']='Formula Vault'; }
      init={ method:'POST', headers, body: JSON.stringify({ model, messages: messages, stream:true, temperature:0.55, max_tokens:o.maxTokens||1800 }), signal:o.signal };
    } else {
      url='https://generativelanguage.googleapis.com/v1beta/models/'+model+':streamGenerateContent?alt=sse&key='+encodeURIComponent(KEY);
      const body={ contents: rest.map(m=>({ role: m.role==='assistant'?'model':'user', parts:[{text:m.content}] })), generationConfig:{ temperature:0.55, maxOutputTokens:o.maxTokens||1800 } };
      if(sys) body.systemInstruction={ parts:[{text:sys}] };
      init={ method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body), signal:o.signal };
    }
    const res=await fetch(url, init);
    if(!res.ok){
      let em=''; try{ const j=await res.json(); em=(j.error&&(j.error.message||j.error.msg))||''; }catch(e){}
      if(res.status===401||res.status===403) throw errBadKey(p, LABEL[p]+' rejected this API key ('+res.status+'). Check it at '+HELP[p]);
      throw new Error(LABEL[p]+' '+res.status+(em?': '+em:''));
    }
    let got=false;
    for await (const payload of sseChunks(res)){
      let j; try{ j=JSON.parse(payload); }catch(e){ continue; }
      let piece='';
      if(p==='google'){ const c=j.candidates&&j.candidates[0]; if(c&&c.content&&c.content.parts) piece=c.content.parts.filter(pt=>pt.text&&!pt.thought).map(pt=>pt.text).join(''); }
      else { const d=j.choices&&j.choices[0]&&(j.choices[0].delta||j.choices[0].message); if(d&&d.content) piece=d.content; }
      if(piece){ got=true; if(o.onDelta) o.onDelta(piece); }
    }
    if(!got) throw new Error(LABEL[p]+' returned no text');
    return true;
  }

  function serverMode(){ return typeof location!=='undefined' && /^https?:$/.test(location.protocol||''); }
  async function serverChat(messages, o){
    const res=await fetch('/api/ai', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ messages: messages, provider: settings.provider||'auto', maxTokens: o.maxTokens||1800 }),
      signal: o.signal });
    if(!res.ok){
      let j=null; try{ j=await res.json(); }catch(e){}
      const msg = j&&j.error ? (j.error.message||'AI server error') : ('AI server unavailable ('+res.status+')');
      const err = new Error(msg);
      if(j&&j.error&&j.error.code){ err.code=j.error.code; err.provider=j.error.provider; }
      throw err;
    }
    const reader=res.body.getReader(); const dec=new TextDecoder(); let buf='', acc='', got=false;
    while(true){
      const r=await reader.read(); if(r.done) break;
      buf+=dec.decode(r.value,{stream:true});
      let idx;
      while((idx=buf.indexOf('\n'))>=0){
        const line=buf.slice(0,idx).trim(); buf=buf.slice(idx+1);
        if(!line) continue;
        let j; try{ j=JSON.parse(line); }catch(e){ continue; }
        if(j.error){ const err=new Error(j.error.message||'AI server error'); if(j.error.code) err.code=j.error.code; err.provider=j.error.provider; throw err; }
        if(j.delta!=null){ got=true; acc+=j.delta; if(o.onDelta) o.onDelta(j.delta); }
      }
    }
    if(!got&&!acc){ const e=new Error('AI server returned no response'); e.code='AI_EMPTY'; throw e; }
    return { provider:'server', model:'server' };
  }

  async function chat(messages, o){
    o=o||{};
    if(serverMode()&&!o.noServer){
      try{ return await serverChat(messages.slice(-14), o); }
      catch(e){
        if(e&&e.name==='AbortError') throw e;
      }
    }
    let order = settings.provider==='auto' ? configured() : (hasKey(settings.provider)?[settings.provider]:[]);
    if(!order.length){ const e=new Error('No AI provider configured yet. Open AI Settings and paste a free API key for Groq, Google or OpenRouter — it stays on your device.'); e.code='AI_NO_KEY'; throw e; }
    let streamed=false; let lastErr=null;
    const od = t=>{ streamed=true; if(o.onDelta) o.onDelta(t); };
    for(const p of order){
      for(const model of MODELS[p]){
        if(o.onStatus) o.onStatus(LABEL[p]+' · '+model.split('/').pop());
        try{ await callProvider(p, model, messages, Object.assign({},o,{onDelta:od})); return {provider:p, model:model}; }
        catch(e){ if(e&&e.name==='AbortError') throw e; lastErr=e; if(streamed||e.code==='AI_NO_KEY'||e.code==='AI_BAD_KEY') throw e; }
      }
    }
    throw lastErr||new Error('All AI providers failed');
  }

  async function testKey(p){
    const KEY=keyFor(p); if(!KEY) throw errNoKey(p);
    if(p==='google'){
      const url='https://generativelanguage.googleapis.com/v1beta/models/'+MODELS.google[0]+':generateContent?key='+encodeURIComponent(KEY);
      const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:'Reply with exactly: OK'}]}],generationConfig:{maxOutputTokens:5}})});
      if(!res.ok){ let em=''; try{ const j=await res.json(); em=(j.error&&j.error.message)||''; }catch(e){} throw errBadKey(p, em?em:(LABEL[p]+' '+res.status)); }
      return true;
    }
    const url = p==='groq' ? 'https://api.groq.com/openai/v1/chat/completions' : 'https://openrouter.ai/api/v1/chat/completions';
    const body={ model:MODELS[p][0], messages:[{role:'user',content:'Reply with exactly: OK'}], max_tokens:5, stream:false };
    const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+KEY},body:JSON.stringify(body)});
    if(!res.ok){ let em=''; try{ const j=await res.json(); em=(j.error&&(j.error.message||j.error.msg))||''; }catch(e){} throw errBadKey(p, em?em:(LABEL[p]+' '+res.status)); }
    return true;
  }

  return { chat:chat, testKey:testKey, LABEL:LABEL, HELP:HELP, keyTips:keyTips, hasKey:hasKey, configured:configured, serverMode:serverMode };
})();

/* ============ MathJax (lazy) ============ */
let mjPromise=null;
function loadMathJax(){
  if(mjPromise) return mjPromise;
  mjPromise=new Promise(function(res){
    window.MathJax={ tex:{ inlineMath:[['\\(','\\)']], displayMath:[['\\[','\\]']] }, chtml:{ displayAlign:'left' }, startup:{ typeset:false } };
    const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js'; s.async=true;
    s.onload=res; s.onerror=res; document.head.appendChild(s); setTimeout(res,9000);
  });
  return mjPromise;
}
function typeset(el){
  if(window.MathJax&&window.MathJax.typesetPromise){ try{ window.MathJax.typesetPromise([el]); }catch(e){} }
  else loadMathJax().then(function(){ try{ if(window.MathJax&&window.MathJax.typesetPromise) window.MathJax.typesetPromise([el]); }catch(e){} });
}

function fmtN(x,d){
  if(typeof x!=='number'||!isFinite(x)) return '—';

  const a=Math.abs(x);
  if(a>=1e6||(a<1e-4&&a>0)) return Number(x.toExponential(d)).toString();

}

function openPalette(){
  const items=buildPaletteItems();
  const w=openOverlay('<input class="fv-pal-input" id="palIn" placeholder="Type a command or jump to a chapter…"><div class="fv-pal-list" id="palList"></div>','palette');
  const list=w.querySelector('#palList'); const input=w.querySelector('#palIn');
  let sel=0, shown=items;
  function draw(){
    const q=input.value.trim().toLowerCase();
    shown=q?items.filter(it=>it.t.toLowerCase().indexOf(q)!==-1):items; sel=0;
    list.innerHTML=shown.length?shown.map((it,i)=>'<div class="fv-pal-item'+(i===sel?' sel':'')+'" data-i="'+i+'">'+escHtml(it.t)+(it.k?'<span class="k">'+it.k+'</span>':'')+'</div>').join(''):'<div class="fv-pal-empty">Nothing found</div>';
  }
  function hi(){ $$('.fv-pal-item',list).forEach((el,i)=>el.classList.toggle('sel',i===sel)); const s=list.querySelector('.fv-pal-item.sel'); if(s) s.scrollIntoView({block:'nearest'}); }
  list.onclick=e=>{ const it=e.target.closest('.fv-pal-item'); if(!it) return; const item=shown[+it.dataset.i]; closeOverlay(w); setTimeout(()=>item.run(),80); };
  input.oninput=draw;
  input.onkeydown=e=>{
    if(e.key==='ArrowDown'){ e.preventDefault(); sel=Math.min(sel+1,shown.length-1); hi(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); sel=Math.max(sel-1,0); hi(); }
    else if(e.key==='Enter'){ e.preventDefault(); const item=shown[sel]; if(item){ closeOverlay(w); setTimeout(()=>item.run(),80); } }
  };
  draw(); setTimeout(()=>input.focus(),100);
}  /* ============ wiring ============ */
  function updateFavBadge(){ const b=document.getElementById('fvFavCount'); if(b) b.textContent=favs.length||''; }
document.getElementById('grid').addEventListener('click', function(e){
  const fav=e.target.closest('.fv-fav');
  if(fav){ const c=CARDS[+fav.dataset.fav]; if(!c) return; const k=key(c);
    if(favs.indexOf(k)!==-1){ favs=favs.filter(x=>x!==k); fav.classList.remove('active'); fav.innerHTML=window.__I.star; }
    else{ favs.push(k); fav.classList.add('active'); fav.innerHTML=window.__I.starFilled; toast('Bookmarked — '+c.t.slice(0,42)); }
    store.set('favs',favs); updateFavBadge(); return; }
  const ex=e.target.closest('.fv-explain');
  if(ex){ const c=CARDS[+ex.dataset.explain]; if(c) openExplain(c); }
});
document.getElementById('fvBtnTutor').onclick=openTutor;
document.getElementById('fvBtnFavs').onclick=openFavs;
document.getElementById('fvBtnPalette').onclick=openPalette;
$$('[data-open]').forEach(function(b){ b.addEventListener('click',function(){ const fn={tutor:openTutor,sheet:openSheet,study:openStudy,calc:openCalc}[b.dataset.open]; if(fn) fn(); }); });
document.addEventListener('keydown', function(e){
  if((e.ctrlKey||e.metaKey)&&String(e.key).toLowerCase()==='k'){ e.preventDefault(); openPalette(); }
  else if(e.key==='/'&&overlayStack.length===0&&!/input|textarea|select/i.test(e.target.tagName||'')){ e.preventDefault(); openPalette(); }
});
FV.onRender(function(){ document.body.setAttribute('data-subject', state.subject); reveal(); });
updateFavBadge();
FV.renderAll();
window.__AI = AI;
})();
