     sym:[["Sn","Sum of the nth powers of the roots"]], tip:"A recurrence relation — once you know S0, S1 (trivial to find), you can generate S2, S3, … one at a time without ever computing α, β individually."},
    {t:"Location of Roots (relative to k, k1, k2)", eq:"Both roots &gt; k: D≥0, a·f(k)&gt;0, −b/2a &gt; k",
     sym:[["f(x)","= ax²+bx+c"]],
     cases:["Exactly one root in (k1,k2): f(k1)·f(k2) < 0","Roots on either side of k: a·f(k) < 0"],
     tip:"Always check all three conditions together for the 'both roots greater than k' case — missing the vertex condition (−b/2a > k) is the most common mistake."},
    {t:"Maximum/Minimum Value of a Quadratic", eq:"Value at vertex = −D/4a",
     sym:[], tip:"Minimum when a>0 (upward parabola), maximum when a<0 (downward parabola) — occurring at x = −b/2a."},
    {t:"Condition for a Quadratic to be Always Positive/Negative", eq:"Always positive: a &gt; 0 and D &lt; 0",
     sym:[],
     cases:["Always negative: a < 0 and D < 0"],
     tip:"D<0 alone only guarantees the parabola never touches the x-axis — you still need the sign of a to know which side (all-positive or all-negative) it sits on."}
  ]},

  {cls:"11", subject:"math", chapter:"Complex Numbers", formulas:[
    {t:"Modulus of a Complex Number", eq:"|z| = √(a² + b²) &nbsp; for z = a + ib",
     sym:[], tip:"Geometrically, |z| is the distance of the point (a, b) from the origin in the Argand plane."},
    {t:"Argument of a Complex Number", eq:"θ = tan<sup>−1</sup>(b/a)",
     sym:[["θ","Angle with the positive real axis"]], tip:"Always fix the quadrant of (a, b) first — the raw tan⁻¹(b/a) value alone can put you in the wrong quadrant."},
    {t:"Polar Form", eq:"z = r(cosθ + i sinθ)",
     sym:[["r","Modulus |z|"]],
     cases:["Euler form: z = re^(iθ)"],
     tip:"Polar form makes multiplication, division, and powers of complex numbers dramatically easier than Cartesian form."},
    {t:"z·z̄ and |z1 ± z2|²", eq:"z·z̄ = |z|²",
     sym:[["z̄","Complex conjugate of z"]],
     cases:["|z1 ± z2|² = |z1|² + |z2|² ± 2Re(z1z̄2)"],
     tip:"The second identity is exactly the parallelogram law in disguise — it's what proves the triangle inequality and its reverse form."},
    {t:"De Moivre's Theorem", eq:"(cosθ + i sinθ)ⁿ = cos nθ + i sin nθ",
     sym:[], tip:"The go-to tool for finding powers and roots of complex numbers — works for any rational n."},
    {t:"Cube Roots of Unity", eq:"1, ω, ω² &nbsp; where ω = " + frac("−1 + i√3","2"),
     sym:[["ω","Non-real cube root of unity"]], tip:"Key identity: 1 + ω + ω² = 0, and ω³ = 1 — both are used constantly to simplify expressions."},
    {t:"nth Roots of Unity (General)", eq:"z<sub>k</sub> = cos" + frac("2kπ","n") + " + i sin" + frac("2kπ","n") + ", k = 0,1,…,n−1",
     sym:[["n","Number of roots"]], tip:"All n roots lie evenly spaced on the unit circle in the Argand plane — they form the vertices of a regular n-gon."},
    {t:"Distance Between Two Complex Numbers", eq:"|z<sub>1</sub> − z<sub>2</sub>|",
     sym:[["z1, z2","Points in the Argand plane"]], tip:"Exactly the ordinary distance formula in disguise — treat z1 and z2 as points (a1,b1), (a2,b2) and this is √[(a1−a2)²+(b1−b2)²]."},
    {t:"Section Formula for Complex Numbers", eq:"z = " + frac("mz<sub>2</sub> + nz<sub>1</sub>","m + n"),
     sym:[["m:n","Ratio in which z divides the segment z1z2"]], tip:"The midpoint is the special case m=n: z=(z1+z2)/2 — identical in spirit to the Cartesian section formula."},
    {t:"Rotation Formula", eq:frac("z<sub>3</sub> − z<sub>1</sub>","z<sub>2</sub> − z<sub>1</sub>") + " = " + frac("|z<sub>3</sub> − z<sub>1</sub>|","|z<sub>2</sub> − z<sub>1</sub>|") + " e<sup>iθ</sup>",
     sym:[["θ","Angle ∠z2 z1 z3, measured from z1z2 to z1z3"]], tip:"The single most powerful tool for complex-number geometry problems — encodes both a rotation and a scaling in one line, avoiding messy coordinate geometry entirely."},
    {t:"Equation of a Circle (Complex Form)", eq:"|z − z0| = r",
     sym:[["z0","Centre, as a complex number"],["r","Radius"]],
     cases:["General form: zz̄ + āz + az̄ + b = 0, with centre −a and radius √(|a|²−b)"],
     tip:"The general form looks intimidating but is just |z−z0|=r expanded out — always check b is real and |a|²>b before trusting the radius formula."}
  ]},

  {cls:"11", subject:"math", chapter:"Sequences & Series", formulas:[
    {t:"nth Term of an AP", eq:"a<sub>n</sub> = a + (n − 1)d",
     sym:[["a","First term"],["d","Common difference"]], tip:"d can be negative — a decreasing AP is still an AP, don't assume terms must increase."},
    {t:"Sum of n Terms of an AP", eq:"S<sub>n</sub> = " + frac("n","2") + "[2a + (n − 1)d]",
     sym:[], tip:"Equivalently S_n = n/2 × (first term + last term) — often faster when the last term is already known."},
    {t:"nth Term of a GP", eq:"a<sub>n</sub> = ar<sup>n−1</sup>",
     sym:[["r","Common ratio"]], tip:"For three numbers in GP, the middle term is the geometric mean: b² = ac."},
    {t:"Sum of n Terms of a GP", eq:"S<sub>n</sub> = " + frac("a(rⁿ − 1)","r − 1"),
     sym:[], tip:"Use (1 − rⁿ)/(1 − r) form when |r| < 1 to avoid sign errors — both forms are algebraically identical."},
    {t:"Sum of Infinite GP", eq:"S<sub>∞</sub> = " + frac("a","1 − r") + " &nbsp; (|r| &lt; 1)",
     sym:[], tip:"Only converges when |r| < 1 — always check this condition before applying, especially in comprehension-type questions."},
    {t:"Arithmetico-Geometric Progression (AGP) — Infinite Sum", eq:"S<sub>∞</sub> = " + frac("a","1 − r") + " + " + frac("dr","(1 − r)²") + " &nbsp; (|r| &lt; 1)",
     sym:[["a, d","First term and common difference of the AP part"],["r","Common ratio of the GP part"]],
     cases:["Finite sum (n terms): Sn = [a − (a+(n−1)d)rⁿ]/(1−r) + dr(1−r^(n−1))/(1−r)²"],
     tip:"Series like 1 + 2x + 3x² + 4x³ + … are AGPs (AP part: 1,2,3,4,…; GP part: 1,x,x²,x³,…) — the infinite sum is by far the more commonly tested version."},
    {t:"Insertion of Means Between Two Numbers", eq:"AM: d = " + frac("b − a","n + 1"),
     sym:[["a, b","The two given numbers"],["n","Number of means to insert"]],
     cases:["GM: r = (b/a)^(1/(n+1))"],
     tip:"The means themselves are then a+d, a+2d, …, a+nd (arithmetic) or ar, ar², …, arⁿ (geometric)."},
    {t:"Sum of Powers of Natural Numbers", eq:"Σn = " + frac("n(n+1)","2"),
     sym:[],
     cases:["Σn² = n(n+1)(2n+1)/6", "Σn³ = [n(n+1)/2]²"],
     tip:"These three sums appear constantly inside more complex series — memorise all three, not just the first."},
    {t:"AM ≥ GM ≥ HM", eq:"AM ≥ GM ≥ HM",
     sym:[], tip:"Equality holds only when all numbers are equal — a powerful inequality tool for JEE Advanced optimisation problems."}
  ]},

  {cls:"11", subject:"math", chapter:"Trigonometric Functions", formulas:[
    {t:"Pythagorean Identity", eq:"sin²θ + cos²θ = 1",
     sym:[], tip:"Also gives 1 + tan²θ = sec²θ and 1 + cot²θ = cosec²θ by dividing through — memorise all three forms."},
    {t:"Sum Formula – Sine", eq:"sin(A ± B) = sinA·cosB ± cosA·sinB",
     sym:[], tip:"Setting A = B gives the double angle formula sin2A = 2sinA·cosA directly."},
    {t:"Sum Formula – Cosine", eq:"cos(A ± B) = cosA·cosB ∓ sinA·sinB",
     sym:[], tip:"Note the sign flips relative to sine's formula — a very common sign-error source under exam pressure."},
    {t:"Double Angle – Cosine", eq:"cos2θ = 1 − 2sin²θ = 2cos²θ − 1",
     sym:[], tip:"Three equivalent forms exist (also cos²θ − sin²θ) — pick whichever matches the rest of the expression to simplify fastest."},
    {t:"Sum Formula – Tangent", eq:"tan(A+B) = " + frac("tanA + tanB","1 − tanA tanB"),
     sym:[], tip:"Undefined when tanA·tanB=1 (i.e. A+B=90°) — check for this special case before dividing."},
    {t:"Double & Triple Angle Formulas", eq:"sin2A = " + frac("2tanA","1+tan²A"),
     sym:[],
     cases:["sin3A = 3sinA − 4sin³A","cos3A = 4cos³A − 3cosA"],
     tip:"The tan-based double angle form for sin2A is especially useful when a problem is already phrased in terms of tanA rather than sinA/cosA."},
    {t:"Sum-to-Product Formula", eq:"sinC + sinD = 2 sin" + frac("C+D","2") + " cos" + frac("C−D","2"),
     sym:[], tip:"Use whenever you see a sum or difference of trig ratios that needs converting into a product before it factors nicely."},
    {t:"Conditional Identities (A+B+C=π)", eq:"sin2A + sin2B + sin2C = 4 sinA sinB sinC",
     sym:[["A, B, C","Angles of a triangle, so A+B+C=π"]],
     cases:["tanA + tanB + tanC = tanA tanB tanC"],
     tip:"These only hold because A+B+C=π specifically — always confirm the triangle-angle condition before applying either identity."},
    {t:"Range of a·sinx + b·cosx + c", eq:"[c − √(a²+b²), &nbsp; c + √(a²+b²)]",
     sym:[], tip:"Comes from rewriting a·sinx+b·cosx as R·sin(x+φ) where R=√(a²+b²) — instantly gives the max and min without calculus."},
    {t:"Sum of Sines in Arithmetic Progression", eq:"sina + sin(a+d) + ⋯ + sin(a+(n−1)d) = " + frac("sin(nd/2)","sin(d/2)") + " sin(a + (n−1)d/2)",
     sym:[["a","First angle"],["d","Common difference between angles"]], tip:"The analogous formula for a sum of cosines in AP replaces the final sin with cos — same leading fraction."},
    {t:"Sine Rule", eq:frac("a","sinA") + " = " + frac("b","sinB") + " = " + frac("c","sinC") + " = 2R",
     sym:[["R","Circumradius of the triangle"]], tip:"Extremely useful when you know two angles and one side, or two sides and a non-included angle."},
    {t:"Cosine Rule", eq:"cosA = " + frac("b² + c² − a²","2bc"),
     sym:[], tip:"The go-to formula when three sides are known and you need any angle — SSS triangle problems."},
    {t:"Projection Formulae", eq:"a = b·cosC + c·cosB",
     sym:[],
     cases:["b = c·cosA + a·cosC","c = a·cosB + b·cosA"],
     tip:"A fast consistency check on a triangle's sides and angles — if these don't add up correctly, recheck your earlier working."},
    {t:"Area of a Triangle (Heron's Formula)", eq:"Δ = " + frac("1","2") + "ab sinC",
     sym:[["s","Semi-perimeter, (a+b+c)/2"]],
     cases:["Heron's form: Δ = √[s(s−a)(s−b)(s−c)]"],
     tip:"Use the sine form when two sides and the included angle are known; switch to Heron's form when only the three side lengths are given."},
    {t:"Inradius and Exradii", eq:"r = Δ/s = 4R sin(A/2)sin(B/2)sin(C/2)",
     sym:[["r","Inradius"],["R","Circumradius"]],
     cases:["Exradius opposite A: r1 = Δ/(s−a)"],
     tip:"The exradii formulas follow the same pattern — just swap in (s−b) or (s−c) for the other two exradii."},
    {t:"m-n Theorem", eq:"(m+n)cotθ = m·cotα − n·cotβ",
     sym:[["θ","Angle a cevian makes with the base, dividing it in ratio m:n"]],
     cases:["Equivalently: (m+n)cotθ = n·cotB − m·cotC"],
     tip:"A fast route to results like Apollonius' theorem or median-length formulas — avoids setting up full coordinate geometry."},
    {t:"Distance Between Incentre and Circumcentre", eq:"d = √(R² − 2Rr)",
     sym:[["R","Circumradius"],["r","Inradius"]], tip:"Known as Euler's triangle formula — a beautifully compact relation connecting the triangle's two most important radii and centres."}
  ]},

  {cls:"11", subject:"math", chapter:"Straight Lines", formulas:[
    {t:"Slope of a Line", eq:"m = " + frac("y<sub>2</sub> − y<sub>1</sub>","x<sub>2</sub> − x<sub>1</sub>"),
     sym:[], tip:"Horizontal lines have m = 0; vertical lines have undefined slope — treat these as special cases in problems."},
    {t:"Point–Slope Form", eq:"y − y<sub>1</sub> = m(x − x<sub>1</sub>)",
     sym:[], tip:"The most versatile line equation — derive all other forms (intercept, two-point, normal) from this one if you forget them."},
    {t:"Two-Point Form", eq:"y − y<sub>1</sub> = " + frac("y<sub>2</sub>−y<sub>1</sub>","x<sub>2</sub>−x<sub>1</sub>") + "(x − x<sub>1</sub>)",
     sym:[["(x1,y1), (x2,y2)","Two known points on the line"]], tip:"Just the point-slope form with the slope written out explicitly — use directly when you're given two points instead of a point and a slope."},
    {t:"Normal (Perpendicular) Form", eq:"x cosα + y sinα = p",
     sym:[["p","Perpendicular distance from origin to the line"],["α","Angle the perpendicular makes with the x-axis"]], tip:"Uniquely useful for distance-from-origin problems — p is read directly off the equation, no extra computation needed."},
    {t:"Intercept Form", eq:"x/a + y/b = 1",
     sym:[["a, b","x- and y-intercepts"]], tip:"Instantly readable — the line crosses the axes at (a, 0) and (0, b), no computation needed."},
    {t:"Distance of a Point from a Line", eq:"d = " + frac("|Ax<sub>1</sub> + By<sub>1</sub> + C|","√(A² + B²)"),
     sym:[["(x1,y1)","The point"],["Ax+By+C=0","The line"]],
     cases:["Distance between two parallel lines Ax+By+C1=0 and Ax+By+C2=0: d = |C1−C2|/√(A²+B²)"],
     tip:"Drop the absolute value only when you need the signed distance to check which side of the line a point lies on."},
    {t:"Angle Between Two Lines", eq:"tanθ = |" + frac("m<sub>1</sub> − m<sub>2</sub>","1 + m<sub>1</sub>m<sub>2</sub>") + "|",
     sym:[], tip:"Lines are parallel when m1 = m2, and perpendicular when m1·m2 = −1 — check these special cases first."},
    {t:"Angle Bisectors of Two Lines", eq:frac("a<sub>1</sub>x+b<sub>1</sub>y+c<sub>1</sub>","√(a<sub>1</sub>²+b<sub>1</sub>²)") + " = ± " + frac("a<sub>2</sub>x+b<sub>2</sub>y+c<sub>2</sub>","√(a<sub>2</sub>²+b<sub>2</sub>²)"),
     sym:[["a_ix+b_iy+c_i=0","The two given lines"]], tip:"The + sign gives one bisector, the − sign gives the other (they're always perpendicular to each other) — check the sign of c1, c2 to identify which one bisects the angle containing the origin."},
    {t:"Foot of Perpendicular and Image of a Point", eq:frac("x−x<sub>1</sub>","A") + " = " + frac("y−y<sub>1</sub>","B") + " = " + frac("−k(Ax<sub>1</sub>+By<sub>1</sub>+C)","A²+B²"),
     sym:[["(x1,y1)","The given point"],["Ax+By+C=0","The line"]],
     cases:["Use k=1 for the foot of perpendicular", "Use k=2 for the image (reflection) of the point in the line"],
     tip:"The image is simply the foot 'doubled' — go exactly twice as far along the same perpendicular direction."},
    {t:"Family of Lines Through an Intersection", eq:"L<sub>1</sub> + λL<sub>2</sub> = 0",
     sym:[["L1=0, L2=0","Two given lines"],["λ","Parameter"]], tip:"Represents every line through the intersection of L1 and L2 (except L2 itself) — lets you find a specific line through that intersection point without ever computing the point itself."},
    {t:"Section Formula (Internal Division)", eq:"P = (" + frac("mx<sub>2</sub>+nx<sub>1</sub>","m+n") + ", " + frac("my<sub>2</sub>+ny<sub>1</sub>","m+n") + ")",
     sym:[["m:n","Ratio in which P divides the segment"]],
     cases:["External division: P = ((mx2−nx1)/(m−n), (my2−ny1)/(m−n))"],
     tip:"Midpoint is just the special case m = n — a quick sanity check when you're unsure which point goes where in the formula."},
    {t:"Centroid of a Triangle", eq:"G = (" + frac("x<sub>1</sub>+x<sub>2</sub>+x<sub>3</sub>","3") + ", " + frac("y<sub>1</sub>+y<sub>2</sub>+y<sub>3</sub>","3") + ")",
     sym:[], tip:"The centroid divides each median in a 2:1 ratio from the vertex — unlike orthocentre/circumcentre, it always has this simple closed-form average."},
    {t:"Condition for Three Lines to be Concurrent", eq:"|a<sub>1</sub> b<sub>1</sub> c<sub>1</sub>; a<sub>2</sub> b<sub>2</sub> c<sub>2</sub>; a<sub>3</sub> b<sub>3</sub> c<sub>3</sub>| = 0",
     sym:[["a_ix+b_iy+c_i=0","The three lines"]], tip:"The determinant of the coefficient matrix vanishing means all three lines pass through one common point."}
  ]},

  {cls:"11", subject:"math", chapter:"Conic Sections", formulas:[
    {t:"Circle — Standard Equation", eq:"(x − h)² + (y − k)² = r²",
     sym:[["(h,k)","Centre"],["r","Radius"]], tip:"Expand this to identify centre/radius from a general equation x²+y²+2gx+2fy+c=0: centre (−g,−f), r=√(g²+f²−c)."},
    {t:"Circle Given Endpoints of a Diameter", eq:"(x−x<sub>1</sub>)(x−x<sub>2</sub>) + (y−y<sub>1</sub>)(y−y<sub>2</sub>) = 0",
     sym:[["(x1,y1), (x2,y2)","The two diameter endpoints"]], tip:"Comes from the fact that any point on the circle sees the diameter at a right angle — the two bracketed slopes multiply to −1."},
    {t:"Circle — Parametric Form", eq:"(h + r cosθ, k + r sinθ)",
     sym:[["θ","Parameter, 0 to 2π"]], tip:"Centred at the origin this simplifies to (r cosθ, r sinθ) — turns circle problems into single-variable trig problems, just like for the other conics."},
    {t:"Circle — Equation of Tangent at a Point", eq:"xx<sub>1</sub> + yy<sub>1</sub> = r² &nbsp;(for x²+y²=r²)",
     sym:[["(x1,y1)","Point of tangency, lying on the circle"]],
     cases:["General circle x²+y²+2gx+2fy+c=0: xx1+yy1+g(x+x1)+f(y+y1)+c=0","Parametric form: x cosθ + y sinθ = r","Slope form: y = mx ± r√(1+m²)"],
     tip:"This is the 'T = 0' replacement rule: x²→xx1, y²→yy1, x→(x+x1)/2, y→(y+y1)/2 — the same rule works for every conic below."},
    {t:"Circle — Length of the Tangent from a Point", eq:"L = √(x<sub>1</sub>² + y<sub>1</sub>² − r²)",
     sym:[["(x1,y1)","External point"]], tip:"For a general circle, this is √S1 — substitute the point directly into the circle's equation and take the square root."},
    {t:"Circle — Chord with a Given Midpoint", eq:"T = S1",
     sym:[["T","xx1+yy1+g(x+x1)+f(y+y1)+c (the tangent-style expression)"],["S1","Circle's equation with (x1,y1) substituted in"]], tip:"A single elegant rule for the chord whose midpoint is (x1,y1) — same 'T' expression used for tangents, just set equal to S1 instead of zero."},
    {t:"Circle — Chord of Contact", eq:"T = 0",
     sym:[["T","xx1+yy1+g(x+x1)+f(y+y1)+c, from an external point (x1,y1)"]], tip:"This is the chord joining the two points where the tangents from an external point touch the circle — same T expression as the tangent formula, just from an external rather than on-circle point."},
    {t:"Circle — Director Circle", eq:"x² + y² = 2r²",
     sym:[], tip:"The locus of points from which two mutually perpendicular tangents can be drawn to the circle — concentric with the original circle, radius scaled by √2."},
    {t:"Family of Circles", eq:"Through intersection of two circles: S1 + λS2 = 0",
     sym:[["S1=0, S2=0","Two given circles (or a circle and a line)"]],
     cases:["Through intersection of a circle and a line: S + λL = 0"],
     tip:"λ=−1 in the two-circles case eliminates the second-degree terms entirely, giving the radical axis (a straight line) directly."},
    {t:"Orthogonality of Two Circles", eq:"2g1g2 + 2f1f2 = c1 + c2",
     sym:[["x²+y²+2g1x+2f1y+c1=0, x²+y²+2g2x+2f2y+c2=0","The two circles"]], tip:"Two circles are orthogonal when they intersect at 90° — this condition means the tangent to one circle at the intersection point passes through the other circle's centre."},
    {t:"Radical Axis of Two Circles", eq:"S1 − S2 = 0",
     sym:[], tip:"Always a straight line, perpendicular to the line joining the two centres — every point on it has equal tangent length to both circles."},
    {t:"Position of a Point Relative to a Conic", eq:"S<sub>1</sub> = S(x<sub>1</sub>, y<sub>1</sub>) &nbsp;(substitute the point into the conic's equation)",
     sym:[["S1","Value obtained after substitution"]],
     cases:["S1 > 0: point lies outside the conic","S1 = 0: point lies on the conic","S1 < 0: point lies inside the conic"],
     tip:"Works for circle, ellipse, and (with care on orientation) parabola — one of the fastest inside/outside/on tests in coordinate geometry."},
    {t:"Parabola — Standard Equation", eq:"y² = 4ax",
     sym:[["a","Distance from vertex to focus"]], tip:"Focus is at (a, 0), directrix is x = −a — this standard form opens to the right along the x-axis."},
    {t:"Parabola — Focal Distance", eq:"SP = x<sub>1</sub> + a",
     sym:[["S","Focus (a,0)"],["P(x1,y1)","Any point on the parabola"]], tip:"Comes straight from the definition of a parabola: distance from focus equals perpendicular distance from the directrix, which is (x1+a)."},
    {t:"Parabola — Equation of Tangent", eq:"At (x1,y1): yy1 = 2a(x + x1)",
     sym:[],
     cases:["Slope form (slope m): y = mx + a/m, touching at (a/m², 2a/m)"],
     tip:"The slope form is what you reach for when you're given a slope rather than a point — solve for the point of contact only if the question needs it."},
    {t:"Parabola — Equation of Normal", eq:"At (x1,y1): y − y1 = −(y1/2a)(x − x1)",
     sym:[],
     cases:["Parametric form (point (at²,2at)): y + tx = 2at + at³","Slope form (slope m): y = mx − 2am − am³"],
     tip:"The parametric normal equation is usually faster in problems already using the (at², 2at) parametrisation — no need to convert back to (x1,y1)."},
    {t:"Ellipse — Standard Equation", eq:frac("x²","a²") + " + " + frac("y²","b²") + " = 1 &nbsp; (a &gt; b)",
     sym:[["a, b","Semi-major and semi-minor axes"]], tip:"Eccentricity e = √(1 − b²/a²); the closer e is to 0, the more circular the ellipse."},
    {t:"Ellipse — Foci and Directrices", eq:"Foci: (±ae, 0)",
     sym:[["e","Eccentricity, e = √(1 − b²/a²)"]],
     cases:["Directrices: x = ±a/e"],
     tip:"Both foci lie inside the ellipse on the major axis; both directrices lie outside it, symmetric about the centre."},
    {t:"Ellipse — Focal Distance (Focal Property)", eq:"r<sub>1</sub> + r<sub>2</sub> = 2a",
     sym:[["r1, r2","Distances from a point on the ellipse to the two foci"]],
     cases:["r1 = a − ex1, r2 = a + ex1, for a point (x1,y1) on the ellipse"],
     tip:"This constant-sum property is literally the definition of an ellipse — the classic 'pins and string' construction relies on exactly this."},
    {t:"Ellipse — Auxiliary Circle", eq:"x² + y² = a²",
     sym:[], tip:"Concentric with the ellipse, radius equal to the semi-major axis — the parametric angle θ in (a cosθ, b sinθ) is the angle on THIS circle, not on the ellipse itself."},
    {t:"Ellipse — Equation of Tangent", eq:"At (x1,y1): " + frac("xx<sub>1</sub>","a²") + " + " + frac("yy<sub>1</sub>","b²") + " = 1",
     sym:[],
     cases:["Condition for y=mx+c to be tangent: c² = a²m² + b²"],
     tip:"Same T=0 substitution rule as the circle — replace x²→xx1, y²→yy1 directly in the standard equation."},
    {t:"Ellipse — Director Circle", eq:"x² + y² = a² + b²",
     sym:[], tip:"The locus of points from which two mutually perpendicular tangents can be drawn to the ellipse — concentric with the ellipse, radius √(a²+b²)."},
    {t:"Hyperbola — Standard Equation", eq:frac("x²","a²") + " − " + frac("y²","b²") + " = 1",
     sym:[], tip:"Eccentricity e = √(1 + b²/a²), always greater than 1 for a hyperbola — unlike the ellipse's e < 1."},
    {t:"Hyperbola — Foci and Directrices", eq:"Foci: (±ae, 0)",
     sym:[["e","Eccentricity, e = √(1 + b²/a²)"]],
     cases:["Directrices: x = ±a/e"],
     tip:"Unlike the ellipse, e > 1 here, so the foci lie further out relative to the vertices — the branches curve away from them."},
    {t:"Hyperbola — Focal Distance (Focal Property)", eq:"|r<sub>1</sub> − r<sub>2</sub>| = 2a",
     sym:[["r1, r2","Distances from a point on the hyperbola to the two foci"]],
     cases:["r1 = ex1 + a, r2 = ex1 − a, for a point (x1,y1) on the right branch"],
     tip:"The constant-DIFFERENCE property (vs. the ellipse's constant sum) is what defines a hyperbola — the two branches curve apart because of this."},
    {t:"Hyperbola — Equation of Tangent", eq:"At (x1,y1): " + frac("xx<sub>1</sub>","a²") + " − " + frac("yy<sub>1</sub>","b²") + " = 1",
     sym:[],
     cases:["Condition for y=mx+c to be tangent: c² = a²m² − b²"],
     tip:"Same T=0 rule again — the only change from the ellipse's tangent equation is the sign on the y² term, matching the hyperbola's own equation."},
    {t:"Hyperbola — Asymptotes & Rectangular Hyperbola", eq:"Asymptotes: y = ±(b/a)x",
     sym:[],
     cases:["Rectangular hyperbola (a=b): asymptotes become perpendicular; equation x²−y²=a², or rotated form xy=c²","Parametric form of xy=c²: (ct, c/t)","Tangent to xy=c² at (ct,c/t): x/t + yt = 2c"],
     tip:"The hyperbola gets arbitrarily close to its asymptotes but never touches them — a rectangular hyperbola is just the special case where the asymptotes are the coordinate axes themselves (after rotation)."},
    {t:"Length of Latus Rectum", eq:"Parabola: 4a",
     sym:[],
     cases:["Ellipse: 2b²/a","Hyperbola: 2b²/a"],
     tip:"The latus rectum is the chord through the focus perpendicular to the major/transverse axis — same formula shape for ellipse and hyperbola."},
    {t:"Condition for Tangency (Line & Circle)", eq:"c² = r²(1 + m²)",
     sym:[["y = mx + c","The line"],["x²+y²=r²","The circle"]], tip:"Substitute the line into the circle equation and set the discriminant to zero — this condition is the shortcut result."},
    {t:"Parametric Coordinates of Conics", eq:"Parabola (y²=4ax): (at², 2at)",
     sym:[["t","Parameter"]],
     cases:["Ellipse (x²/a²+y²/b²=1): (a cosθ, b sinθ)","Hyperbola (x²/a²−y²/b²=1): (a secθ, b tanθ)"],
     tip:"Parametric form often turns a two-variable conic problem into a single-variable trig/algebra problem — very useful for tangent and normal questions."},
    {t:"Pair of Straight Lines Through the Origin", eq:"ax² + 2hxy + by² = 0",
     sym:[["a, h, b","Coefficients"]],
     cases:["Angle between the two lines: tanθ = 2√(h²−ab) / (a+b)"],
     tip:"This homogeneous second-degree equation always represents two straight lines through the origin — real and distinct when h² > ab."}
  ]},

  {cls:"11", subject:"math", chapter:"Permutations & Combinations", formulas:[
    {t:"Permutations", eq:"<sup>n</sup>P<sub>r</sub> = " + frac("n!","(n − r)!"),
     sym:[["n","Total items"],["r","Items chosen, order matters"]], tip:"Use permutations whenever arrangement/order is important — seating, ranking, passwords."},
    {t:"Permutations with Repetition Allowed", eq:"nʳ",
     sym:[["n","Items available for each position"],["r","Number of positions"]], tip:"Used whenever items CAN repeat — e.g. an r-digit code where each digit can be any of n symbols."},
    {t:"Permutations of Objects Not All Different", eq:"" + frac("n!","p! q! r! ⋯"),
     sym:[["p, q, r,…","Counts of each repeated (identical) item"]], tip:"E.g. arrangements of the letters of 'MISSISSIPPI' — divide n! by the factorial of each letter's repeat count."},
    {t:"Combinations", eq:"<sup>n</sup>C<sub>r</sub> = " + frac("n!","r!(n − r)!"),
     sym:[], tip:"nCr relates to nPr by nPr = nCr × r! — combinations simply ignore internal ordering."},
    {t:"Complementary Combinations", eq:"<sup>n</sup>C<sub>r</sub> = <sup>n</sup>C<sub>n−r</sub>",
     sym:[], tip:"Useful shortcut: choosing r items to include is the same count as choosing (n − r) items to exclude."},
    {t:"Circular Permutations", eq:"(n − 1)!",
     sym:[], tip:"Use (n−1)!/2 instead when clockwise and anticlockwise arrangements are considered identical (e.g. necklaces)."},
    {t:"Number of Diagonals in a Polygon", eq:"<sup>n</sup>C<sub>2</sub> − n",
     sym:[["n","Number of sides (vertices) of the polygon"]], tip:"Total line segments joining vertices is nC2; subtract the n sides themselves to leave only the diagonals."},
    {t:"Grouping into Unequal Groups", eq:"" + frac("(m+n+p)!","m! n! p!"),
     sym:[["m, n, p","Sizes of the (distinct, distinguishable) groups"]], tip:"If the groups themselves are indistinguishable (e.g. splitting into three groups of the SAME size with no labels), divide by an extra factorial for the number of identical-sized groups."},
    {t:"Distributing Identical Items (Stars & Bars)", eq:"<sup>n+r−1</sup>C<sub>r−1</sub>",
     sym:[["n","Identical items"],["r","Number of groups"]], tip:"Used for problems like 'distribute n identical balls into r distinct boxes' — a classic JEE combinatorics trick."},
    {t:"Derangements", eq:"D<sub>n</sub> = n![" + frac("1","2!") + " − " + frac("1","3!") + " + ⋯ + (−1)ⁿ" + frac("1","n!") + "]",
     sym:[["Dn","Number of ways to arrange n items so that NONE lands in its original position"]], tip:"The classic setup is the 'mismatched letters and envelopes' problem — Dn/n! quickly approaches 1/e as n grows."}
  ]},

  {cls:"11", subject:"math", chapter:"Binomial Theorem", formulas:[
    {t:"Binomial Expansion", eq:"(x + y)ⁿ = Σ<sup>n</sup><sub>r=0</sub> <sup>n</sup>C<sub>r</sub> x<sup>n−r</sup>y<sup>r</sup>",
     sym:[], tip:"There are exactly (n+1) terms in the expansion — a quick check that you haven't missed a term."},
    {t:"General Term", eq:"T<sub>r+1</sub> = <sup>n</sup>C<sub>r</sub> x<sup>n−r</sup>y<sup>r</sup>",
     sym:[], tip:"Use this to jump directly to a specific term (e.g. coefficient of x⁵) without expanding the full series."},
    {t:"Sum of Binomial Coefficients", eq:"<sup>n</sup>C<sub>0</sub> + <sup>n</sup>C<sub>1</sub> + ⋯ + <sup>n</sup>C<sub>n</sub> = 2ⁿ",
     sym:[], tip:"Obtained by putting x = y = 1 in the expansion of (1+x)ⁿ — a standard trick for coefficient-sum questions."},
    {t:"Sum of Odd/Even Placed Binomial Coefficients", eq:"C<sub>0</sub>+C<sub>2</sub>+⋯ = C<sub>1</sub>+C<sub>3</sub>+⋯ = 2<sup>n−1</sup>",
     sym:[], tip:"Obtained by putting x = 1 in (1−x)ⁿ = 0 and combining with the x = 1 case of (1+x)ⁿ."},
    {t:"Alternating Sum of Binomial Coefficients", eq:"C<sub>0</sub> − C<sub>1</sub> + C<sub>2</sub> − ⋯ + (−1)ⁿC<sub>n</sub> = 0",
     sym:[], tip:"Obtained by putting x = −1 (i.e. y=−1) in the expansion of (1+y)ⁿ — an instant zero for any n ≥ 1."},
    {t:"Sum of Squares of Binomial Coefficients", eq:"ΣC<sub>r</sub>² = <sup>2n</sup>C<sub>n</sub>",
     sym:[], tip:"A neat combinatorial identity — comes from comparing the coefficient of xⁿ on both sides of (1+x)ⁿ(1+x)ⁿ = (1+x)²ⁿ."},
    {t:"Expansion of (1+x)ⁿ ± (1−x)ⁿ", eq:"(1+x)ⁿ + (1−x)ⁿ = 2[C0 + C2x² + C4x⁴ + ⋯]",
     sym:[],
     cases:["(1+x)ⁿ − (1−x)ⁿ = 2[C1x + C3x³ + C5x⁵ + ⋯]"],
     tip:"Adding cancels all the odd-power terms; subtracting cancels all the even-power terms — a quick way to isolate just the odd- or even-indexed terms of an expansion."},
    {t:"Multinomial Theorem", eq:"(x1+x2+⋯+xk)ⁿ = Σ " + frac("n!","p1! p2! ⋯ pk!") + " x1<sup>p1</sup>x2<sup>p2</sup>⋯xk<sup>pk</sup>",
     sym:[["p1+p2+⋯+pk = n","Constraint on the exponents in each term"]], tip:"The direct generalisation of the binomial theorem to more than two terms — the coefficient formula is exactly the 'grouping into unequal groups' formula in disguise."}
  ]},

  {cls:"11", subject:"math", chapter:"Sets & Relations", formulas:[
    {t:"Union of Two Sets", eq:"|A ∪ B| = |A| + |B| − |A ∩ B|",
     sym:[], tip:"Subtract the intersection once to avoid double-counting elements common to both sets."},
    {t:"Union of Three Sets", eq:"|A∪B∪C| = |A|+|B|+|C|−|A∩B|−|B∩C|−|A∩C|+|A∩B∩C|",
     sym:[], tip:"The inclusion–exclusion principle — add singles, subtract pairs, add back the triple overlap."},
    {t:"Number of Subsets", eq:"2ⁿ",
     sym:[["n","Number of elements in the set"]], tip:"Includes both the empty set and the full set itself; number of proper subsets is 2ⁿ − 1."},
    {t:"Number of Relations", eq:"2<sup>mn</sup>",
     sym:[["m, n","Number of elements in sets A and B"]], tip:"A relation from A to B is just any subset of A×B, which has mn elements — hence 2^(mn) possible subsets."}
  ]},

  {cls:"11", subject:"math", chapter:"Statistics", formulas:[
    {t:"Mean (Ungrouped Data)", eq:"x̄ = " + frac("Σx<sub>i</sub>","n"),
     sym:[], tip:"For grouped/frequency data, use x̄ = Σfᵢxᵢ/Σfᵢ instead — same idea, weighted by frequency."},
    {t:"Variance", eq:"σ² = " + frac("Σ(x<sub>i</sub> − x̄)²","n"),
     sym:[], tip:"Variance is always non-negative — it's an average of squared deviations, so it can never come out negative."},
    {t:"Standard Deviation", eq:"σ = √(Variance)",
     sym:[], tip:"Unlike variance, standard deviation has the same units as the original data — easier to interpret physically."},
    {t:"Mean Deviation about the Mean", eq:"MD = " + frac("Σ|x<sub>i</sub> − x̄|","n"),
     sym:[], tip:"Uses absolute values instead of squares — less sensitive to outliers than variance/SD."},
    {t:"Coefficient of Variation", eq:"CV = " + frac("σ","x̄") + " × 100",
     sym:[], tip:"Lets you compare the relative spread of two datasets with different units or wildly different means."}
  ]},

  /* =========================================================
     CLASS 12 :: PHYSICS  (9 chapters)
     ========================================================= */
  {cls:"12", subject:"physics", chapter:"Electrostatics", formulas:[
    {t:"Coulomb's Law", eq:"F = " + frac("1","4πε<sub>0</sub>") + frac("q<sub>1</sub>q<sub>2</sub>","r²"),
     sym:[["ε₀","Permittivity of free space"],["q1, q2","Point charges"]],
     consts:["1/4πε₀ = 9 × 10⁹ N·m²/C²", "ε₀ = 8.85 × 10⁻¹² C²/N·m²"],
     cases:["In a medium of dielectric constant K: F = (1/4πε₀K)(q1q2/r²)"],
     tip:"Force is repulsive for like charges, attractive for unlike — always assign direction before adding vectorially."},
    {t:"Electric Field due to a Point Charge", eq:"E = " + frac("1","4πε<sub>0</sub>") + frac("q","r²"),
     sym:[["E","Electric field intensity (N/C)"]], tip:"E is a vector field — always points away from positive charge, toward negative charge."},
    {t:"Electric Field due to an Infinite Sheet", eq:"E = " + frac("σ","2ε<sub>0</sub>"),
     sym:[["σ","Surface charge density"]], tip:"Notice E doesn't depend on distance from the sheet at all — a key difference from the point-charge field."},
    {t:"Electric Field on the Axis of a Charged Ring", eq:"E = " + frac("1","4πε<sub>0</sub>") + frac("Qx","(x²+R²)<sup>3/2</sup>"),
     sym:[["Q","Total charge on the ring"],["R","Radius of the ring"],["x","Distance along the axis from the centre"]],
     cases:["Electric potential at the same point: V = (1/4πε0)·Q/√(x²+R²)"],
     tip:"E is zero at the centre (x=0) and also as x→∞ — it peaks at x=R/√2, a classic 'find the maximum' calculus application."},
    {t:"Electric Potential", eq:"V = " + frac("1","4πε<sub>0</sub>") + frac("q","r"),
     sym:[["V","Electric potential (Volt)"]],
     cases:["System of point charges (superposition): V = (1/4πε0) Σ(qi/ri) — a plain scalar sum, no vector resolution needed"],
     tip:"Potential is scalar — simply add potentials from multiple charges algebraically, no vector resolution needed."},
    {t:"Potential Due to a Charged Conducting Sphere", eq:"Outside (r ≥ R): V = " + frac("1","4πε<sub>0</sub>") + frac("Q","r"),
     sym:[["R","Radius of the sphere"],["Q","Total charge on the sphere"]],
     cases:["On the surface (r = R): V = (1/4πε0)(Q/R)","Inside (r < R): V = (1/4πε0)(Q/R) — same as the surface value, since E = 0 inside a conductor"],
     tip:"V stays constant throughout the interior because there's no field to do work moving a charge around inside — this is exactly why the inside of a charged conductor is called an equipotential region."},
    {t:"Common Potential (Two Conducting Spheres Joined by a Wire)", eq:"V = " + frac("Q<sub>1</sub> + Q<sub>2</sub>","4πε<sub>0</sub>(R<sub>1</sub> + R<sub>2</sub>)"),
     sym:[["Q1, Q2","Initial charges on the two spheres"],["R1, R2","Their radii"]], tip:"Total charge is conserved and redistributes until both spheres reach this same potential — the smaller sphere ends up with a higher surface charge DENSITY even though it holds less total charge."},
    {t:"Earthing (Grounding) a Conductor", eq:"V = 0 &nbsp;(after earthing)",
     sym:[], tip:"Earth acts as an infinite reservoir of charge at zero potential — connecting a conductor to earth forces its potential to zero, and charge flows to/from the earth until that condition is met."},
    {t:"Capacitance", eq:"C = Q/V",
     sym:[["Q","Charge stored"],["V","Potential difference"]], tip:"For a parallel plate capacitor, C = ε₀A/d — inserting a dielectric multiplies C by the dielectric constant K."},
    {t:"Parallel Plate Capacitor", eq:"C = " + frac("ε<sub>0</sub>A","d"),
     sym:[["A","Plate area"],["d","Plate separation"]],
     cases:["With a dielectric filling the gap: C = Kε0A/d"],
     tip:"Inserting a dielectric always increases capacitance by a factor of K, the dielectric constant of the material."},
    {t:"Combination of Capacitors", eq:"Series: " + frac("1","C<sub>eq</sub>") + " = " + frac("1","C<sub>1</sub>") + " + " + frac("1","C<sub>2</sub>") + " + ⋯",
     sym:[],
     cases:["Parallel: Ceq = C1 + C2 + ⋯"],
     tip:"Series behaves like resistors in parallel (and vice versa!) — capacitors are the 'inverse' of resistors when it comes to combination rules."},
    {t:"Energy Stored in a Capacitor", eq:"U = " + frac("1","2") + "CV² = " + frac("Q²","2C"),
     sym:[], tip:"Use Q²/2C form when charge is held constant (isolated capacitor), and ½CV² when connected to a battery (V constant)."},
    {t:"Force Between Capacitor Plates", eq:"F = " + frac("Q²","2ε<sub>0</sub>A"),
     sym:[["Q","Charge on each plate"],["A","Plate area"]], tip:"Always attractive (the plates carry opposite charges) — note it uses ε0A, not the full field E×Q, because each plate sits in the field of the OTHER plate only (E/2)."},
    {t:"Heat Generated on Redistribution of Charge", eq:"H = " + frac("1","2") + frac("C<sub>1</sub>C<sub>2</sub>","C<sub>1</sub>+C<sub>2</sub>") + "(V<sub>1</sub> − V<sub>2</sub>)²",
     sym:[["V1, V2","Initial potentials of the two capacitors before connecting"]], tip:"Energy is ALWAYS lost as heat when two capacitors at different potentials are connected — this is why the final stored energy is less than the initial total."},
    {t:"Spherical and Cylindrical Capacitors", eq:"Spherical: C = " + frac("4πε<sub>0</sub>ab","b − a"),
     sym:[["a, b","Inner and outer radii"],["L","Length (cylindrical case)"]],
     cases:["Isolated sphere (b→∞): C = 4πε0a","Cylindrical: C = 2πε0L / ln(b/a)"],
     tip:"The isolated-sphere case follows directly by letting the outer radius go to infinity — a good check that you've remembered the spherical formula correctly."},
    {t:"RC Circuit — Charging and Discharging", eq:"Charging: q = q<sub>0</sub>(1 − e<sup>−t/RC</sup>)",
     sym:[["RC","Time constant τ — the time to reach ~63% of full charge"]],
     cases:["Discharging: q = q0·e^(−t/RC)","Current during charging: I = (V/R)e^(−t/RC)"],
     tip:"After one time constant (t=RC), a charging capacitor reaches 63% of its final charge; after ~5RC it's effectively fully charged."},
    {t:"Electric Flux", eq:"Φ = E·A cosθ",
     sym:[["Φ","Electric flux through the surface"],["θ","Angle between E and the area vector"]], tip:"Flux is maximum when the field is perpendicular to the surface (θ=0°) and zero when the field grazes along it (θ=90°)."},
    {t:"Gauss's Law", eq:"∮E·dA = " + frac("q<sub>enc</sub>","ε<sub>0</sub>"),
     sym:[["q_enc","Net charge enclosed by the Gaussian surface"]], tip:"Choose a Gaussian surface that matches the symmetry of the charge distribution (sphere, cylinder, pillbox) to make E come out of the integral easily."},
    {t:"Electric Field — Uniformly Charged Spherical Shell", eq:"Outside (r ≥ R): E = " + frac("1","4πε<sub>0</sub>") + frac("q","r²"),
     sym:[["R","Radius of the shell"]],
     cases:["Inside the shell (r < R): E = 0"],
     tip:"Outside, the shell behaves exactly like a point charge at its centre; inside, the field vanishes completely — a classic Gauss's law result."},
    {t:"Electric Field due to a Dipole", eq:"Axial: E = " + frac("1","4πε<sub>0</sub>") + frac("2p","r³"),
     sym:[["p","Dipole moment, p = q(2a)"],["r","Distance from dipole centre (r ≫ a)"]],
     cases:["Equatorial: E = (1/4πε0)(p/r³) — exactly half the axial value, and opposite in direction","At general angle θ: E = (1/4πε0)(p/r³)√(1+3cos²θ)"],
     tip:"Both fall off as 1/r³, faster than a point charge's 1/r² — the two opposite charges partially cancel at large distances."},
    {t:"Electric Potential due to a Dipole", eq:"V = " + frac("1","4πε<sub>0</sub>") + frac("p cosθ","r²"),
     sym:[["θ","Angle from the dipole axis"]],
     cases:["On the axial line (θ=0°): V = (1/4πε0)(p/r²)","On the equatorial line (θ=90°): V = 0"],
     tip:"Potential is exactly zero everywhere on the equatorial plane — the two charges' contributions cancel perfectly there, even though the FIELD is non-zero."},
    {t:"Electric Field — Solid Non-Conducting Sphere (Uniform Charge)", eq:"Outside (r ≥ R): E = " + frac("1","4πε<sub>0</sub>") + frac("Q","r²"),
     sym:[["Q","Total charge, uniformly distributed through the volume"]],
     cases:["Inside (r < R): E = (1/4πε0)(Qr/R³) — grows linearly with r","Potential inside: V = (1/4πε0)·Q(3R²−r²)/2R³","Potential at centre: V = (3/2)×(surface potential)"],
     tip:"Unlike a conducting sphere (where E=0 inside), a uniformly charged INSULATING sphere has a field inside that rises linearly from zero at the centre to its maximum at the surface."},
    {t:"Electric Field due to an Infinite Line Charge", eq:"E = " + frac("λ","2πε<sub>0</sub>r"),
     sym:[["λ","Linear charge density (C/m)"],["r","Perpendicular distance from the wire"]], tip:"Falls off as 1/r (not 1/r²) — each different geometry gives a different power law: point 1/r², line 1/r, sheet constant."},
    {t:"Torque on an Electric Dipole", eq:"τ = p × E = pE sinθ",
     sym:[["p","Dipole moment"],["θ","Angle between p and E"]], tip:"Torque tries to align the dipole with the field — it's zero both at θ=0° (stable) and θ=180° (unstable equilibrium)."},
    {t:"Potential Energy of a Dipole in a Field", eq:"U = −p·E = −pE cosθ",
     sym:[],
     cases:["Work done rotating from θ1 to θ2: W = pE(cosθ1 − cosθ2)"],
     tip:"Minimum (most negative) when p is aligned with E — the dipole's most stable orientation."},
    {t:"Potential Energy of a System of Charges", eq:"U = " + frac("1","4πε<sub>0</sub>") + "Σ" + frac("q<sub>i</sub>q<sub>j</sub>","r<sub>ij</sub>"),
     sym:[["rij","Separation between charges i and j"]], tip:"Sum over each distinct PAIR exactly once — for three charges there are three pairs, for four charges there are six."},
    {t:"Energy Density of an Electric Field", eq:"u = " + frac("1","2") + "ε<sub>0</sub>E²",
     sym:[["u","Energy stored per unit volume of the field"]], tip:"Shows the energy is genuinely stored in the FIELD itself, distributed through space — not located 'on' the charges."}
  ]},

  {cls:"12", subject:"physics", chapter:"Current Electricity", formulas:[
    {t:"Ohm's Law", eq:"V = IR",
     sym:[["V","Potential difference (V)"],["I","Current (A)"],["R","Resistance (Ω)"]], tip:"Only holds for ohmic conductors at constant temperature — diodes and filament bulbs are classic non-ohmic exceptions."},
    {t:"Resistivity", eq:"R = ρ" + frac("l","A"),
     sym:[["ρ","Resistivity of material (Ω·m)"],["l","Length of conductor"],["A","Cross-sectional area"]], tip:"ρ is a material property (temperature-dependent) while R also depends on the conductor's geometry."},
    {t:"Temperature Dependence of Resistance", eq:"R<sub>t</sub> = R<sub>0</sub>(1 + αΔT)",
     sym:[["α","Temperature coefficient of resistance"]], tip:"Metals have positive α (resistance rises with T); semiconductors typically have negative α."},
    {t:"Combination of Resistors", eq:"Series: R<sub>eq</sub> = R<sub>1</sub> + R<sub>2</sub> + ⋯",
     sym:[],
     cases:["Parallel: 1/Req = 1/R1 + 1/R2 + ⋯"],
     tip:"Same current flows through each resistor in series; same voltage appears across each in parallel — that's the physical reasoning behind both rules."},
    {t:"Combination of Cells", eq:"Series (n cells): E<sub>eq</sub> = nE, r<sub>eq</sub> = nr",
     sym:[["E, r","EMF and internal resistance of one cell"]],
     cases:["Parallel (n identical cells): Eeq = E, req = r/n","Mixed grouping (m rows of n cells): maximum current when external R = nr/m"],
     tip:"Series combination boosts total EMF; parallel combination keeps EMF the same but reduces internal resistance — useful for supplying larger currents."},
    {t:"Current Density and Mobility", eq:"J = I/A = nev<sub>d</sub>",
     sym:[["J","Current density (A/m²)"],["μ","Mobility, drift velocity per unit electric field"]],
     cases:["Mobility: μ = vd/E","Conductivity: σ = neμ = 1/ρ"],
     tip:"Current density is a vector (unlike current itself), pointing in the direction of conventional current flow at that point."},
    {t:"Electrical Power", eq:"P = VI = I²R = " + frac("V²","R"),
     sym:[], tip:"Use I²R when current is fixed (series circuit) and V²/R when voltage is fixed (parallel circuit) to simplify calculation."},
    {t:"Drift Velocity", eq:"I = nAev<sub>d</sub>",
     sym:[["n","Free electron density"],["A","Cross-section area"],["e","Electronic charge"],["v_d","Drift velocity"]],
     consts:["e = 1.6 × 10⁻¹⁹ C"],
     tip:"Drift velocity is remarkably small (~mm/s) even though current 'feels' instantaneous — signal speed ≠ drift speed."},
    {t:"EMF & Internal Resistance", eq:"V = E − Ir",
     sym:[["E","EMF of the cell"],["r","Internal resistance"],["V","Terminal voltage"]], tip:"Terminal voltage equals EMF only when no current is drawn (open circuit) — under load, it's always less than E during discharge."},
    {t:"Kirchhoff's Laws", eq:"Junction Rule: ΣI<sub>in</sub> = ΣI<sub>out</sub>",
     sym:[],
     cases:["Loop Rule: ΣV = 0 around any closed loop"],
     tip:"The junction rule is conservation of charge; the loop rule is conservation of energy — apply both to solve any circuit, however complex."},
    {t:"Wheatstone Bridge — Balance Condition", eq:"P/Q = R/S",
     sym:[["P, Q, R, S","The four resistances in the bridge arms"]],
     cases:["Metre bridge: R/S = l1/(100 − l1), with l1 = balancing length"],
     tip:"At balance, no current flows through the galvanometer arm — this is what makes the bridge method so precise for measuring unknown resistance."},
    {t:"Potentiometer Principle", eq:"k = V/L &nbsp;(potential gradient)",
     sym:[["V","Total potential drop across the potentiometer wire"],["L","Total length of the wire"]],
     cases:["Comparing two EMFs: E1/E2 = l1/l2, where l1, l2 are the balancing lengths for each cell","Internal resistance of a cell: r = R(l1−l2)/l2, where l1 is the balancing length on open circuit and l2 with resistance R connected"],
     tip:"A potentiometer draws no current from the cell being measured at the balance point, making it more accurate than a voltmeter for comparing EMFs."}
  ]},

  {cls:"12", subject:"physics", chapter:"Magnetism & Electromagnetic Induction", formulas:[
    {t:"Biot–Savart Law", eq:"dB = " + frac("μ<sub>0</sub>","4π") + frac("I dl × r̂","r²"),
     sym:[["μ₀","Permeability of free space"],["I dl","Current element"]],
     consts:["μ₀ = 4π × 10⁻⁷ T·m/A"],
     tip:"Magnetic analogue of Coulomb's law for a current element — direction found using the right-hand rule."},
    {t:"Ampere's Circuital Law", eq:"∮B·dl = μ<sub>0</sub>I<sub>enc</sub>",
     sym:[["I_enc","Current enclosed by the loop"]], tip:"Extremely powerful for symmetric current distributions (long wire, solenoid, toroid) — pick an Amperian loop that exploits the symmetry."},
    {t:"Magnetic Field — Standard Current Configurations", eq:"Long straight wire: B = " + frac("μ<sub>0</sub>I","2πr"),
     sym:[["r","Perpendicular distance from the wire"]],
     cases:["Finite wire: B = (μ0I/4πr)(sinθ1 + sinθ2), angles measured from the perpendicular to each end","Centre of a circular loop: B = μ0I/2R", "On the axis of a circular loop: B = μ0IR²/2(R²+x²)^(3/2)", "Inside a long solenoid: B = μ0nI (n = turns per unit length)", "Inside a toroid: B = μ0NI/2πr"],
     tip:"All follow directly from Biot–Savart or Ampere's law applied to that specific geometry — worth knowing as ready-to-use results rather than re-deriving each time."},
    {t:"Force on a Current-Carrying Conductor", eq:"F = BIL sinθ",
     sym:[["B","Magnetic field"],["L","Length of conductor"],["θ","Angle between I and B"]], tip:"Force is maximum when the conductor is perpendicular to B, and zero when parallel to it."},
    {t:"Force on a Moving Charge", eq:"F = qvB sinθ",
     sym:[["q","Charge"],["v","Velocity of charge"]],
     cases:["Radius of the circular path: r = mv/qB","Cyclotron frequency: f = qB/2πm — independent of both speed and radius","Maximum energy gained in a cyclotron: E = q²B²R²/2m"],
     tip:"Magnetic force never does work on a charge — it's always perpendicular to velocity, only changing direction, not speed."},
    {t:"Torque on a Current Loop (Magnetic Dipole)", eq:"τ = NIAB sinθ = M × B",
     sym:[["N","Number of turns"],["A","Area of the loop"],["M","Magnetic moment, M = NIA"],["θ","Angle between the loop's normal and B"]], tip:"Exactly parallel to the electric dipole case (τ = pE sinθ) — a current loop behaves as a magnetic dipole of moment NIA."},
    {t:"Faraday's Law of EMI", eq:"ε = −" + frac("dΦ","dt"),
     sym:[["ε","Induced EMF"],["Φ","Magnetic flux"]], tip:"The negative sign is Lenz's Law — induced EMF always opposes the change in flux that produced it."},
    {t:"Motional EMF", eq:"ε = Bvl",
     sym:[["l","Length of the rod"]],
     cases:["Rod rotating about one end with angular velocity ω: ε = ½Bωl²","Induced electric field: ∮E·dl = −dΦ/dt"],
     tip:"Applies to a straight conductor moving perpendicular to both its length and the field — check all three are mutually perpendicular."},
    {t:"LR Circuit — Growth and Decay of Current", eq:"Growth: I = I<sub>0</sub>(1 − e<sup>−Rt/L</sup>)",
     sym:[["L/R","Time constant τ of the LR circuit"]],
     cases:["Decay: I = I0·e^(−Rt/L)"],
     tip:"Structurally identical to the RC charging/discharging equations — with L/R playing exactly the role that RC does in a capacitor circuit."},
    {t:"LC Oscillations", eq:"f = " + frac("1","2π√(LC)"),
     sym:[],
     cases:["Energy oscillates between the capacitor (½q²/C) and the inductor (½LI²), with the total staying constant"],
     tip:"The electrical analogue of a mass-spring oscillator — charge plays the role of displacement and current the role of velocity."},
    {t:"AC Generator — Maximum EMF", eq:"ε<sub>0</sub> = NBAω",
     sym:[["N","Number of turns"],["A","Area of the coil"],["ω","Angular frequency of rotation"]], tip:"Instantaneous EMF is ε = NBAω sin(ωt) — maximum when the coil's plane is parallel to B (flux changing fastest), not when flux itself is maximum."},
    {t:"Energy Stored in an Inductor", eq:"U = " + frac("1","2") + "LI²",
     sym:[["L","Self-inductance"]], tip:"The magnetic analogue of ½CV² for capacitors — energy is stored in the magnetic field itself."},
    {t:"Self-Inductance of a Solenoid", eq:"L = " + frac("μ<sub>0</sub>N²A","l"),
     sym:[["N","Total number of turns"],["A","Cross-sectional area"],["l","Length of the solenoid"]], tip:"L depends on N² — doubling the turns quadruples the self-inductance, for the same length and area."},
    {t:"Mutual Inductance of Two Coaxial Solenoids", eq:"M = " + frac("μ<sub>0</sub>N<sub>1</sub>N<sub>2</sub>A","l"),
     sym:[["N1, N2","Turns of the two coils"],["A","Common cross-sectional area"]],
     cases:["Induced EMF in coil 2: ε2 = −M(dI1/dt)"],
     tip:"Mutual inductance is symmetric — the M that describes coil 1 inducing EMF in coil 2 is exactly the same M for the reverse situation."},
    {t:"Force Between Two Parallel Current-Carrying Wires", eq:"F/L = " + frac("μ<sub>0</sub>I<sub>1</sub>I<sub>2</sub>","2πd"),
     sym:[["d","Separation between the wires"]], tip:"Currents in the same direction attract; opposite directions repel — this is the basis for the SI definition of the ampere."},
    {t:"Galvanometer → Ammeter (Shunt Resistance)", eq:"S = " + frac("I<sub>g</sub>G","I − I<sub>g</sub>"),
     sym:[["G","Galvanometer resistance"],["I_g","Full-scale deflection current of galvanometer"],["I","Desired full-scale current range"]], tip:"The shunt is connected in PARALLEL and is always low resistance — it diverts most of the current away from the sensitive galvanometer."},
    {t:"Galvanometer → Voltmeter (Series Resistance)", eq:"R = " + frac("V","I<sub>g</sub>") + " − G",
     sym:[["V","Desired full-scale voltage range"]], tip:"The series resistance is always HIGH — a voltmeter must draw negligible current to avoid disturbing the circuit it measures."}
  ]},

  {cls:"12", subject:"physics", chapter:"Alternating Current", formulas:[
    {t:"RMS Value of AC", eq:"I<sub>rms</sub> = " + frac("I<sub>0</sub>","√2"),
     sym:[["I₀","Peak current"]],
     cases:["Average value over a half cycle: I_avg = 2I0/π","Full-wave rectifier output: I_rms = I0/√2, I_avg = 2I0/π","Half-wave rectifier output: I_rms = I0/2, I_avg = I0/π"],
     tip:"RMS value is what a DC meter effectively reads — it's the value that delivers the same average power as an equivalent DC current."},
    {t:"Q-Factor and Bandwidth", eq:"Q = " + frac("1","R") + "√(" + frac("L","C") + ")",
     sym:[["Q","Quality factor — sharpness of resonance"]],
     cases:["Bandwidth: Δω = R/L","Q = ω0/Δω = ω0L/R"],
     tip:"A high Q means a sharp, narrow resonance peak — desirable in radio tuning circuits, where you want to select one frequency and reject neighbours."},
    {t:"Inductive Reactance", eq:"X<sub>L</sub> = ωL",
     sym:[["ω","Angular frequency"],["L","Inductance"]], tip:"XL increases with frequency — an inductor blocks high-frequency AC more than low-frequency AC."},
    {t:"Capacitive Reactance", eq:"X<sub>C</sub> = " + frac("1","ωC"),
     sym:[["C","Capacitance"]], tip:"XC decreases with frequency — the opposite behaviour to an inductor, which is why LC circuits can resonate."},
    {t:"Impedance (Series RLC Circuit)", eq:"Z = √(R² + (X<sub>L</sub> − X<sub>C</sub>)²)",
     sym:[["Z","Total impedance"]], tip:"At resonance XL = XC, so Z reduces to just R — the minimum possible impedance for the circuit."},
    {t:"Resonant Angular Frequency", eq:"ω<sub>0</sub> = " + frac("1","√(LC)"),
     sym:[], tip:"At this frequency, current in a series RLC circuit is maximum since impedance is at its minimum (Z = R)."},
    {t:"Power Factor", eq:"cosφ = R/Z",
     sym:[["φ","Phase angle between V and I"]],
     cases:["Wattless (reactive) current: Irms sinφ — this component does zero average work"],
     tip:"cosφ = 1 for a purely resistive circuit (max power delivered); cosφ = 0 for a purely reactive circuit (no net power consumed)."},
    {t:"Transformer Equation", eq:frac("V<sub>s</sub>","V<sub>p</sub>") + " = " + frac("N<sub>s</sub>","N<sub>p</sub>") + " = " + frac("I<sub>p</sub>","I<sub>s</sub>"),
     sym:[["Np, Ns","Turns in primary and secondary coils"],["Vp, Vs","Primary and secondary voltage"]], tip:"For an ideal (100% efficient) transformer, input power equals output power: VpIp = VsIs — that's where the inverse current ratio comes from."}
  ]},

  {cls:"12", subject:"physics", chapter:"Electromagnetic Waves", formulas:[
    {t:"Speed of EM Waves in Vacuum", eq:"c = " + frac("1","√(μ<sub>0</sub>ε<sub>0</sub>)"),
     sym:[], consts:["c = 3 × 10⁸ m/s"], tip:"This relation was Maxwell's key insight — showing that light itself is an electromagnetic wave."},
    {t:"Relation between E₀ and B₀", eq:"E<sub>0</sub>/B<sub>0</sub> = c",
     sym:[["E₀, B₀","Peak electric and magnetic field amplitudes"]], tip:"The electric and magnetic field amplitudes in an EM wave are always locked together by this ratio."},
    {t:"Average Energy Density of an EM Wave", eq:"u = " + frac("1","2") + "ε<sub>0</sub>E<sub>rms</sub>² + " + frac("B<sub>rms</sub>²","2μ<sub>0</sub>"),
     sym:[], tip:"Energy is shared equally between the electric and magnetic fields on time-average — each contributes exactly half."},
    {t:"Poynting Vector and Intensity", eq:"S = " + frac("1","μ<sub>0</sub>") + "(E × B)",
     sym:[["S","Poynting vector — energy flow per unit area per unit time"]],
     cases:["Intensity: I = ½cε0E0²","Intensity also equals the average magnitude of S"],
     tip:"The Poynting vector points in the wave's direction of propagation — it's literally the direction energy is flowing."},
    {t:"Momentum and Radiation Pressure", eq:"p = U/c &nbsp;(fully absorbed)",
     sym:[["U","Energy delivered by the wave"],["c","Speed of light"]],
     cases:["Fully reflected: p = 2U/c","Radiation pressure (absorbed): P = I/c","Radiation pressure (reflected): P = 2I/c"],
     tip:"A perfectly reflecting surface feels TWICE the pressure of an absorbing one — the wave's momentum reverses rather than merely stopping, doubling the impulse."},
    {t:"Displacement Current", eq:"I<sub>d</sub> = ε<sub>0</sub>" + frac("dΦ<sub>E</sub>","dt"),
     sym:[["Φ_E","Electric flux between the capacitor plates"]], tip:"Maxwell's key addition to Ampere's law — it's what lets a changing electric field (like inside a charging capacitor) produce a magnetic field, even with no actual charge flow."}
  ]},

  {cls:"12", subject:"physics", chapter:"Ray & Wave Optics", formulas:[
    {t:"Mirror Formula", eq:frac("1","v") + " + " + frac("1","u") + " = " + frac("1","f"),
     sym:[["u","Object distance"],["v","Image distance"],["f","Focal length"]], tip:"Use the Cartesian sign convention consistently — distances measured against incident light direction are negative."},
    {t:"Lens Formula", eq:frac("1","v") + " − " + frac("1","u") + " = " + frac("1","f"),
     sym:[], tip:"Note the minus sign, unlike the mirror formula's plus — a frequent source of silly errors in combined lens-mirror problems."},
    {t:"Snell's Law", eq:"n<sub>1</sub> sinθ<sub>1</sub> = n<sub>2</sub> sinθ<sub>2</sub>",
     sym:[["n1, n2","Refractive indices of the two media"]], tip:"Light bends toward the normal when entering a denser medium (n increases), away from it when entering a rarer medium."},
    {t:"Critical Angle for Total Internal Reflection", eq:"sinθ<sub>c</sub> = " + frac("1","n"),
     sym:[["n","Refractive index of denser medium w.r.t. rarer"]], tip:"TIR happens only when light travels from a denser to a rarer medium AND the angle of incidence exceeds θc."},
    {t:"Apparent Depth and Normal Shift", eq:"Apparent depth = " + frac("Real depth","n"),
     sym:[["n","Refractive index of the denser medium"],["t","Thickness of the slab"]],
     cases:["Normal shift through a slab: d = t(1 − 1/n)","The apparent shift through a slab is independent of the object's distance from it"],
     tip:"This is why a swimming pool always looks shallower than it really is, and why a coin at the bottom appears raised."},
    {t:"Refraction at a Single Spherical Surface", eq:frac("n<sub>2</sub>","v") + " − " + frac("n<sub>1</sub>","u") + " = " + frac("n<sub>2</sub> − n<sub>1</sub>","R"),
     sym:[["n1, n2","Refractive indices of the two media"],["R","Radius of curvature of the surface"]], tip:"Applying this formula twice in succession — once per surface — is exactly how the lens maker's formula for a thin lens gets derived."},
    {t:"Young's Double Slit — Fringe Width", eq:"β = " + frac("λD","d"),
     sym:[["λ","Wavelength of light"],["D","Screen distance from slits"],["d","Slit separation"]],
     cases:["Constructive interference (bright fringe): path difference = nλ","Destructive interference (dark fringe): path difference = (n + ½)λ","Fringe shift on inserting a slab of thickness t: Δy = (D/d)(n−1)t"],
     tip:"Fringe width increases with wavelength and screen distance, but decreases as slits are moved further apart."},
    {t:"Resultant Intensity in Interference", eq:"I = I<sub>1</sub> + I<sub>2</sub> + 2√(I<sub>1</sub>I<sub>2</sub>) cosφ",
     sym:[["φ","Phase difference between the two interfering waves"]],
     cases:["Maximum: I_max = (√I1 + √I2)²","Minimum: I_min = (√I1 − √I2)²","Equal intensities I0 each: I = 4I0cos²(φ/2)"],
     tip:"Intensities simply add only when sources are INCOHERENT — the 2√(I1I2)cosφ cross term is exactly what coherence makes possible."},
    {t:"Magnification (Mirror/Lens)", eq:"m = " + frac("v","u") + " = " + frac("h<sub>i</sub>","h<sub>o</sub>"),
     sym:[["h_i, h_o","Image and object height"]], tip:"Negative m means an inverted, real image; positive m means an erect, virtual image (with standard sign convention)."},
    {t:"Lens Maker's Formula", eq:"" + frac("1","f") + " = (n − 1)(" + frac("1","R<sub>1</sub>") + " − " + frac("1","R<sub>2</sub>") + ")",
     sym:[["n","Refractive index of lens material"],["R1, R2","Radii of curvature of the two surfaces"]],
     cases:["Combination of thin lenses in contact: 1/f = 1/f1 + 1/f2"],
     tip:"This is how f is actually determined from the lens's physical shape and material — the lens formula (1/v−1/u=1/f) then uses this f for image problems."},
    {t:"Power of a Lens", eq:"P = " + frac("1","f") + " &nbsp;(f in metres)",
     sym:[["P","Power, measured in dioptres (D)"]],
     cases:["For lenses in contact: P = P1 + P2 + …","Lenses separated by distance d: P = P1 + P2 − dP1P2","Displacement method (convex lens): f = (D²−d²)/4D, where D is object-screen distance and d the displacement between the two sharp-image positions","Silvered lens (equivalent mirror): P_eq = 2P_lens + P_mirror"],
     tip:"Convex (converging) lenses have positive power; concave (diverging) lenses have negative power."},
    {t:"Refraction Through a Prism", eq:"A = r<sub>1</sub> + r<sub>2</sub> &nbsp;&nbsp; δ = i + e − A",
     sym:[["A","Prism angle"],["δ","Angle of deviation"],["i, e","Angles of incidence and emergence"]],
     cases:["At minimum deviation: n = sin((A + δm)/2) / sin(A/2)"],
     tip:"At minimum deviation the ray passes symmetrically through the prism, giving r1 = r2 — this special condition is what makes the formula solvable for n."},
    {t:"Magnifying Power — Simple Microscope", eq:"M = 1 + " + frac("D","f"),
     sym:[["D","Least distance of distinct vision (~25 cm)"],["f","Focal length of the lens"]],
     cases:["Compound microscope (approx.): M ≈ (L/fo) × (D/fe), L = tube length"],
     tip:"Bringing the object closer to the lens (smaller f) increases magnification — this is why a shorter focal length lens magnifies more."},
    {t:"Magnifying Power — Astronomical Telescope", eq:"M = " + frac("f<sub>o</sub>","f<sub>e</sub>"),
     sym:[["fo","Focal length of the objective"],["fe","Focal length of the eyepiece"]], tip:"For normal adjustment (final image at infinity) — a large objective focal length paired with a small eyepiece focal length gives high magnification."},
    {t:"Brewster's Law", eq:"tanθ<sub>B</sub> = n",
     sym:[["θB","Brewster's (polarising) angle"],["n","Refractive index of the medium"]], tip:"At this angle of incidence, the reflected ray is completely plane-polarised, and the reflected and refracted rays are exactly perpendicular to each other."},
    {t:"Single-Slit Diffraction — Central Maximum Width", eq:"Angular width = " + frac("2λ","a"),
     sym:[["a","Slit width"],["λ","Wavelength of light"]], tip:"The central maximum is TWICE as wide as the secondary maxima — a key qualitative difference from the evenly-spaced fringes of double-slit interference."},
    {t:"Malus's Law", eq:"I = I<sub>0</sub> cos²θ",
     sym:[["I0","Intensity of polarised light incident on the analyser"],["θ","Angle between polariser and analyser transmission axes"]], tip:"I is maximum (=I0) when θ=0° (axes aligned) and zero when θ=90° (crossed polarisers) — the basis of every polariser/analyser intensity problem."},
    {t:"Resolving Power (Rayleigh Criterion)", eq:"Telescope: Δθ = " + frac("1.22λ","D"),
     sym:[["D","Aperture diameter of the objective"],["Δθ","Minimum resolvable angular separation"]],
     cases:["Resolving power of a telescope = D/1.22λ","Microscope limit of resolution: d = 1.22λ/(2n sinθ)","Resolving power of a microscope = 2n sinθ/1.22λ"],
     tip:"A larger aperture resolves finer detail — which is precisely why astronomical telescopes are built with such large objective mirrors."}
  ]},

  {cls:"12", subject:"physics", chapter:"Modern Physics", formulas:[
    {t:"Distance of Closest Approach (Rutherford Scattering)", eq:"r<sub>0</sub> = " + frac("1","4πε<sub>0</sub>") + frac("2Ze²","E<sub>k</sub>"),
     sym:[["Z","Atomic number of the nucleus"],["E_k","Kinetic energy of the incoming α-particle"]], tip:"At r0, all the α-particle's kinetic energy has converted to electrostatic PE — this head-on approach gives an upper estimate of the nuclear size."},
    {t:"Photoelectric Equation", eq:"KE<sub>max</sub> = hν − φ",
     sym:[["h","Planck's constant"],["ν","Frequency of incident light"],["φ","Work function of metal"]],
     cases:["Stopping potential: eV0 = hν − φ","Slope of the V0 vs ν graph = h/e; intercept on the ν-axis = threshold frequency ν0"],
     tip:"KE_max depends only on frequency, not intensity — intensity only affects the number of photoelectrons emitted."},
    {t:"Bohr Model — Radius, Velocity, Energy", eq:"r<sub>n</sub> = 0.529 " + frac("n²","Z") + " Å",
     sym:[["n","Principal quantum number"],["Z","Atomic number"]],
     cases:["Velocity: vn = 2.18×10⁶ (Z/n) m/s","Energy: En = −13.6 (Z²/n²) eV","Rydberg formula: 1/λ = RZ²(1/n1² − 1/n2²)"],
     tip:"Radius grows as n², velocity falls as 1/n, and energy rises (toward zero) as 1/n² — worth remembering all three dependencies together."},
    {t:"Moseley's Law for X-Rays", eq:"√ν = a(Z − b)",
     sym:[["a, b","Constants for a given spectral series (b≈1 for the K series)"],["Z","Atomic number"]], tip:"This relation is what established ATOMIC NUMBER (not atomic mass) as the correct ordering principle for the periodic table."},
    {t:"Activity of a Radioactive Sample", eq:"A = λN",
     sym:[["A","Activity — disintegrations per second"],["N","Number of undecayed nuclei present"]],
     cases:["A = A0e^(−λt), decaying with the same exponential as N","Units: 1 becquerel (Bq) = 1 decay/s; 1 curie (Ci) = 3.7×10¹⁰ Bq"],
     tip:"Activity falls off with exactly the same half-life as the nuclei count — so measuring activity is a direct proxy for measuring N."},
    {t:"Half-Life and Mean Life", eq:"t<sub>½</sub> = " + frac("0.693","λ"),
     sym:[],
     cases:["Mean life: τ = 1/λ","Relation: t½ = 0.693τ, so mean life always EXCEEDS half-life","Parallel decay (two routes): λ_eff = λ1 + λ2, so 1/t½(eff) = 1/t½(1) + 1/t½(2)"],
     tip:"0.693 = ln2. For parallel decay routes, the decay CONSTANTS add — not the half-lives."},
    {t:"de Broglie Wavelength", eq:"λ = h/p",
     sym:[["p","Momentum of the particle"]],
     cases:["Electron accelerated through potential V: λ = 12.27/√V Å"],
     tip:"For an electron accelerated through potential V, λ = h/√(2meV) — a commonly combined JEE result."},
    {t:"Bohr Energy Levels (Hydrogen)", eq:"E<sub>n</sub> = −" + frac("13.6","n²") + " eV",
     sym:[], tip:"Energy released in a transition = E_final − E_initial; the emitted photon's energy equals this difference exactly."},
    {t:"Radioactive Decay Law", eq:"N = N<sub>0</sub>e<sup>−λt</sup>",
     sym:[["N₀","Initial number of nuclei"],["λ","Decay constant"]], tip:"Decay is a statistical, memoryless process — the fraction remaining after each half-life is always exactly ½."},
    {t:"Nuclear Radius", eq:"R = R<sub>0</sub>A<sup>1/3</sup>",
     sym:[["A","Mass number"]], consts:["R₀ = 1.2 × 10⁻¹⁵ m"], tip:"Nuclear volume ∝ A directly, since R³ ∝ A — this is why nuclear density is roughly the same for all nuclei."},
    {t:"Mass–Energy Equivalence", eq:"E = mc²",
     sym:[["c","Speed of light"]], tip:"In nuclear physics, mass defect × c² gives binding energy — the key quantity for fission/fusion energy release calculations."},
    {t:"Mass Defect & Binding Energy", eq:"Δm = [Zm<sub>p</sub> + (A−Z)m<sub>n</sub>] − M<sub>nucleus</sub>",
     sym:[["Z","Number of protons"],["A","Mass number"],["M_nucleus","Actual measured mass of the nucleus"]],
     cases:["Binding energy: BE = Δm·c²", "Binding energy per nucleon: BE/A (peaks near iron, A≈56)"],
     tip:"BE/A peaking around iron is exactly why fusion of light nuclei and fission of heavy nuclei both release energy — both move toward that peak."}
  ]},

  {cls:"12", subject:"physics", chapter:"Semiconductor Electronics", formulas:[
    {t:"Current Gain (Common Base)", eq:"α = " + frac("I<sub>C</sub>","I<sub>E</sub>"),
     sym:[["I_C","Collector current"],["I_E","Emitter current"]], tip:"α is always slightly less than 1 (typically 0.95–0.99) since some emitter current is lost as base current."},
    {t:"Current Gain (Common Emitter)", eq:"β = " + frac("I<sub>C</sub>","I<sub>B</sub>") + " &nbsp;&nbsp; β = " + frac("α","1 − α"),
     sym:[["I_B","Base current"]], tip:"β is usually large (50–200) — common-emitter is the preferred configuration for amplification because of this high gain."},
    {t:"Transconductance", eq:"g<sub>m</sub> = " + frac("ΔI<sub>C</sub>","ΔV<sub>BE</sub>"),
     sym:[], tip:"Links input voltage change to output current change — central to small-signal amplifier analysis."},
    {t:"Voltage Gain (CE Amplifier)", eq:"A<sub>v</sub> ≈ β" + frac("R<sub>C</sub>","R<sub>B</sub>"),
     sym:[["R_C, R_B","Collector and base resistances"]], tip:"A rough working approximation — the exact gain also depends on the transistor's output and input impedances."}
  ]},

  {cls:"12", subject:"physics", chapter:"Magnetism & Matter", formulas:[
    {t:"Magnetic Dipole Moment (Current Loop)", eq:"M = NIA",
     sym:[["N","Number of turns"],["I","Current"],["A","Loop area"]], tip:"Direction is given by the right-hand rule, perpendicular to the plane of the loop."},
    {t:"Torque on a Magnetic Dipole", eq:"τ = M × B = MB sinθ",
     sym:[["θ","Angle between M and B"]], tip:"Torque is zero when M is aligned with B (stable equilibrium) and maximum when perpendicular to it."},
    {t:"Time Period of an Oscillating Magnet", eq:"T = 2π√(I/MB)",
     sym:[["I","Moment of inertia of the magnet"]], tip:"Directly analogous to a torsional pendulum — MB plays the role of the restoring 'spring constant'."},
    {t:"Magnetic Field on the Axial Line of a Bar Magnet", eq:"B<sub>axial</sub> = " + frac("μ<sub>0</sub>","4π") + frac("2M","r³"),
     sym:[["r","Distance from centre of magnet (r ≫ length)"]],
     cases:["Equatorial (perpendicular) line: B_eq = (μ0/4π)(M/r³) — exactly half the axial value"],
     tip:"Valid only for a short bar magnet at a point far from it — field on the equatorial line is exactly half this value."},
    {t:"Magnetic Permeability and Susceptibility", eq:"μ<sub>r</sub> = 1 + χ",
     sym:[["μr","Relative permeability, μ/μ0"],["χ","Magnetic susceptibility"]],
     cases:["Magnetisation: M = χH","B = μ0(H + M) = μ0(1+χ)H","Diamagnetic: χ slightly negative; Paramagnetic: χ small positive; Ferromagnetic: χ large positive"],
     tip:"The sign and magnitude of χ alone classifies a material into one of the three magnetic types — a very common one-mark question."},
    {t:"Earth's Magnetic Elements", eq:"B<sub>H</sub> = B cosδ",
     sym:[["δ","Angle of dip (inclination)"],["BH, BV","Horizontal and vertical components of Earth's field"]],
     cases:["Vertical component: BV = B sinδ","tanδ = BV/BH","At the magnetic equator δ=0°; at the magnetic poles δ=90°"],
     tip:"The three elements — declination, dip, and horizontal component — together completely specify Earth's field at any location."},
    {t:"Vibration Magnetometer", eq:"T = 2π√(" + frac("I","MB<sub>H</sub>") + ")",
     sym:[["I","Moment of inertia of the magnet"],["M","Magnetic moment"],["BH","Horizontal component of Earth's field"]], tip:"Used experimentally to compare magnetic moments or measure BH — the same physics as the oscillating-magnet formula, applied specifically to Earth's field."}
  ]},

  /* =========================================================
     CLASS 12 :: CHEMISTRY  (6 chapters)
     ========================================================= */
  {cls:"12", subject:"chemistry", chapter:"Solutions", formulas:[
    {t:"Raoult's Law", eq:"p = p°x",
     sym:[["p°","Vapour pressure of pure solvent"],["x","Mole fraction of solvent"]], tip:"For a solution of two volatile liquids, apply Raoult's law to each component separately and add the partial pressures."},
    {t:"Relative Lowering of Vapour Pressure", eq:frac("p° − p","p°") + " = x<sub>solute</sub>",
     sym:[], tip:"A direct corollary of Raoult's law — this is itself a colligative property, historically the first one studied."},
    {t:"Elevation in Boiling Point", eq:"ΔT<sub>b</sub> = iK<sub>b</sub>m",
     sym:[["K_b","Ebullioscopic constant"],["m","Molality"],["i","van't Hoff factor"]], tip:"i > 1 for solutes that dissociate (electrolytes), i < 1 for solutes that associate, i = 1 for non-electrolytes."},
    {t:"Depression in Freezing Point", eq:"ΔT<sub>f</sub> = iK<sub>f</sub>m",
     sym:[["K_f","Cryoscopic constant"]], tip:"Used to determine molar mass of unknown solutes experimentally — one of the most common numerical setups in JEE."},
    {t:"Osmotic Pressure", eq:"π = iCRT",
     sym:[["C","Molar concentration"],["π","Osmotic pressure"]], tip:"Osmotic pressure is the most sensitive colligative property — even very dilute solutions give a measurable π, useful for large biomolecules."},
    {t:"van't Hoff Factor & Degree of Dissociation", eq:"i = 1 + (n − 1)α",
     sym:[["n","Number of ions/particles produced"],["α","Degree of dissociation"]],
     cases:["Solving for dissociation: α = (i − 1)/(n − 1)","For association: α = (1 − i)·n/(n − 1)","i = (observed colligative property)/(calculated colligative property) = (normal molar mass)/(observed molar mass)"],
     tip:"For association instead of dissociation, use i = 1 − α(1 − 1/n) — the sign logic flips."},
    {t:"Molar Mass Determination from Colligative Properties", eq:"M<sub>2</sub> = " + frac("iK<sub>b</sub> × w<sub>2</sub> × 1000","ΔT<sub>b</sub> × w<sub>1</sub>"),
     sym:[["w2","Mass of solute (g)"],["w1","Mass of solvent (g)"],["M2","Molar mass of solute"]],
     cases:["From freezing point depression: M2 = (iKf·w2·1000)/(ΔTf·w1)","From osmotic pressure: M2 = (i·w2·RT)/(π·V)"],
     tip:"An 'abnormal' molar mass result signals the solute is dissociating or associating — compute i to find out which, and by how much."}
  ]},

  {cls:"12", subject:"chemistry", chapter:"Electrochemistry", formulas:[
    {t:"Nernst Equation", eq:"E = E° − " + frac("0.0591","n") + " log Q &nbsp; (at 298 K)",
     sym:[["E°","Standard electrode potential"],["n","Moles of electrons transferred"],["Q","Reaction quotient"]],
     cases:["At equilibrium (E = 0): log K = nE°/0.0591"],
     tip:"At equilibrium E = 0, giving log K = nE°/0.0591 — links electrochemistry directly to the equilibrium constant."},
    {t:"Faraday's First Law", eq:"m = Zit",
     sym:[["m","Mass deposited"],["Z","Electrochemical equivalent"],["i","Current"],["t","Time"]],
     consts:["1 Faraday = 96500 C/mol"],
     tip:"Combine with m = (Eq. wt × i × t)/96500 when Z isn't directly given — this is the more commonly used working form."},
    {t:"Molar Conductivity", eq:"Λ<sub>m</sub> = " + frac("κ × 1000","C"),
     sym:[["κ","Specific conductivity"],["C","Concentration in mol/L"]], tip:"Λm increases with dilution for both strong and weak electrolytes, but the reason differs — ion count vs. dissociation."},
    {t:"Equivalent Conductivity", eq:"Λ<sub>eq</sub> = " + frac("κ × 1000","Normality"),
     sym:[], tip:"Related to molar conductivity by Λeq = Λm/n-factor — pick whichever the question's units call for."},
    {t:"Kohlrausch's Law", eq:"Λ°<sub>m</sub> = λ°<sub>+</sub> + λ°<sub>−</sub>",
     sym:[["λ°+, λ°−","Limiting ionic conductivities"]],
     cases:["Degree of dissociation: α = Λm/Λ°m","For weak acids: Ka = Cα²/(1−α), with α found from conductivity"],
     tip:"Lets you calculate Λ°m for a weak electrolyte using data from strong electrolytes only — a signature JEE numerical."},
    {t:"Concentration Cell EMF", eq:"E = " + frac("0.0591","n") + " log" + frac("C<sub>2</sub>","C<sub>1</sub>"),
     sym:[["C1, C2","Concentrations at the anode and cathode respectively"]], tip:"E° is exactly zero for a concentration cell (both electrodes are the same material) — the entire EMF comes from the concentration difference alone."},
    {t:"Thermodynamic Relations of a Cell", eq:"ΔS = nF(" + frac("∂E","∂T") + ")<sub>P</sub>",
     sym:[["(∂E/∂T)P","Temperature coefficient of the cell EMF"]],
     cases:["ΔH = nF[T(∂E/∂T)P − E]","ΔG = −nFE"],
     tip:"Measuring how a cell's EMF varies with temperature gives you ΔS and ΔH directly — an elegant electrochemical route to thermodynamic quantities."},
    {t:"Gibbs Energy — EMF Relation", eq:"ΔG° = −nFE°",
     sym:[["F","Faraday constant, 96500 C/mol"]], tip:"A spontaneous cell reaction (ΔG° < 0) always has a positive standard EMF (E° > 0) — check sign consistency."}
  ]},

  {cls:"12", subject:"chemistry", chapter:"Chemical Kinetics", formulas:[
    {t:"Rate Law", eq:"Rate = k[A]<sup>m</sup>[B]<sup>n</sup>",
     sym:[["k","Rate constant"],["m, n","Order w.r.t. A and B (found experimentally)"]], tip:"Order is NOT taken from stoichiometric coefficients — it must be determined experimentally, unlike molecularity."},
    {t:"Units of the Rate Constant by Order", eq:"Zero order: mol L<sup>−1</sup>s<sup>−1</sup>",
     sym:[],
     cases:["First order: s⁻¹","Second order: L mol⁻¹s⁻¹ (M⁻¹s⁻¹)","nth order: (mol L⁻¹)^(1−n) s⁻¹"],
     tip:"Working backward from the units of k in a problem is a fast way to identify the reaction order without doing a full graphical analysis."},
    {t:"Integrated Rate Law (Zero Order)", eq:"[A] = [A]<sub>0</sub> − kt",
     sym:[], tip:"Concentration falls linearly with time — a plot of [A] vs t is a straight line with slope −k, the simplest kinetics graph to spot."},
    {t:"Integrated Rate Law (1st Order)", eq:"k = " + frac("2.303","t") + " log" + frac("[A]<sub>0</sub>","[A]"),
     sym:[["[A]₀","Initial concentration"],["[A]","Concentration at time t"]], tip:"First-order half-life is independent of initial concentration — the hallmark test to identify first-order kinetics."},
    {t:"Integrated Rate Law (2nd Order)", eq:frac("1","[A]") + " − " + frac("1","[A]<sub>0</sub>") + " = kt",
     sym:[], tip:"A plot of 1/[A] vs t gives a straight line for a second-order reaction — the standard graphical identification test."},
    {t:"Half-Life (1st Order)", eq:"t<sub>½</sub> = " + frac("0.693","k"),
     sym:[],
     cases:["Zero order: t½ = [A]₀/2k (DOES depend on initial concentration)","General nth order: t½ ∝ [A]₀^(1−n)"],
     tip:"Unlike first order, zero-order half-life DOES depend on initial concentration — don't confuse the two."},
    {t:"Arrhenius Equation", eq:"k = Ae<sup>−E<sub>a</sub>/RT</sup>",
     sym:[["A","Pre-exponential (frequency) factor"],["E_a","Activation energy"]],
     cases:["Linear form: ln k = ln A − Ea/RT","Two-temperature form: log(k2/k1) = (Ea/2.303R)·(1/T1 − 1/T2)","Temperature coefficient: μ = k(T+10)/k(T) ≈ 2 to 3 for most reactions"],
     tip:"The two-temperature form is what you use in practice — measure k at two temperatures and solve directly for Ea."},
    {t:"Pseudo-First-Order Reactions", eq:"Rate = k′[A], where k′ = k[B]<sub>excess</sub>",
     sym:[["[B]_excess","Concentration of the reagent present in large excess"]], tip:"When one reactant is in vast excess its concentration barely changes, so it folds into the rate constant — ester hydrolysis in excess water is the classic example."}
  ]},

  {cls:"12", subject:"chemistry", chapter:"Solid State", formulas:[
    {t:"Contribution of Atoms in a Unit Cell", eq:"Corner atom: 1/8",
     sym:[],
     cases:["Face-centred atom: 1/2", "Body-centred atom: 1 (whole)", "Edge-centred atom: 1/4"],
     tip:"Adding up these contributions per position is exactly how Z = 1 (SC), 2 (BCC), 4 (FCC) are derived — worth being able to reconstruct rather than just memorise."},
    {t:"Density of Unit Cell", eq:"ρ = " + frac("Z × M","N<sub>A</sub> × a³"),
     sym:[["Z","Number of atoms per unit cell"],["M","Molar mass"],["a","Edge length"],["N_A","Avogadro's number"]],
     consts:["N_A = 6.022 × 10²³ /mol"],
     tip:"Z = 1 (simple cubic), 2 (BCC), 4 (FCC) — memorise these three values, they're used constantly."},
    {t:"Radius–Edge Length Relations", eq:"Simple Cubic: r = a/2",
